---
- name: AIOT Cluster Maintenance
  hosts: maintenance_hosts
  gather_facts: false
  become: true
  vars:
    maintenance_action: health
    confirm_patch: "NO"
    confirm_reboot: "NO"
    reboot_delay_minutes: 1

  tasks:
    - name: Validate action
      ansible.builtin.assert:
        that:
          - maintenance_action in ["health", "update_audit", "os_security_patch", "schedule_reboot", "post_reboot_check", "full_report", "runtime_audit", "cve_scan", "k8s_upgrade_readiness"]
        fail_msg: "Unknown maintenance_action"

    - name: Cluster health check
      ansible.builtin.shell: |
        set -o pipefail
        echo "=== AIOT CLUSTER HEALTH ==="
        date
        echo
        echo "=== HOST ==="
        uptime
        free -h | head -2
        df -h /
        echo
        echo "=== NODES ==="
        kubectl get nodes -o wide
        echo
        BAD_PODS=$(kubectl get pods -A --no-headers 2>/dev/null | awk "BEGIN{c=0} \$4!=\"Running\" && \$4!=\"Completed\" {c++} END{print c+0}")
        BAD_HR=$(flux get hr -A 2>/dev/null | awk "BEGIN{c=0} NR>1 && \$5!=\"True\" {c++} END{print c+0}")
        echo "=== SUMMARY ==="
        echo "bad_pods=$BAD_PODS"
        echo "bad_helmreleases=$BAD_HR"
        echo
        echo "=== BAD PODS ==="
        kubectl get pods -A --no-headers 2>/dev/null | awk "\$4!=\"Running\" && \$4!=\"Completed\" {print}" | head -50 || true
        echo
        echo "=== BAD HELMRELEASES ==="
        flux get hr -A 2>/dev/null | awk "NR==1 || \$5!=\"True\"" || true
        echo
        echo "=== TOP CPU PODS ==="
        kubectl top pod -A --sort-by=cpu 2>/dev/null | head -12 || true
        echo
        echo "=== TOP RAM PODS ==="
        kubectl top pod -A --sort-by=memory 2>/dev/null | head -12 || true
        echo
        if [ "$BAD_PODS" = "0" ] && [ "$BAD_HR" = "0" ]; then
          echo "VERDICT=HEALTHY"
        else
          echo "VERDICT=ATTENTION_REQUIRED"
        fi
      args:
        executable: /bin/bash
      register: health_result
      changed_when: false
      when: maintenance_action in ["health", "post_reboot_check", "full_report"]

    - name: Print cluster health result
      ansible.builtin.debug:
        msg: "{{ health_result.stdout_lines }}"
      when: health_result is defined and health_result.stdout is defined

    - name: Update audit
      ansible.builtin.shell: |
        set -o pipefail
        echo "=== AIOT UPDATE AUDIT ==="
        date
        echo
        echo "=== OS ==="
        cat /etc/os-release | grep -E "^(NAME|VERSION)=|^PRETTY_NAME=" || true
        echo "running_kernel=$(uname -r)"
        echo "installed_kernels:"
        rpm -q kernel-core 2>/dev/null | sort -V | tail -5 || true
        echo
        echo "=== REBOOT CHECK ==="
        if command -v needs-restarting >/dev/null 2>&1; then
          set +e
          needs-restarting -r
          RC=$?
          set -e
          if [ "$RC" = "1" ]; then echo "reboot_required=yes"; else echo "reboot_required=no"; fi
        else
          echo "needs-restarting=missing"
          echo "reboot_required=unknown"
        fi
        echo
        echo "=== SECURITY UPDATES ==="
        if command -v dnf >/dev/null 2>&1; then
          SECURITY_COUNT=$(dnf -q updateinfo list security 2>/dev/null | awk "BEGIN{c=0} NF>0 {c++} END{print c+0}")
          echo "security_updates_count=$SECURITY_COUNT"
          dnf -q updateinfo list security 2>/dev/null | head -30 || true
        else
          echo "security_updates_count=unknown"
        fi
        echo
        echo "=== KUBERNETES / RUNTIME ==="
        kubectl get nodes -o custom-columns=NAME:.metadata.name,VERSION:.status.nodeInfo.kubeletVersion,KERNEL:.status.nodeInfo.kernelVersion,OS:.status.nodeInfo.osImage,CONTAINER:.status.nodeInfo.containerRuntimeVersion
        echo
        k3d version 2>/dev/null || true
        flux --version 2>/dev/null || true
        docker --version 2>/dev/null || true
        containerd --version 2>/dev/null || true
        echo
        echo "VERDICT=AUDIT_COMPLETE"
      args:
        executable: /bin/bash
      register: audit_result
      changed_when: false
      when: maintenance_action in ["update_audit", "full_report"]

    - name: Print update audit result
      ansible.builtin.debug:
        msg: "{{ audit_result.stdout_lines }}"
      when: audit_result is defined and audit_result.stdout is defined

    - name: Runtime audit
      ansible.builtin.shell: |
        set -o pipefail
        echo "=== AIOT RUNTIME AUDIT ==="
        date
        echo
        echo "=== DOCKER CONTAINERS ==="
        docker ps --format "table {% raw %}{{.Names}}\t{{.Status}}\t{{.Image}}{% endraw %}"
        echo
        echo "=== DOCKER STATS ==="
        docker stats --no-stream --format "table {% raw %}{{.Name}}\t{{.CPUPerc}}\t{{.MemUsage}}{% endraw %}" || true
        echo
        echo "=== CHEF AUTOMATE NETWORK ==="
        docker inspect chef-automate --format "{% raw %}{{range .NetworkSettings.Networks}}{{.IPAddress}}{{println}}{{end}}{% endraw %}" 2>/dev/null || true
        CHEF_IP=$(docker inspect chef-automate --format "{% raw %}{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}{% endraw %}" 2>/dev/null || true)
        if echo "$CHEF_IP" | grep -q "172.18.0.8"; then
          echo "chef_automate_fixed_ip=ok"
        else
          echo "chef_automate_fixed_ip=check_required"
        fi
        echo
        echo "VERDICT=RUNTIME_AUDIT_COMPLETE"
      args:
        executable: /bin/bash
      register: runtime_result
      changed_when: false
      when: maintenance_action in ["runtime_audit", "full_report"]

    - name: Print runtime audit result
      ansible.builtin.debug:
        msg: "{{ runtime_result.stdout_lines }}"
      when: runtime_result is defined and runtime_result.stdout is defined

    - name: Confirm OS security patch
      ansible.builtin.assert:
        that:
          - confirm_patch == "YES"
        fail_msg: "Safety stop: set confirm_patch to YES to run OS security patch."
      when: maintenance_action == "os_security_patch"

    - name: OS security patch
      ansible.builtin.shell: |
        set -o pipefail
        echo "=== AIOT OS SECURITY PATCH ==="
        date
        echo "Pre-check: cluster must be healthy."
        BAD_PODS=$(kubectl get pods -A --no-headers 2>/dev/null | awk "BEGIN{c=0} \$4!=\"Running\" && \$4!=\"Completed\" {c++} END{print c+0}")
        BAD_HR=$(flux get hr -A 2>/dev/null | awk "BEGIN{c=0} NR>1 && \$5!=\"True\" {c++} END{print c+0}")
        echo "bad_pods=$BAD_PODS"
        echo "bad_helmreleases=$BAD_HR"
        if [ "$BAD_PODS" != "0" ] || [ "$BAD_HR" != "0" ]; then
          echo "Cluster is not healthy. Refusing patch."
          exit 2
        fi
        echo
        echo "Running dnf security update..."
        dnf -y update --security
        echo
        echo "Reboot check after patch:"
        if command -v needs-restarting >/dev/null 2>&1; then
          set +e
          needs-restarting -r
          RC=$?
          set -e
          if [ "$RC" = "1" ]; then echo "reboot_required=yes"; else echo "reboot_required=no"; fi
        fi
        echo "VERDICT=PATCH_COMPLETE"
      args:
        executable: /bin/bash
      register: patch_result
      changed_when: true
      when: maintenance_action == "os_security_patch"

    - name: Print patch result
      ansible.builtin.debug:
        msg: "{{ patch_result.stdout_lines }}"
      when: patch_result is defined and patch_result.stdout is defined

    - name: Confirm reboot schedule
      ansible.builtin.assert:
        that:
          - confirm_reboot == "YES"
        fail_msg: "Safety stop: set confirm_reboot to YES to schedule reboot."
      when: maintenance_action == "schedule_reboot"

    - name: Schedule safe reboot
      ansible.builtin.shell: |
        set -o pipefail
        echo "=== AIOT SAFE REBOOT SCHEDULE ==="
        date
        BAD_PODS=$(kubectl get pods -A --no-headers 2>/dev/null | awk "BEGIN{c=0} \$4!=\"Running\" && \$4!=\"Completed\" {c++} END{print c+0}")
        BAD_HR=$(flux get hr -A 2>/dev/null | awk "BEGIN{c=0} NR>1 && \$5!=\"True\" {c++} END{print c+0}")
        echo "bad_pods=$BAD_PODS"
        echo "bad_helmreleases=$BAD_HR"
        if [ "$BAD_PODS" != "0" ] || [ "$BAD_HR" != "0" ]; then
          echo "Cluster is not healthy. Refusing reboot."
          exit 2
        fi
        echo "Scheduling host reboot in ${reboot_delay_minutes} minute(s)."
        shutdown -r +${reboot_delay_minutes} "AWX scheduled AIOT maintenance reboot"
        echo "VERDICT=REBOOT_SCHEDULED"
      args:
        executable: /bin/bash
      register: reboot_result
      changed_when: true
      when: maintenance_action == "schedule_reboot"

    - name: Print reboot schedule result
      ansible.builtin.debug:
        msg: "{{ reboot_result.stdout_lines }}"
      when: reboot_result is defined and reboot_result.stdout is defined

    - name: CVE scan lightweight
      ansible.builtin.shell: |
        set -o pipefail
        echo "=== AIOT CVE SCAN LIGHTWEIGHT ==="
        date
        if ! command -v trivy >/dev/null 2>&1; then
          echo "trivy=missing"
          echo "Install trivy on host for full image CVE scans."
          echo "VERDICT=CVE_SCAN_TOOL_MISSING"
          exit 0
        fi
        kubectl get pods -A -o jsonpath="{range .items[*].spec.containers[*]}{.image}{\n}{end}" | sort -u > /tmp/aiot-images.txt
        echo "unique_images=$(wc -l < /tmp/aiot-images.txt)"
        echo "Scanning first 20 images for HIGH/CRITICAL vulnerabilities."
        head -20 /tmp/aiot-images.txt | while read img; do
          echo "--- IMAGE: $img"
          trivy image --quiet --severity HIGH,CRITICAL --ignore-unfixed --no-progress "$img" | head -80 || true
        done
        echo "VERDICT=CVE_SCAN_COMPLETE"
      args:
        executable: /bin/bash
      register: cve_result
      changed_when: false
      when: maintenance_action == "cve_scan"

    - name: Print CVE scan result
      ansible.builtin.debug:
        msg: "{{ cve_result.stdout_lines }}"
      when: cve_result is defined and cve_result.stdout is defined

    - name: Kubernetes upgrade readiness
      ansible.builtin.shell: |
        set -o pipefail
        echo "=== AIOT K8S UPGRADE READINESS ==="
        date
        echo
        echo "=== CURRENT VERSIONS ==="
        kubectl version --short 2>/dev/null || kubectl version 2>/dev/null || true
        kubectl get nodes -o custom-columns=NAME:.metadata.name,VERSION:.status.nodeInfo.kubeletVersion
        echo
        echo "=== API RESOURCES SNAPSHOT ==="
        kubectl api-resources --verbs=list --namespaced -o name | wc -l | awk "{print \"namespaced_api_resources=\"\$1}"
        echo
        if command -v pluto >/dev/null 2>&1; then
          echo "=== PLUTO DEPRECATED API SCAN ==="
          pluto detect-all-in-cluster || true
        elif command -v kubent >/dev/null 2>&1; then
          echo "=== KUBENT DEPRECATED API SCAN ==="
          kubent || true
        else
          echo "deprecated_api_scanner=missing"
          echo "Install pluto or kubent on host for full deprecated API checks."
        fi
        echo
        echo "=== FLUX HEALTH ==="
        flux get all -A 2>/dev/null | awk "NR==1 || \$0 ~ /False|failed|error|stalled/" | head -80 || true
        echo "VERDICT=K8S_READINESS_AUDIT_COMPLETE"
      args:
        executable: /bin/bash
      register: k8s_ready_result
      changed_when: false
      when: maintenance_action == "k8s_upgrade_readiness"

    - name: Print Kubernetes readiness result
      ansible.builtin.debug:
        msg: "{{ k8s_ready_result.stdout_lines }}"
      when: k8s_ready_result is defined and k8s_ready_result.stdout is defined
