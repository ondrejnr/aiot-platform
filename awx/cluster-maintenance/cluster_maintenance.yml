---
- name: AIOT Hetzner Maintenance
  hosts: maintenance_hosts
  gather_facts: false
  become: true
  vars:
    maintenance_action: audit_all
    confirm_patch: "NO"
    confirm_reboot: "NO"
    reboot_delay_minutes: 1

  tasks:
    - name: Validate action
      ansible.builtin.assert:
        that:
          - maintenance_action in ["audit_all", "patch_all", "reboot_if_needed"]
        fail_msg: "Unknown maintenance_action. Use audit_all, patch_all, or reboot_if_needed."

    - name: Audit all available Hetzner updates
      ansible.builtin.shell: |
        set -o pipefail
        echo "=== HETZNER 01 - ZISTIT AKTUALIZACIE CELEHO HETZNERA ==="
        date
        echo
        echo "patch_job_scope=dnf-managed host packages (OS, kernel, Docker/containerd RPM packages if available)"
        echo "reported_not_auto_patched=k3d/k3s cluster version, Flux controllers, Helm app images"
        echo

        github_latest() {
          repo="$1"
          tag=$(curl -fsSL "https://api.github.com/repos/${repo}/releases/latest" 2>/dev/null | sed -n 's/.*"tag_name":[[:space:]]*"\([^"]*\)".*/\1/p' | head -1)
          if [ -n "$tag" ]; then echo "$tag"; else echo "unknown"; fi
        }

        echo "=== HOST HEALTH ==="
        uptime || true
        free -h | head -2 || true
        df -h / /opt /var 2>/dev/null || df -h / || true
        echo

        echo "=== CLUSTER HEALTH ==="
        kubectl get nodes -o wide 2>/dev/null || true
        BAD_PODS=$(kubectl get pods -A --no-headers 2>/dev/null | awk 'BEGIN{c=0} $4!="Running" && $4!="Completed" {c++} END{print c+0}')
        BAD_HR=$(flux get hr -A --no-header 2>/dev/null | awk 'BEGIN{c=0} $5!="True" {c++} END{print c+0}')
        echo "bad_pods=$BAD_PODS"
        echo "bad_helmreleases=$BAD_HR"
        if [ "$BAD_PODS" = "0" ] && [ "$BAD_HR" = "0" ]; then
          echo "cluster_health=healthy"
        else
          echo "cluster_health=attention_required"
          echo "--- bad pods ---"
          kubectl get pods -A --no-headers 2>/dev/null | awk '$4!="Running" && $4!="Completed" {print}' | head -50 || true
          echo "--- bad helmreleases ---"
          flux get hr -A --no-header 2>/dev/null | awk '$5!="True" {print}' | head -n 50 || true
        fi
        echo

        echo "=== OS / DNF AVAILABLE UPDATES ==="
        cat /etc/os-release | grep -E '^(NAME|VERSION)=|^PRETTY_NAME=' || true
        echo "running_kernel=$(uname -r)"
        echo "installed_kernels:"
        rpm -q kernel-core 2>/dev/null | sort -V | tail -5 || true
        if command -v dnf >/dev/null 2>&1; then
          set +e
          dnf -q check-update > /tmp/aiot-dnf-check-update.txt 2>/tmp/aiot-dnf-check-update.err
          DNF_RC=$?
          set -o pipefail
          if [ "$DNF_RC" = "0" ]; then
            echo "all_os_updates_count=0"
            echo "No DNF package updates available."
          elif [ "$DNF_RC" = "100" ]; then
            ALL_UPDATES_COUNT=$(awk 'NF>=3 && $1 !~ /^(Obsoleting|Last)$/ {c++} END{print c+0}' /tmp/aiot-dnf-check-update.txt)
            echo "all_os_updates_count=$ALL_UPDATES_COUNT"
            echo "--- first 80 DNF updates ---"
            head -80 /tmp/aiot-dnf-check-update.txt
          else
            echo "all_os_updates_count=unknown"
            echo "dnf_check_update_rc=$DNF_RC"
            cat /tmp/aiot-dnf-check-update.err || true
          fi
          SECURITY_COUNT=$(dnf -q updateinfo list security updates 2>/dev/null | awk 'BEGIN{c=0} NF>0 {c++} END{print c+0}')
          echo "security_updates_count=$SECURITY_COUNT"
          echo "--- first 50 security advisories ---"
          dnf -q updateinfo list security updates 2>/dev/null | head -50 || true
          echo "--- runtime-related package updates ---"
          grep -E '^(docker|containerd|kernel|runc|libseccomp|openssl|glibc|systemd|podman|buildah)' /tmp/aiot-dnf-check-update.txt 2>/dev/null || true
        else
          echo "dnf=missing"
          echo "all_os_updates_count=unknown"
          echo "security_updates_count=unknown"
        fi
        echo

        echo "=== REBOOT CHECK ==="
        if command -v needs-restarting >/dev/null 2>&1; then
          set +e
          needs-restarting -r > /tmp/aiot-needs-restarting.txt 2>&1
          NEEDS_RC=$?
          set -o pipefail
          cat /tmp/aiot-needs-restarting.txt
          if [ "$NEEDS_RC" = "1" ]; then echo "reboot_required=yes"; else echo "reboot_required=no"; fi
        else
          echo "needs-restarting=missing"
          echo "reboot_required=unknown"
        fi
        echo

        echo "=== BACKGROUND PATCH JOB STATUS ==="
        PATCH_STATUS_FILE=/var/lib/aiot-maintenance/host-patch-status.env
        PATCH_LOG_FILE=/var/log/aiot-host-patch.log
        PATCH_UNIT_STATE=$(systemctl show -p ActiveState --value aiot-host-patch.service 2>/dev/null)
        PATCH_UNIT_SUBSTATE=$(systemctl show -p SubState --value aiot-host-patch.service 2>/dev/null)
        if [ -z "$PATCH_UNIT_STATE" ]; then PATCH_UNIT_STATE=unknown; fi
        if [ -z "$PATCH_UNIT_SUBSTATE" ]; then PATCH_UNIT_SUBSTATE=unknown; fi
        echo "patch_unit_state=${PATCH_UNIT_STATE}"
        echo "patch_unit_substate=${PATCH_UNIT_SUBSTATE}"
        if [ -f "$PATCH_STATUS_FILE" ]; then
          echo "--- status file ---"
          cat "$PATCH_STATUS_FILE"
        else
          echo "patch_status=never_started"
        fi
        if [ -f "$PATCH_LOG_FILE" ]; then
          echo "--- last 80 patch log lines ---"
          if ! tail -80 "$PATCH_LOG_FILE"; then :; fi
        fi
        echo

        echo "=== CURRENT RUNTIME / KUBERNETES / GITOPS VERSIONS ==="
        docker --version 2>/dev/null || true
        containerd --version 2>/dev/null || true
        k3d version 2>/dev/null || true
        kubectl version --client 2>/dev/null || true
        flux --version 2>/dev/null || true
        helm version --short 2>/dev/null || true
        echo
        kubectl get nodes -o custom-columns=NAME:.metadata.name,VERSION:.status.nodeInfo.kubeletVersion,KERNEL:.status.nodeInfo.kernelVersion,OS:.status.nodeInfo.osImage,CONTAINER:.status.nodeInfo.containerRuntimeVersion 2>/dev/null || true
        echo
        echo "--- Flux controllers ---"
        kubectl -n flux-system get deploy -o custom-columns=NAME:.metadata.name,IMAGE:.spec.template.spec.containers[0].image --no-headers 2>/dev/null || true
        echo

        echo "=== LATEST RELEASE CHECKS (ONLINE) ==="
        echo "latest_k3d=$(github_latest k3d-io/k3d)"
        echo "latest_k3s=$(github_latest k3s-io/k3s)"
        echo "latest_flux=$(github_latest fluxcd/flux2)"
        echo "latest_helm=$(github_latest helm/helm)"
        echo "latest_trivy=$(github_latest aquasecurity/trivy)"
        echo "latest_pluto=$(github_latest FairwindsOps/pluto)"
        echo

        echo "=== KUBERNETES DEPRECATED API CHECK ==="
        if command -v pluto >/dev/null 2>&1; then
          pluto detect-all-in-cluster || true
        else
          echo "pluto=missing"
        fi
        echo

        if [ "$BAD_PODS" = "0" ] && [ "$BAD_HR" = "0" ]; then
          echo "VERDICT=AUDIT_COMPLETE"
        else
          echo "VERDICT=AUDIT_COMPLETE_WITH_CLUSTER_WARNINGS"
        fi
      args:
        executable: /bin/bash
      register: audit_all_result
      changed_when: false
      when: maintenance_action == "audit_all"

    - name: Print audit result
      ansible.builtin.debug:
        msg: "{{ audit_all_result.stdout_lines }}"
      when: audit_all_result is defined and audit_all_result.stdout is defined

    - name: Confirm full Hetzner patch
      ansible.builtin.assert:
        that:
          - (confirm_patch | default("NO") | string | trim | upper) == "YES"
        fail_msg: "Safety stop: choose YES in the AWX survey to patch all DNF-managed Hetzner packages."
      when: maintenance_action == "patch_all"

    - name: Start background patch of all DNF-managed Hetzner packages
      ansible.builtin.shell: |
        set -o pipefail
        echo "=== HETZNER 02 - OPATCHOVAT CELY HETZNER ==="
        date
        echo "patch_scope=dnf -y update"
        echo "execution_model=background systemd unit"
        echo "This starts the host patch outside the AWX job so Docker/AWX restarts do not mark this job failed."
        echo "Result is reported by job 1 in BACKGROUND PATCH JOB STATUS."
        echo

        echo "=== PRE-CHECK: CLUSTER MUST BE HEALTHY BEFORE STARTING PATCH ==="
        BAD_PODS=$(kubectl get pods -A --no-headers 2>/dev/null | awk 'BEGIN{c=0} $4!="Running" && $4!="Completed" {c++} END{print c+0}')
        BAD_HR=$(flux get hr -A --no-header 2>/dev/null | awk 'BEGIN{c=0} $5!="True" {c++} END{print c+0}')
        echo "bad_pods=$BAD_PODS"
        echo "bad_helmreleases=$BAD_HR"
        if [ "$BAD_PODS" != "0" ] || [ "$BAD_HR" != "0" ]; then
          echo "Cluster is not healthy. Refusing to start patch. Run job 1 first and fix warnings."
          exit 2
        fi
        echo

        echo "=== CURRENT PATCH UNIT STATE ==="
        PATCH_UNIT_STATE=$(systemctl show -p ActiveState --value aiot-host-patch.service 2>/dev/null)
        PATCH_UNIT_SUBSTATE=$(systemctl show -p SubState --value aiot-host-patch.service 2>/dev/null)
        if [ -z "$PATCH_UNIT_STATE" ]; then PATCH_UNIT_STATE=inactive; fi
        if [ -z "$PATCH_UNIT_SUBSTATE" ]; then PATCH_UNIT_SUBSTATE=unknown; fi
        echo "patch_unit_state=${PATCH_UNIT_STATE}"
        echo "patch_unit_substate=${PATCH_UNIT_SUBSTATE}"
        if [ "$PATCH_UNIT_STATE" = "active" ] || [ "$PATCH_UNIT_STATE" = "activating" ]; then
          echo "Another aiot-host-patch.service run is already active. Refusing to start a second patch."
          echo "VERDICT=PATCH_ALREADY_RUNNING"
          exit 3
        fi
        if ! systemctl reset-failed aiot-host-patch.service >/dev/null 2>&1; then :; fi
        echo

        echo "=== INSTALLING BACKGROUND PATCH RUNNER ==="
        install -d -m 0755 /var/lib/aiot-maintenance
        cat > /usr/local/sbin/aiot-host-patch.sh <<'AIOT_HOST_PATCH_SCRIPT'
        #!/usr/bin/env bash
        set -u
        export HOME="${HOME:-/root}"
        export KUBECONFIG="${KUBECONFIG:-/root/.kube/config}"

        STATE_DIR="/var/lib/aiot-maintenance"
        STATUS_FILE="${STATE_DIR}/host-patch-status.env"
        LOG_FILE="/var/log/aiot-host-patch.log"
        LOCK_FILE="/run/aiot-host-patch.lock"

        mkdir -p "$STATE_DIR"
        touch "$LOG_FILE"
        chmod 0644 "$LOG_FILE"
        exec >> "$LOG_FILE" 2>&1

        STARTED_AT="$(date -Is)"
        DNF_CHECK_RC="not_run"
        DNF_UPDATE_RC="not_run"
        DNF_CONSISTENCY_RC="not_run"
        DNF_AFTER_RC="not_run"
        NEEDS_RESTARTING_RC="not_run"
        UPDATES_BEFORE="unknown"
        UPDATES_AFTER="unknown"
        SECURITY_UPDATES_AFTER="unknown"
        REBOOT_REQUIRED="unknown"
        RUNNING_KERNEL_AT_START="$(uname -r 2>/dev/null)"
        if [ -z "$RUNNING_KERNEL_AT_START" ]; then RUNNING_KERNEL_AT_START=unknown; fi
        RUNNING_KERNEL_AT_END="unknown"
        DOCKER_VERSION_AT_START="$(docker --version 2>/dev/null)"
        if [ -z "$DOCKER_VERSION_AT_START" ]; then DOCKER_VERSION_AT_START=unknown; fi
        DOCKER_VERSION_AT_END="unknown"
        CONTAINERD_VERSION_AT_START="$(containerd --version 2>/dev/null)"
        if [ -z "$CONTAINERD_VERSION_AT_START" ]; then CONTAINERD_VERSION_AT_START=unknown; fi
        CONTAINERD_VERSION_AT_END="unknown"
        MESSAGE="starting"
        FINISH_STATUS="RUNNING"

        log() {
          printf '[%s] %s\n' "$(date -Is)" "$*"
        }

        write_status() {
          local status="$1"
          local finished_at="${2:-}"
          {
            printf 'status=%s\n' "$status"
            printf 'message=%s\n' "$MESSAGE"
            printf 'started_at=%s\n' "$STARTED_AT"
            printf 'finished_at=%s\n' "$finished_at"
            printf 'dnf_check_rc=%s\n' "$DNF_CHECK_RC"
            printf 'dnf_update_rc=%s\n' "$DNF_UPDATE_RC"
            printf 'dnf_consistency_rc=%s\n' "$DNF_CONSISTENCY_RC"
            printf 'dnf_after_rc=%s\n' "$DNF_AFTER_RC"
            printf 'needs_restarting_rc=%s\n' "$NEEDS_RESTARTING_RC"
            printf 'updates_before=%s\n' "$UPDATES_BEFORE"
            printf 'updates_after=%s\n' "$UPDATES_AFTER"
            printf 'security_updates_after=%s\n' "$SECURITY_UPDATES_AFTER"
            printf 'reboot_required=%s\n' "$REBOOT_REQUIRED"
            printf 'running_kernel_at_start=%s\n' "$RUNNING_KERNEL_AT_START"
            printf 'running_kernel_at_end=%s\n' "$RUNNING_KERNEL_AT_END"
            printf 'docker_version_at_start=%s\n' "$DOCKER_VERSION_AT_START"
            printf 'docker_version_at_end=%s\n' "$DOCKER_VERSION_AT_END"
            printf 'containerd_version_at_start=%s\n' "$CONTAINERD_VERSION_AT_START"
            printf 'containerd_version_at_end=%s\n' "$CONTAINERD_VERSION_AT_END"
            printf 'log_file=%s\n' "$LOG_FILE"
          } > "${STATUS_FILE}.tmp"
          mv -f "${STATUS_FILE}.tmp" "$STATUS_FILE"
        }

        finish() {
          local rc=$?
          local finished_at
          finished_at="$(date -Is)"
          RUNNING_KERNEL_AT_END="$(uname -r 2>/dev/null)"
          if [ -z "$RUNNING_KERNEL_AT_END" ]; then RUNNING_KERNEL_AT_END=unknown; fi
          DOCKER_VERSION_AT_END="$(docker --version 2>/dev/null)"
          if [ -z "$DOCKER_VERSION_AT_END" ]; then DOCKER_VERSION_AT_END=unknown; fi
          CONTAINERD_VERSION_AT_END="$(containerd --version 2>/dev/null)"
          if [ -z "$CONTAINERD_VERSION_AT_END" ]; then CONTAINERD_VERSION_AT_END=unknown; fi
          if [ "$rc" = "0" ] && [ "$FINISH_STATUS" = "RUNNING" ]; then
            FINISH_STATUS="COMPLETE"
          fi
          write_status "$FINISH_STATUS" "$finished_at"
          log "finished status=$FINISH_STATUS rc=$rc reboot_required=$REBOOT_REQUIRED"
          exit "$rc"
        }
        trap finish EXIT

        log "starting AIOT host patch"
        exec 9>"$LOCK_FILE"
        if ! flock -n 9; then
          MESSAGE="another patch process already holds lock"
          FINISH_STATUS="ALREADY_RUNNING"
          exit 75
        fi

        if ! command -v dnf >/dev/null 2>&1; then
          MESSAGE="dnf command missing"
          FINISH_STATUS="FAILED"
          exit 127
        fi

        MESSAGE="checking available updates before patch"
        write_status "$FINISH_STATUS" ""
        dnf -q check-update > /tmp/aiot-dnf-before-patch.txt 2>/tmp/aiot-dnf-before-patch.err
        DNF_CHECK_RC=$?
        if [ "$DNF_CHECK_RC" = "100" ]; then
          UPDATES_BEFORE=$(awk 'NF>=3 && $1 !~ /^(Obsoleting|Last)$/ {c++} END{print c+0}' /tmp/aiot-dnf-before-patch.txt)
        elif [ "$DNF_CHECK_RC" = "0" ]; then
          UPDATES_BEFORE=0
        else
          MESSAGE="dnf check-update failed before patch rc=$DNF_CHECK_RC"
          FINISH_STATUS="FAILED"
          exit "$DNF_CHECK_RC"
        fi
        log "updates_before=$UPDATES_BEFORE"

        MESSAGE="running dnf -y update"
        write_status "$FINISH_STATUS" ""
        dnf -y update
        DNF_UPDATE_RC=$?
        if [ "$DNF_UPDATE_RC" != "0" ]; then
          MESSAGE="dnf -y update failed rc=$DNF_UPDATE_RC"
          FINISH_STATUS="FAILED"
          exit "$DNF_UPDATE_RC"
        fi
        log "dnf -y update completed"

        MESSAGE="checking RPM database consistency"
        write_status "$FINISH_STATUS" ""
        dnf check
        DNF_CONSISTENCY_RC=$?
        if [ "$DNF_CONSISTENCY_RC" != "0" ]; then
          MESSAGE="dnf check failed rc=$DNF_CONSISTENCY_RC"
          FINISH_STATUS="FAILED"
          exit "$DNF_CONSISTENCY_RC"
        fi

        MESSAGE="checking remaining updates after patch"
        write_status "$FINISH_STATUS" ""
        dnf -q check-update > /tmp/aiot-dnf-after-patch.txt 2>/tmp/aiot-dnf-after-patch.err
        DNF_AFTER_RC=$?
        if [ "$DNF_AFTER_RC" = "100" ]; then
          UPDATES_AFTER=$(awk 'NF>=3 && $1 !~ /^(Obsoleting|Last)$/ {c++} END{print c+0}' /tmp/aiot-dnf-after-patch.txt)
        elif [ "$DNF_AFTER_RC" = "0" ]; then
          UPDATES_AFTER=0
        else
          MESSAGE="dnf check-update failed after patch rc=$DNF_AFTER_RC"
          FINISH_STATUS="FAILED"
          exit "$DNF_AFTER_RC"
        fi
        SECURITY_UPDATES_AFTER=$(dnf -q updateinfo list security updates 2>/dev/null | awk 'BEGIN{c=0} NF>0 {c++} END{print c+0}')
        log "updates_after=$UPDATES_AFTER security_updates_after=$SECURITY_UPDATES_AFTER"

        MESSAGE="checking reboot requirement"
        write_status "$FINISH_STATUS" ""
        if command -v needs-restarting >/dev/null 2>&1; then
          needs-restarting -r > /tmp/aiot-needs-restarting-after-background-patch.txt 2>&1
          NEEDS_RESTARTING_RC=$?
          if [ "$NEEDS_RESTARTING_RC" = "1" ]; then
            REBOOT_REQUIRED="yes"
          elif [ "$NEEDS_RESTARTING_RC" = "0" ]; then
            REBOOT_REQUIRED="no"
          else
            REBOOT_REQUIRED="unknown"
          fi
          cat /tmp/aiot-needs-restarting-after-background-patch.txt
        fi

        MESSAGE="checking k3d runtime after patch"
        write_status "$FINISH_STATUS" ""
        if ! kubectl get nodes >/dev/null 2>&1; then
          log "Kubernetes API is not reachable after patch; trying known k3d container recovery"
          if ! docker start k3d-aiot-hetzner-server-0 k3d-aiot-hetzner-agent-0 k3d-aiot-hetzner-agent-1 k3d-aiot-hetzner-agent-2 k3d-aiot-hetzner-agent-3 chef-automate; then
            log "docker start recovery command failed"
          fi
          if ! docker restart k3d-aiot-hetzner-serverlb; then
            log "docker restart serverlb recovery command failed"
          fi
        fi

        MESSAGE="patch complete; run job 1 to verify and job 3 if reboot_required=yes"
        FINISH_STATUS="COMPLETE"
        exit 0
        AIOT_HOST_PATCH_SCRIPT
        chmod 0755 /usr/local/sbin/aiot-host-patch.sh
        echo "runner=/usr/local/sbin/aiot-host-patch.sh"
        echo "status_file=/var/lib/aiot-maintenance/host-patch-status.env"
        echo "log_file=/var/log/aiot-host-patch.log"
        echo

        echo "=== STARTING BACKGROUND PATCH UNIT ==="
        systemd-run \
          --unit=aiot-host-patch \
          --description="AIOT background host patch launched from AWX" \
          --collect \
          --setenv=HOME=/root \
          --setenv=KUBECONFIG=/root/.kube/config \
          --property=Type=simple \
          --property=Nice=5 \
          /usr/local/sbin/aiot-host-patch.sh
        SYSTEMD_RUN_RC=$?
        if [ "$SYSTEMD_RUN_RC" != "0" ]; then
          echo "systemd_run_rc=$SYSTEMD_RUN_RC"
          echo "VERDICT=PATCH_START_FAILED"
          exit "$SYSTEMD_RUN_RC"
        fi
        if ! systemctl show aiot-host-patch.service -p ActiveState -p SubState -p FragmentPath --no-pager; then :; fi
        echo
        echo "VERDICT=PATCH_STARTED_BACKGROUND"
        echo "Next: wait for AWX to stay responsive, then run job 1 to check BACKGROUND PATCH JOB STATUS. If reboot_required=yes, run job 3."
      args:
        executable: /bin/bash
      register: patch_all_result
      changed_when: true
      when: maintenance_action == "patch_all"

    - name: Print patch result
      ansible.builtin.debug:
        msg: "{{ patch_all_result.stdout_lines }}"
      when: patch_all_result is defined and patch_all_result.stdout is defined

    - name: Confirm reboot if needed
      ansible.builtin.assert:
        that:
          - (confirm_reboot | default("NO") | string | trim | upper) == "YES"
        fail_msg: "Safety stop: choose YES in the AWX survey to reboot Hetzner only if needed."
      when: maintenance_action == "reboot_if_needed"

    - name: Reboot Hetzner only if needed
      ansible.builtin.shell: |
        set -o pipefail
        echo "=== HETZNER 03 - REBOOT AK TREBA ==="
        date
        echo
        echo "=== CLUSTER STATUS BEFORE REBOOT (ADVISORY ONLY) ==="
        BAD_PODS=$(kubectl get pods -A --no-headers 2>/dev/null | awk 'BEGIN{c=0} $4!="Running" && $4!="Completed" {c++} END{print c+0}')
        BAD_HR=$(flux get hr -A --no-header 2>/dev/null | awk 'BEGIN{c=0} $5!="True" {c++} END{print c+0}')
        echo "bad_pods=$BAD_PODS"
        echo "bad_helmreleases=$BAD_HR"
        if [ "$BAD_PODS" != "0" ] || [ "$BAD_HR" != "0" ]; then
          echo "Cluster has warnings, but reboot is not blocked because host reboot can be required after Docker/kernel patching."
          echo "--- bad pods ---"
          kubectl get pods -A --no-headers 2>/dev/null | awk '$4!="Running" && $4!="Completed" {print}' | head -50
          echo "--- bad helmreleases ---"
          flux get hr -A --no-header 2>/dev/null | awk '$5!="True" {print}' | head -50
        fi
        echo

        echo "=== REBOOT CHECK ==="
        if ! command -v needs-restarting >/dev/null 2>&1; then
          echo "needs-restarting=missing"
          echo "reboot_required=unknown"
          echo "VERDICT=REBOOT_CHECK_FAILED"
          exit 2
        fi
        set +e
        needs-restarting -r > /tmp/aiot-needs-restarting-before-reboot.txt 2>&1
        NEEDS_RC=$?
        set -o pipefail
        cat /tmp/aiot-needs-restarting-before-reboot.txt
        if [ "$NEEDS_RC" = "1" ]; then
          echo "reboot_required=yes"
          echo "Scheduling host reboot in {{ reboot_delay_minutes | int }} minute(s)."
          shutdown -r +{{ reboot_delay_minutes | int }} "AWX scheduled AIOT Hetzner maintenance reboot"
          echo "VERDICT=REBOOT_SCHEDULED"
        else
          echo "reboot_required=no"
          echo "No reboot needed. Nothing scheduled."
          echo "VERDICT=REBOOT_NOT_NEEDED"
        fi
      args:
        executable: /bin/bash
      register: reboot_if_needed_result
      changed_when: true
      when: maintenance_action == "reboot_if_needed"

    - name: Print reboot result
      ansible.builtin.debug:
        msg: "{{ reboot_if_needed_result.stdout_lines }}"
      when: reboot_if_needed_result is defined and reboot_if_needed_result.stdout is defined
