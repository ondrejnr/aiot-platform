jenkins:
  controller:
    admin:
      password: admin123
    ingress:
      enabled: true
      hostName: jenkins.46.4.123.8.nip.io
      ingressClassName: nginx
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
        nginx.ingress.kubernetes.io/ssl-redirect: "true"
      tls:
      - hosts:
        - jenkins.46.4.123.8.nip.io
        secretName: jenkins-tls
    installLatestPlugins: true
    installPlugins:
    - kubernetes
    - workflow-aggregator
    - git
    - configuration-as-code
    - dark-theme
    - oic-auth
    additionalExistingSecrets:
    - name: jenkins-oidc
      keyName: clientSecret
    JCasC:
      configScripts:
        oidc-auth: |
          jenkins:
            securityRealm:
              oic:
                clientId: jenkins
                clientSecret: ${jenkins-oidc-clientSecret}
                serverConfiguration:
                  wellKnown:
                    wellKnownOpenIDConfigurationUrl: https://authentik.46.4.123.8.nip.io/application/o/jenkins/.well-known/openid-configuration
                userNameField: preferred_username
                fullNameFieldName: name
                emailFieldName: email
                groupsFieldName: groups
                logoutFromOpenidProvider: true
                postLogoutRedirectUrl: https://jenkins.46.4.123.8.nip.io
                sendScopesInTokenRequest: true
                properties:
                - escapeHatch:
                    username: admin
                    secret: admin123
                    group: admins
            authorizationStrategy:
              loggedInUsersCanDoAnything:
                allowAnonymousRead: false
    nodeSelector:
      node-role.kubernetes.io/worker: ""
  persistence:
    enabled: true
    storageClass: local-path
    size: 20Gi
