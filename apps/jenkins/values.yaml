jenkins:
  controller:
    admin:
      password: admin123
    ingress:
      enabled: true
      hostName: jenkins.46.4.123.8.nip.io
      ingressClassName: nginx
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
        nginx.ingress.kubernetes.io/ssl-redirect: "true"
      tls:
      - hosts:
        - jenkins.46.4.123.8.nip.io
        secretName: jenkins-tls
    installLatestPlugins: true
    image:
      tag: "2.555.2-jdk21"
    installPlugins:
    - kubernetes
    - workflow-aggregator
    - git
    - configuration-as-code
    - job-dsl
    - dark-theme
    - oic-auth
    additionalExistingSecrets:
    - name: jenkins-oidc
      keyName: clientSecret
    JCasC:
      configScripts:
        oidc-auth: |
          jenkins:
            securityRealm:
              oic:
                clientId: jenkins
                clientSecret: ${jenkins-oidc-clientSecret}
                serverConfiguration:
                  wellKnown:
                    wellKnownOpenIDConfigurationUrl: https://authentik.46.4.123.8.nip.io/application/o/jenkins/.well-known/openid-configuration
                userNameField: preferred_username
                userIdStrategy:
                  caseSensitive: {}
                groupIdStrategy:
                  caseSensitive: {}
                fullNameFieldName: name
                emailFieldName: email
                groupsFieldName: groups
                logoutFromOpenidProvider: true
                postLogoutRedirectUrl: https://jenkins.46.4.123.8.nip.io
                sendScopesInTokenRequest: true
                properties:
                - escapeHatch:
                    username: admin
                    secret: admin123
                    group: admins
            authorizationStrategy:
              loggedInUsersCanDoAnything:
                allowAnonymousRead: false
        gitops-pipeline-job: |
          jobs:
            - script: >
                pipelineJob('aiot-platform-gitops') {
                  description('Gitea -> Jenkins -> OpenTofu/Helm -> Flux pipeline for aiot-platform')
                  triggers {
                    scm('H/2 * * * *')
                  }
                  definition {
                    cpsScm {
                      scm {
                        git {
                          remote {
                            url('http://gitea-http.gitea.svc.cluster.local:3000/aiot-iac/aiot-platform.git')
                            credentials("gitea-git-token")
                          }
                          branch('*/main')
                        }
                      }
                      scriptPath('Jenkinsfile')
                      lightweight(true)
                    }
                  }
                };
                queue("aiot-platform-gitops")
    nodeSelector:
      node-role.kubernetes.io/worker: ""
    resources:
      requests:
        cpu: 100m
        memory: 1Gi
      limits:
        cpu: 1000m
        memory: 2Gi
  persistence:
    enabled: true
    storageClass: nfs
    size: 20Gi
