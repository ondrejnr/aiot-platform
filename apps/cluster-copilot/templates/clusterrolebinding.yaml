apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cluster-copilot-cluster-admin
  labels:
    app.kubernetes.io/name: cluster-copilot
    app.kubernetes.io/part-of: aiot-platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccountName | quote }}
    namespace: {{ .Values.namespace | quote }}
