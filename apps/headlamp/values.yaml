# OIDC RBAC: maps Authentik OIDC identities (as seen by the Kubernetes API
# server) to cluster RBAC. The API server must trust Authentik as an OIDC
# issuer for these tokens to be accepted (see INSTALL.md, "API server OIDC").
# Because the username claim is "preferred_username" (not email), the API
# server prefixes the username with "<issuer-url>#", hence the subject below.
oidcRbac:
  enabled: true
  bindings:
    - name: headlamp-oidc-admin
      clusterRole: cluster-admin
      subjectKind: User
      subject: "https://authentik.46.4.123.8.nip.io/application/o/headlamp/#admin"

headlamp:
  config:
    inCluster: true
    inClusterContextName: main
    extraArgs:
      - "-metrics-enabled"
    env:
      - name: OIDC_INSECURE_SKIP_VERIFY
        value: "true"
    oidc:
      externalSecret:
        enabled: true
        name: headlamp-oidc
      secret:
        create: false
        name: headlamp-oidc


  initContainers:
    - name: seed-prometheus-plugin-config
      image: ghcr.io/headlamp-k8s/headlamp:v0.43.0
      imagePullPolicy: IfNotPresent
      securityContext:
        runAsUser: 0
        runAsGroup: 0
      command:
        - sh
        - -c
        - |
          set -eu
          cp -a /headlamp/frontend/. /work/frontend/
          cat > /work/frontend/headlamp-metrics-defaults.js <<'EOF'
          (function () {
            try {
              var key = "pluginConfigs";
              var cfg = JSON.parse(localStorage.getItem(key) || "{}");
              cfg.prometheus = cfg.prometheus || {};
              cfg.prometheus.main = cfg.prometheus.main || {};
              cfg.prometheus.main.isMetricsEnabled = true;
              cfg.prometheus.main.autoDetect = false;
              cfg.prometheus.main.address = "victoriametrics/vmsingle-victoriametrics-victoria-metrics-k8s-stack:8429";
              cfg.prometheus.main.defaultTimespan = cfg.prometheus.main.defaultTimespan || "24h";
              localStorage.setItem(key, JSON.stringify(cfg));
            } catch (e) {
              console.warn("Headlamp Prometheus defaults failed", e);
            }
          })();
          EOF
          sed -i 's#</head>#<script src="/headlamp-metrics-defaults.js"></script></head>#' /work/frontend/index.html
      volumeMounts:
        - name: patched-frontend
          mountPath: /work/frontend
  volumeMounts:
    - name: patched-frontend
      mountPath: /headlamp/frontend
  volumes:
    - name: patched-frontend
      emptyDir: {}
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
      nginx.ingress.kubernetes.io/proxy-buffer-size: "32k"
      nginx.ingress.kubernetes.io/proxy-buffers-number: "8"
    hosts:
      - host: headlamp.46.4.123.8.nip.io
        paths:
          - path: /
            type: Prefix
    tls:
      - hosts: [headlamp.46.4.123.8.nip.io]
        secretName: headlamp-tls
