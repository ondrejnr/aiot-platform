headlamp:
  config:
    inCluster: true
    inClusterContextName: main
    # K3s API server is not configured to trust Authentik OIDC tokens.
    # Keep Headlamp in in-cluster mode and authenticate to the cluster with a service-account token.
    oidc:
      secret:
        create: false
        name: oidc
      clientID: ""
      clientSecret: ""
      issuerURL: ""
      scopes: ""
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
    hosts:
      - host: headlamp.46.4.123.8.nip.io
        paths:
          - path: /
            type: Prefix
    tls:
      - hosts: [headlamp.46.4.123.8.nip.io]
        secretName: headlamp-tls
