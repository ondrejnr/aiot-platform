headlamp:
  config:
    inCluster: true
    inClusterContextName: main
    extraArgs:
      - "-metrics-enabled"
    oidc:
      externalSecret:
        enabled: true
        name: headlamp-oidc
      secret:
        create: false
        name: headlamp-oidc
      clientID: ""
      clientSecret: ""
      issuerURL: ""
      scopes: ""


  initContainers:
    - name: seed-prometheus-plugin-config
      image: ghcr.io/headlamp-k8s/headlamp:v0.41.0
      imagePullPolicy: IfNotPresent
      securityContext:
        runAsUser: 0
        runAsGroup: 0
      command:
        - sh
        - -c
        - |
          set -eu
          cp -a /headlamp/frontend/. /work/frontend/
          cat > /work/frontend/headlamp-metrics-defaults.js <<'EOF'
          (function () {
            try {
              var key = "pluginConfigs";
              var cfg = JSON.parse(localStorage.getItem(key) || "{}");
              cfg.prometheus = cfg.prometheus || {};
              cfg.prometheus.main = cfg.prometheus.main || {};
              cfg.prometheus.main.isMetricsEnabled = true;
              cfg.prometheus.main.autoDetect = false;
              cfg.prometheus.main.address = "victoriametrics/vmsingle-victoriametrics-victoria-metrics-k8s-stack:8429";
              cfg.prometheus.main.defaultTimespan = cfg.prometheus.main.defaultTimespan || "24h";
              localStorage.setItem(key, JSON.stringify(cfg));
            } catch (e) {
              console.warn("Headlamp Prometheus defaults failed", e);
            }
          })();
          EOF
          sed -i 's#</head>#<script src="/headlamp-metrics-defaults.js"></script></head>#' /work/frontend/index.html
      volumeMounts:
        - name: patched-frontend
          mountPath: /work/frontend
  volumeMounts:
    - name: patched-frontend
      mountPath: /headlamp/frontend
  volumes:
    - name: patched-frontend
      emptyDir: {}
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
    hosts:
      - host: headlamp.46.4.123.8.nip.io
        paths:
          - path: /
            type: Prefix
    tls:
      - hosts: [headlamp.46.4.123.8.nip.io]
        secretName: headlamp-tls
