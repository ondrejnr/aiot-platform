# Secrets consumed by AWX CR
---
# Postgres connection secret (consumed via spec.postgres_configuration_secret)
apiVersion: v1
kind: Secret
metadata:
  name: awx-postgres-configuration
  namespace: awx
stringData:
  host: {{ .Values.postgres.host | quote }}
  port: {{ .Values.postgres.port | quote }}
  database: {{ .Values.postgres.database | quote }}
  username: {{ .Values.postgres.username | quote }}
  password: {{ .Values.postgres.password | quote }}
  sslmode: {{ .Values.postgres.sslmode | quote }}
  type: unmanaged
type: Opaque
---
apiVersion: v1
kind: Secret
metadata:
  name: awx-admin-password
  namespace: awx
stringData:
  password: {{ .Values.awx.adminPassword | quote }}
type: Opaque
---
apiVersion: v1
kind: Secret
metadata:
  name: awx-secret-key
  namespace: awx
stringData:
  secret_key: {{ .Values.awx.secretKey | quote }}
type: Opaque
