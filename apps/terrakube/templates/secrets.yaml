---
# Internal secrets — generujú sa raz, potom sa zachovajú pri upgrade
{{- $existing := lookup "v1" "Secret" "terrakube" "terrakube-internal" -}}
apiVersion: v1
kind: Secret
metadata:
  name: terrakube-internal
  namespace: terrakube
type: Opaque
data:
  patSecret: {{ if and $existing (index $existing.data "patSecret") }}{{ index $existing.data "patSecret" }}{{ else }}{{ randAlphaNum 32 | b64enc }}{{ end }}
  internalSecret: {{ if and $existing (index $existing.data "internalSecret") }}{{ index $existing.data "internalSecret" }}{{ else }}{{ randAlphaNum 32 | b64enc }}{{ end }}
---
# MinIO admin credentials
{{- $minioExisting := lookup "v1" "Secret" "terrakube" "terrakube-minio" -}}
apiVersion: v1
kind: Secret
metadata:
  name: terrakube-minio
  namespace: terrakube
type: Opaque
data:
  root-user: {{ if and $minioExisting (index $minioExisting.data "root-user") }}{{ index $minioExisting.data "root-user" }}{{ else }}{{ "admin" | b64enc }}{{ end }}
  root-password: {{ if and $minioExisting (index $minioExisting.data "root-password") }}{{ index $minioExisting.data "root-password" }}{{ else }}{{ randAlphaNum 24 | b64enc }}{{ end }}
---
# Gitea OAuth client secret pre Dex connector
# !!! Pred prvým inštalom treba ručne vytvoriť OAuth app v Gitea a uložiť secret:
#     kubectl create secret generic terrakube-dex-gitea -n terrakube \
#       --from-literal=GITEA_CLIENT_SECRET=<paste-from-gitea>
# Tento template iba "preserve" — ak existuje, nemení ho, ak nie, vytvorí placeholder.
{{- $giteaExisting := lookup "v1" "Secret" "terrakube" "terrakube-dex-gitea" -}}
{{- if $giteaExisting }}
# (existujúci secret zachovaný — nič nerobíme)
{{- else }}
apiVersion: v1
kind: Secret
metadata:
  name: terrakube-dex-gitea
  namespace: terrakube
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  GITEA_CLIENT_SECRET: "PLEASE-REPLACE-WITH-GITEA-OAUTH-SECRET"
{{- end }}
