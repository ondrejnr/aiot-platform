---
# Záloha pre rebuild: tieto secrety boli pôvodne vytvorené ručne (managed-by=none)
# a chýbali v gite. Teraz ich vytvára overlay chart, takže ich Flux/Helm obnoví.
# Pozn.: rovnaký plaintext-v-git vzor ako values.yaml (databasePassword, minio rootPassword).
apiVersion: v1
kind: Secret
metadata:
  name: terrakube-dex-authentik
  namespace: terrakube
type: Opaque
data:
  # client_secret pre Authentik OIDC connector (dex.connectors[].config.clientSecret)
  # Musí sedieť s Authentik provider pk=60 client_secret (terrakube-secret-1).
  AUTHENTIK_CLIENT_SECRET: dGVycmFrdWJlLXNlY3JldC0x
---
apiVersion: v1
kind: Secret
metadata:
  name: terrakube-db
  namespace: terrakube
type: Opaque
data:
  # heslo do CNPG terrakube DB (api.env AppDatabasePassword)
  password: SWJtNWtzWTZWcU9vTjJrSGRqMU1YUUNjTWhTaA==
