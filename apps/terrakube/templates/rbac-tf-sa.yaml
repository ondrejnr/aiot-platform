---
# Service account pre Terraform kubernetes/helm provider
apiVersion: v1
kind: ServiceAccount
metadata:
  name: terrakube-tf
  namespace: terrakube
---
# Long-lived token (Kubernetes 1.24+ neauto-vytvára, treba manuálne)
apiVersion: v1
kind: Secret
metadata:
  name: terrakube-tf-token
  namespace: terrakube
  annotations:
    kubernetes.io/service-account.name: terrakube-tf
type: kubernetes.io/service-account-token
---
# Cluster-admin pre TF (môžeš zúžiť neskôr)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: terrakube-tf-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: terrakube-tf
    namespace: terrakube
