terrakube:
  name: terrakube

  # ─── INGRESS ───────────────────────────────────────────────
  ingress:
    controller: generic
    useTls: true
    ui:
      enabled: true
      domain: terrakube.46.4.123.8.nip.io
      path: /
      pathType: Prefix
      ingressClassName: nginx
      useTls: true
      tlsSecretName: terrakube-ui-tls
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
        nginx.ingress.kubernetes.io/ssl-redirect: "true"
    api:
      enabled: true
      domain: terrakube-api.46.4.123.8.nip.io
      path: /
      pathType: Prefix
      ingressClassName: nginx
      useTls: true
      tlsSecretName: terrakube-api-tls
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
        nginx.ingress.kubernetes.io/ssl-redirect: "true"
        nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    registry:
      enabled: true
      domain: terrakube-reg.46.4.123.8.nip.io
      path: /
      pathType: Prefix
      ingressClassName: nginx
      useTls: true
      tlsSecretName: terrakube-reg-tls
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
        nginx.ingress.kubernetes.io/ssl-redirect: "true"
    dex:
      enabled: true
      path: /dex
      pathType: Prefix

  # ─── SECURITY ──────────────────────────────────────────────
  security:
    adminGroup: TERRAKUBE_ADMIN
    # patSecret + internalSecret sú injektované cez existingSecret
    # (vidíme nižšie cez api.env)
    dexClientId: terrakube
    dexClientScope: "email openid profile offline_access groups"
    dexIssuer: https://terrakube-api.46.4.123.8.nip.io/dex

  # ─── DEX (vstavaný) ────────────────────────────────────────
  dex:
    enabled: true
    config:
      issuer: https://terrakube-api.46.4.123.8.nip.io/dex
      storage:
        type: memory
      oauth2:
        responseTypes: ["code", "token", "id_token"]
      web:
        allowedOrigins: ["*"]
      staticClients:
        - id: terrakube
          name: Terrakube
          public: true
          redirectURIs:
            - https://terrakube.46.4.123.8.nip.io
            - http://localhost:10001/login
            - http://localhost:10000/login
            - /device/callback
      connectors:
        - type: oidc
          id: authentik
          name: Authentik
          config:
            issuer: https://authentik.46.4.123.8.nip.io/application/o/terrakube/
            clientID: terrakube
            clientSecret: $AUTHENTIK_CLIENT_SECRET
            redirectURI: https://terrakube-api.46.4.123.8.nip.io/dex/callback
            scopes:
              - openid
              - profile
              - email
              - groups
            insecureEnableGroups: true
            getUserInfo: true
            userNameKey: email
    envFrom:
      - secretRef:
          name: terrakube-dex-authentik

  # ─── DATABASE (externý CNPG) ───────────────────────────────
  postgres:
    enabled: false   # vypnúť bitnami chart
  api:
    enabled: true
    replicaCount: "1"
    serviceType: ClusterIP
    defaultDatabase: false
    nodeSelector:
      role: apps
    resources:
      requests: { cpu: 200m, memory: 1Gi }
      limits:   { cpu: 1000m, memory: 2Gi }
    properties:
      databaseType: POSTGRESQL
      databaseHostname: pg-cluster-rw.databases.svc
      databaseName: terrakube
      databaseUser: terrakube
      databasePassword: Ibm5ksY6VqOoN2kHdj1MXQCcMhSh
      # databasePassword sa injektuje cez env z secret terrakube-db
    env:
      - name: org.terrakube.hostname
        value: terrakube-api.46.4.123.8.nip.io
      - name: AppDatabasePassword
        valueFrom:
          secretKeyRef:
            name: terrakube-db
            key: password
      - name: PatSecret
        valueFrom:
          secretKeyRef:
            name: terrakube-internal
            key: patSecret
      - name: InternalSecret
        valueFrom:
          secretKeyRef:
            name: terrakube-internal
            key: internalSecret

  # ─── EXECUTOR ──────────────────────────────────────────────
  executor:
    enabled: true
    replicaCount: "1"
    serviceType: ClusterIP
    nodeSelector:
      role: apps
    resources:
      requests: { cpu: 200m, memory: 1Gi }
      limits:   { cpu: 1000m, memory: 2Gi }
    properties:
      toolsRepository: https://github.com/terrakube-io/terrakube-extensions
      toolsBranch: main
    env:
      - name: InternalSecret
        valueFrom:
          secretKeyRef:
            name: terrakube-internal
            key: internalSecret

  # ─── REGISTRY ──────────────────────────────────────────────
  registry:
    enabled: true
    replicaCount: "1"
    serviceType: ClusterIP
    nodeSelector:
      role: apps
    resources:
      requests: { cpu: 100m, memory: 768Mi }
      limits:   { cpu: 500m, memory: 1Gi }
    env:
      - name: InternalSecret
        valueFrom:
          secretKeyRef:
            name: terrakube-internal
            key: internalSecret

  # ─── UI ────────────────────────────────────────────────────
  ui:
    enabled: true
    replicaCount: "1"
    serviceType: ClusterIP
    nodeSelector:
      role: apps
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits:   { cpu: 200m, memory: 256Mi }

  # ─── STORAGE (vstavaný MinIO + NFS) ────────────────────────
  storage:
    # Musí zostať true: upstream chart viaže MinIO subchart na storage.defaultStorage.
    # Runtime bucket je minio.defaultBuckets nižšie; používame jediný bucket sample.
    defaultStorage: true

  minio:
    enabled: true
    persistence:
      enabled: true
      storageClass: nfs
      size: 20Gi
    auth:
      # existingSecret používa Bitnami MinIO; rootUser/rootPassword tu držíme rovnaké,
      # lebo Terrakube chart ich používa pri generovaní API/executor/registry secretov.
      rootUser: admin
      rootPassword: 3e5d675df1aaa70614450032890c9fe3
      existingSecret: terrakube-minio
    defaultBuckets: "sample"
    nodeSelector:
      role: apps
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits:   { cpu: 500m, memory: 512Mi }

  # ─── REDIS (vstavaný, malý) ────────────────────────────────
  redis:
    enabled: true
    architecture: standalone
    auth:
      enabled: false
    master:
      persistence:
        enabled: true
        storageClass: nfs
        size: 1Gi
      nodeSelector:
        role: apps
      resources:
        requests: { cpu: 50m, memory: 128Mi }
        limits:   { cpu: 200m, memory: 256Mi }
