# DaemonSet emitting native K8s Events on Node objects -> visible in
# Headlamp -> Cluster -> Events with reasons like KernelOops, OOMKilling,
# DockerHung, TaskHung, NodeRebooted, NTPIsDown, ContainerdStart, ...
node-problem-detector:
  hostNetwork: true
  hostPID: true

  tolerations:
    - operator: Exists

  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      namespace: monitoring
      additionalLabels:
        release: prometheus

  rbac:
    create: true
    pspEnabled: false

  resources:
    requests:
      cpu: 10m
      memory: 30Mi
    limits:
      cpu: 100m
      memory: 100Mi
