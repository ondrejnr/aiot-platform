global:
  domain: 46.4.123.8.nip.io
  namespace: aiot

postgres:
  host: pg-cluster-pooler-rw.databases.svc.cluster.local
  port: 5432
  database: aiot
  user: appuser
  password: "AiotPg2026!"

mqtt:
  topic: aiot/sensors/telemetry

redis:
  stream: sensor_data

redpanda:
  topic: sensor-data
  storageSize: 10Gi
  storageClass: local-path

sensorSimulator:
  replicas: 50
  intervalSeconds: 10

bridges:
  mqttToRedis:
    replicas: 8
  redisToRedpanda:
    replicas: 8
  pgSink:
    replicas: 1
    batchMax: 100
    pollMs: 1000
    fetchMaxBytes: 4194304
    maxPartitionFetchBytes: 1048576
    resources:
      requests:
        cpu: 50m
        memory: 512Mi
      limits:
        cpu: 200m
        memory: 2Gi

retention:
  pgDays: 7
  redpandaMs: 604800000
  redpandaBytesPerPartition: 1073741824
