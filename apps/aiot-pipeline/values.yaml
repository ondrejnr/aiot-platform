global:
  domain: 46.4.123.8.nip.io
  namespace: aiot

postgres:
  host: postgresql.authentik.svc.cluster.local
  port: 5432
  database: authentik
  user: authentik
  password: "bankpass"

mqtt:
  topic: aiot/sensors/telemetry

redis:
  stream: sensor_data

redpanda:
  topic: sensor-data
  storageSize: 10Gi
  storageClass: local-path

sensorSimulator:
  replicas: 50
  intervalSeconds: 10

bridges:
  mqttToRedis:
    replicas: 8
  redisToRedpanda:
    replicas: 8
  pgSink:
    replicas: 1
    batchMax: 100
    pollMs: 1000
    # Quoted so Helm/YAML keeps them as strings; Python int() cannot parse
    # the exponential float form (e.g. "4.194304e+06") that bare numbers become.
    fetchMaxBytes: "4194304"
    maxPartitionFetchBytes: "1048576"
    resources:
      requests:
        cpu: 50m
        memory: 512Mi
      limits:
        cpu: 200m
        memory: 2Gi

retention:
  pgDays: 7
  redpandaMs: 604800000
  redpandaBytesPerPartition: 1073741824
