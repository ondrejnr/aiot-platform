global:
  domain: 46.4.123.8.nip.io
  namespace: aiot

postgres:
  host: pg-cluster-pooler-rw.databases.svc.cluster.local
  port: 5432
  database: aiot
  user: appuser
  password: "AiotPg2026!"

mqtt:
  topic: aiot/sensors/telemetry

redis:
  stream: sensor_data

redpanda:
  topic: sensor-data
  storageSize: 10Gi
  storageClass: local-path

sensorSimulator:
  replicas: 10
  intervalSeconds: 2

bridges:
  mqttToRedis:
    replicas: 8
  redisToRedpanda:
    replicas: 8
  pgSink:
    replicas: 12

# PriorityClass names applied to pipeline pods.
# These are created cluster-wide by templates/priorityclasses.yaml.
priorityClass:
  data: aiot-data-critical          # EMQX, Redpanda, Redis
  pipeline: aiot-pipeline-high      # bridges + sensor-simulator

# Retention policy.
# - PG: declarative daily partitions, drop partitions older than pgDays.
# - Redpanda: retention by time AND bytes per partition (whichever fires first).
retention:
  pgDays: 7
  redpandaMs: 86400000              # 24h
  redpandaBytesPerPartition: 1073741824  # 1GiB/partition * 24 = 24GiB cap

# Loadtest namespace guardrails.
# Hard-cap CPU/memory so a runaway emqtt-bench cannot DOS the cluster.
loadtest:
  enabled: true
  namespace: loadtest
  priorityClass: loadtest-low
  quota:
    requestsCpu: "8"
    requestsMemory: "8Gi"
    limitsCpu: "16"
    limitsMemory: "16Gi"
    pods: "20"
