apiVersion: batch/v1
kind: Job
metadata:
  name: aiot-db-init
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/component: db-init
    {{- include "aiot.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/component: db-init
        {{- include "aiot.labels" . | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      containers:
        - name: psql
          image: postgres:17-alpine
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: aiot-pg-credentials
          command: ["/bin/sh", "-c"]
          args:
            - |
              # Idempotent schema: declarative RANGE-partitioned by ts (daily).
              # PK must include partition key in PG; (id, ts) keeps id unique within day.
              psql -v ON_ERROR_STOP=1 <<'SQL'
              create table if not exists sensor_data (
                id bigint generated always as identity,
                ts timestamptz not null,
                sensor_id text,
                location text,
                temperature double precision,
                humidity double precision,
                pressure double precision,
                battery double precision,
                payload jsonb not null,
                ingested_at timestamptz not null default now(),
                primary key (id, ts)
              ) partition by range (ts);
              create index if not exists sensor_data_ts_idx        on sensor_data (ts desc);
              create index if not exists sensor_data_sensor_id_idx on sensor_data (sensor_id);

              -- Pre-create yesterday + today + next 2 days using \gexec (no DO blocks)
              with days as (
                select generate_series(current_date - 1, current_date + 2, '1 day'::interval)::date as d
              )
              select format(
                'create table if not exists sensor_data_%s partition of sensor_data for values from (%L) to (%L);',
                to_char(d, 'YYYYMMDD'), d::timestamptz, (d + 1)::timestamptz
              )
              from days
              \gexec
              SQL
