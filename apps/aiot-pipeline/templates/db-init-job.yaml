apiVersion: batch/v1
kind: Job
metadata:
  name: aiot-db-init
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/component: db-init
    {{- include "aiot.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/component: db-init
        {{- include "aiot.labels" . | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      containers:
        - name: psql
          image: postgres:17-alpine
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: aiot-pg-credentials
          command: ["/bin/sh", "-c"]
          args:
            - |
              psql -v ON_ERROR_STOP=1 -c "
              create table if not exists sensor_data (
                id bigserial primary key,
                ts timestamptz,
                sensor_id text,
                location text,
                temperature double precision,
                humidity double precision,
                pressure double precision,
                battery double precision,
                payload jsonb not null,
                ingested_at timestamptz not null default now()
              );
              create index if not exists sensor_data_ts_idx on sensor_data (ts desc);
              create index if not exists sensor_data_sensor_id_idx on sensor_data (sensor_id);
              "
