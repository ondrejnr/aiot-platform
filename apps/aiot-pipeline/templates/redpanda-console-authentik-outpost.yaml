apiVersion: v1
kind: Service
metadata:
  name: authentik-outpost-proxy
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/component: redpanda-console-authentik-outpost
    {{- include "aiot.labels" . | nindent 4 }}
spec:
  type: ExternalName
  externalName: authentik-server.authentik.svc.cluster.local
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aiot-redpanda-console-authentik-outpost
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/component: redpanda-console-authentik-outpost
    {{- include "aiot.labels" . | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - redpanda.{{ .Values.global.domain }}
      secretName: aiot-redpanda-console-tls
  rules:
    - host: redpanda.{{ .Values.global.domain }}
      http:
        paths:
          - path: /outpost.goauthentik.io
            pathType: Prefix
            backend:
              service:
                name: authentik-outpost-proxy
                port:
                  name: http
