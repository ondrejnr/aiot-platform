{{- $pythonImage := "python:3.12-slim" -}}
apiVersion: v1
kind: Service
metadata:
  name: aiot-sensor-simulator
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/component: sensor-simulator
    {{- include "aiot.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/component: sensor-simulator
  ports:
    - name: noop
      port: 1
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: aiot-sensor-simulator
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/component: sensor-simulator
    {{- include "aiot.labels" . | nindent 4 }}
spec:
  serviceName: aiot-sensor-simulator
  replicas: {{ .Values.sensorSimulator.replicas }}
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/component: sensor-simulator
  template:
    metadata:
      annotations:
        checksum/scripts: {{ include (print $.Template.BasePath "/configmap-scripts.yaml") . | sha256sum }}
      labels:
        app.kubernetes.io/component: sensor-simulator
        {{- include "aiot.labels" . | nindent 8 }}
    spec:
      priorityClassName: {{ .Values.priorityClass.pipeline }}
      terminationGracePeriodSeconds: 5
      containers:
        - name: app
          image: {{ $pythonImage }}
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args: ["pip install --no-cache-dir paho-mqtt >/tmp/pip.log 2>&1 && python /app/sensor_simulator.py"]
          env:
            - name: MQTT_HOST
              value: aiot-emqx
            - name: MQTT_TOPIC
              value: {{ .Values.mqtt.topic | quote }}
            - name: SENSOR_INTERVAL_SECONDS
              value: {{ .Values.sensorSimulator.intervalSeconds | quote }}
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          volumeMounts:
            - name: scripts
              mountPath: /app
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 300m
              memory: 256Mi
      volumes:
        - name: scripts
          configMap:
            name: aiot-pipeline-scripts
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiot-mqtt-to-redis
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/component: mqtt-to-redis
    {{- include "aiot.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.bridges.mqttToRedis.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/component: mqtt-to-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/component: mqtt-to-redis
        {{- include "aiot.labels" . | nindent 8 }}
    spec:
      priorityClassName: {{ .Values.priorityClass.pipeline }}
      containers:
        - name: app
          image: {{ $pythonImage }}
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args: ["pip install --no-cache-dir gmqtt 'redis[hiredis]' >/tmp/pip.log 2>&1 && python /app/mqtt_to_redis.py"]
          env:
            - name: MQTT_HOST
              value: aiot-emqx
            - name: MQTT_TOPIC
              value: {{ .Values.mqtt.topic | quote }}
            - name: REDIS_HOST
              value: aiot-redis
            - name: REDIS_STREAM
              value: {{ .Values.redis.stream | quote }}
          volumeMounts:
            - name: scripts
              mountPath: /app
          resources:
            requests:
              cpu: 200m
              memory: 1Gi
            limits:
              cpu: 500m
              memory: 1Gi
      volumes:
        - name: scripts
          configMap:
            name: aiot-pipeline-scripts
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiot-redis-to-redpanda
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/component: redis-to-redpanda
    {{- include "aiot.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.bridges.redisToRedpanda.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/component: redis-to-redpanda
  template:
    metadata:
      labels:
        app.kubernetes.io/component: redis-to-redpanda
        {{- include "aiot.labels" . | nindent 8 }}
    spec:
      priorityClassName: {{ .Values.priorityClass.pipeline }}
      containers:
        - name: app
          image: {{ $pythonImage }}
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args: ["pip install --no-cache-dir redis kafka-python lz4 >/tmp/pip.log 2>&1 && python /app/redis_to_redpanda.py"]
          env:
            - name: REDIS_HOST
              value: aiot-redis
            - name: REDIS_STREAM
              value: {{ .Values.redis.stream | quote }}
            - name: KAFKA_BROKERS
              value: aiot-redpanda:9092
            - name: KAFKA_TOPIC
              value: {{ .Values.redpanda.topic | quote }}
          volumeMounts:
            - name: scripts
              mountPath: /app
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
      volumes:
        - name: scripts
          configMap:
            name: aiot-pipeline-scripts
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiot-pg-sink
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/component: pg-sink
    {{- include "aiot.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.bridges.pgSink.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/component: pg-sink
  template:
    metadata:
      labels:
        app.kubernetes.io/component: pg-sink
        {{- include "aiot.labels" . | nindent 8 }}
    spec:
      priorityClassName: {{ .Values.priorityClass.pipeline }}
      containers:
        - name: app
          image: {{ $pythonImage }}
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args: ["pip install --no-cache-dir kafka-python lz4 'psycopg[binary]==3.2.*' >/tmp/pip.log 2>&1 && python /app/pg_sink.py"]
          envFrom:
            - secretRef:
                name: aiot-pg-credentials
          env:
            - name: KAFKA_BROKERS
              value: aiot-redpanda:9092
            - name: KAFKA_TOPIC
              value: {{ .Values.redpanda.topic | quote }}
            - name: PG_TABLE
              value: sensor_data
            - name: BATCH_MAX
              value: "{{ .Values.bridges.pgSink.batchMax }}"
            - name: POLL_MS
              value: "{{ .Values.bridges.pgSink.pollMs }}"
            - name: FETCH_MAX_BYTES
              value: {{ .Values.bridges.pgSink.fetchMaxBytes | quote }}
            - name: MAX_PARTITION_FETCH_BYTES
              value: {{ .Values.bridges.pgSink.maxPartitionFetchBytes | quote }}
          volumeMounts:
            - name: scripts
              mountPath: /app
          resources:
{{ toYaml .Values.bridges.pgSink.resources | indent 12 }}
      volumes:
        - name: scripts
          configMap:
            name: aiot-pipeline-scripts