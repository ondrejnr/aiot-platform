apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aiot-emqx-dashboard
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/component: emqx
    {{- include "aiot.labels" . | nindent 4 }}
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header Accept-Encoding "";
      sub_filter '</head>' '<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script><script>(function(){try{var KH="uKV5",AK="YWSCVU8Z55N9N1G1",U="admin",P="AiotEmqx2026!";var ek=localStorage.getItem(KH);if(ek && localStorage.getItem(ek)){console.log("[AL] already authed key="+ek);return;}console.log("[AL] preauth via /api/v5/login");var x=new XMLHttpRequest();x.open("POST","/api/v5/login",false);x.setRequestHeader("Content-Type","application/json");x.send(JSON.stringify({username:U,password:P}));if(x.status<200||x.status>=300){console.error("[AL] login failed",x.status,x.responseText);return;}var r=JSON.parse(x.responseText);if(!r.token){console.error("[AL] no token in resp",r);return;}if(!window.CryptoJS){console.error("[AL] CryptoJS missing");return;}var cs="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";var k="";for(var i=0;i<4;i++)k+=cs[Math.floor(Math.random()*cs.length)];var enc=CryptoJS.AES.encrypt(JSON.stringify(r),AK).toString();localStorage.setItem(KH,k);localStorage.setItem(k,enc);console.log("[AL] preauth OK key="+k);}catch(e){console.error("[AL] error",e);}})();</script></head>';
      sub_filter_once on;
      sub_filter_types text/html;
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - emqx.{{ .Values.global.domain }}
      secretName: aiot-emqx-dashboard-tls
  rules:
    - host: emqx.{{ .Values.global.domain }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aiot-emqx
                port:
                  name: dashboard
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aiot-redpanda-console
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/component: redpanda-console
    {{- include "aiot.labels" . | nindent 4 }}
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/auth-url: http://authentik-server.authentik.svc.cluster.local/outpost.goauthentik.io/auth/nginx
    nginx.ingress.kubernetes.io/auth-signin: https://authentik.{{ .Values.global.domain }}/outpost.goauthentik.io/start?rd=$scheme://$http_host$escaped_request_uri
    nginx.ingress.kubernetes.io/auth-response-headers: Set-Cookie,X-authentik-username,X-authentik-groups,X-authentik-email,X-authentik-name,X-authentik-uid
    nginx.ingress.kubernetes.io/auth-snippet: |
      proxy_set_header X-Forwarded-Host $http_host;
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - redpanda.{{ .Values.global.domain }}
      secretName: aiot-redpanda-console-tls
  rules:
    - host: redpanda.{{ .Values.global.domain }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aiot-redpanda-console
                port:
                  name: http
