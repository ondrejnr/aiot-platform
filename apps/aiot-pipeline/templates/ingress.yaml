apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aiot-emqx-dashboard
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/component: emqx
    {{- include "aiot.labels" . | nindent 4 }}
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/auth-url: http://authentik-server.authentik.svc.cluster.local/outpost.goauthentik.io/auth/nginx
    nginx.ingress.kubernetes.io/auth-signin: https://authentik.{{ .Values.global.domain }}/outpost.goauthentik.io/start?rd=$scheme://$http_host$escaped_request_uri
    nginx.ingress.kubernetes.io/auth-response-headers: Set-Cookie,X-authentik-username,X-authentik-groups,X-authentik-email,X-authentik-name,X-authentik-uid
    nginx.ingress.kubernetes.io/auth-snippet: |
      proxy_set_header X-Forwarded-Host $http_host;
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header Accept-Encoding "";
      sub_filter '</head>' '<script>(function(){var U="admin",P="AiotEmqx2026!",DONE=false,LOG=function(){try{console.log.apply(console,["[autologin]"].concat([].slice.call(arguments)));}catch(e){}};LOG("loaded");function nativeSet(el,val){var proto=Object.getPrototypeOf(el);var desc=Object.getOwnPropertyDescriptor(proto,"value")||Object.getOwnPropertyDescriptor(HTMLInputElement.prototype,"value");if(desc&&desc.set){desc.set.call(el,val);}else{el.value=val;}}function fire(el,t){el.dispatchEvent(new Event(t,{bubbles:true}));}function attempt(){if(DONE)return true;var path=(location.pathname||"")+(location.hash||"");if(path.indexOf("login")<0)return false;var p=document.querySelector("input[type=password]");if(!p)return false;var u=null,all=document.querySelectorAll("input");for(var i=0;i<all.length;i++){var el=all[i];if(el===p)continue;if(el.type==="password")continue;if(el.type==="hidden")continue;if(el.type==="checkbox")continue;u=el;break;}if(!u){LOG("no username input");return false;}LOG("found inputs",u,p);DONE=true;nativeSet(u,U);fire(u,"input");fire(u,"change");nativeSet(p,P);fire(p,"input");fire(p,"change");fire(u,"blur");fire(p,"blur");LOG("values set, will submit in 400ms");setTimeout(function(){var btns=document.querySelectorAll("button");var btn=null;for(var i=0;i<btns.length;i++){var b=btns[i];var tx=(b.textContent||"").toLowerCase();if(b.disabled)continue;if(tx.indexOf("login")>=0||tx.indexOf("sign in")>=0||tx.indexOf("\u767b\u5f55")>=0||b.type==="submit"||b.classList.contains("login-btn")||b.classList.contains("el-button--primary")){btn=b;break;}}if(!btn){LOG("no button found, trying form submit");var f=p.form||u.form;if(f){f.dispatchEvent(new Event("submit",{bubbles:true,cancelable:true}));}return;}LOG("clicking",btn);btn.click();setTimeout(function(){if(location.pathname.indexOf("login")>=0){LOG("still on login after click, trying again");btn.click();}},1500);},400);return true;}var iv=setInterval(function(){try{if(attempt())clearInterval(iv);}catch(e){LOG("err",e);}},250);setTimeout(function(){clearInterval(iv);LOG("timeout reached");},45000);try{var mo=new MutationObserver(function(){attempt();});mo.observe(document.documentElement,{childList:true,subtree:true,attributes:false});setTimeout(function(){mo.disconnect();},45000);}catch(e){}})();</script></head>';
      sub_filter_once on;
      sub_filter_types text/html;
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - emqx.{{ .Values.global.domain }}
      secretName: aiot-emqx-dashboard-tls
  rules:
    - host: emqx.{{ .Values.global.domain }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aiot-emqx
                port:
                  name: dashboard
