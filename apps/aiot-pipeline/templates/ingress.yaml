apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aiot-emqx-dashboard
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/component: emqx
    {{- include "aiot.labels" . | nindent 4 }}
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/auth-url: http://authentik-server.authentik.svc.cluster.local/outpost.goauthentik.io/auth/nginx
    nginx.ingress.kubernetes.io/auth-signin: https://authentik.{{ .Values.global.domain }}/outpost.goauthentik.io/start?rd=$scheme://$http_host$escaped_request_uri
    nginx.ingress.kubernetes.io/auth-response-headers: Set-Cookie,X-authentik-username,X-authentik-groups,X-authentik-email,X-authentik-name,X-authentik-uid
    nginx.ingress.kubernetes.io/auth-snippet: |
      proxy_set_header X-Forwarded-Host $http_host;
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header Accept-Encoding "";
      sub_filter '</head>' '<script>(function(){var DONE=false;function dispatch(el,t){el.dispatchEvent(new Event(t,{bubbles:true}));}function attempt(){if(DONE)return true;if(!location.hash||location.hash.indexOf("login")<0)return false;var inputs=document.querySelectorAll("input");if(inputs.length<2)return false;var u=null,p=null;inputs.forEach(function(el){if(el.type==="password")p=el;else if(!u&&(el.type==="text"||el.type===""))u=el;});if(!u||!p)return false;var btn=document.querySelector("button.login-btn,form button,.login button,button[type=submit]");if(!btn)return false;u.focus();u.value="admin";dispatch(u,"input");dispatch(u,"change");dispatch(u,"blur");p.focus();p.value="AiotEmqx2026!";dispatch(p,"input");dispatch(p,"change");dispatch(p,"blur");DONE=true;setTimeout(function(){btn.click();},150);return true;}var iv=setInterval(function(){if(attempt())clearInterval(iv);},250);setTimeout(function(){clearInterval(iv);},20000);})();</script></head>';
      sub_filter_once on;
      sub_filter_types text/html;
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - emqx.{{ .Values.global.domain }}
      secretName: aiot-emqx-dashboard-tls
  rules:
    - host: emqx.{{ .Values.global.domain }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aiot-emqx
                port:
                  name: dashboard
