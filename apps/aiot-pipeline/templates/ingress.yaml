apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aiot-emqx-dashboard
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/component: emqx
    {{- include "aiot.labels" . | nindent 4 }}
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/auth-url: http://authentik-server.authentik.svc.cluster.local/outpost.goauthentik.io/auth/nginx
    nginx.ingress.kubernetes.io/auth-signin: https://authentik.{{ .Values.global.domain }}/outpost.goauthentik.io/start?rd=$scheme://$http_host$escaped_request_uri
    nginx.ingress.kubernetes.io/auth-response-headers: Set-Cookie,X-authentik-username,X-authentik-groups,X-authentik-email,X-authentik-name,X-authentik-uid
    nginx.ingress.kubernetes.io/auth-snippet: |
      proxy_set_header X-Forwarded-Host $http_host;
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header Accept-Encoding "";
      sub_filter '</head>' '<script>(function(){var U="admin",P="AiotEmqx2026!",DONE=false;function L(){try{console.log.apply(console,["[AL]"].concat([].slice.call(arguments)));}catch(e){}}L("v5 loaded, ua=",navigator.userAgent);function banner(t,bg){var d=document.getElementById("al-banner");if(!d){d=document.createElement("div");d.id="al-banner";d.style.cssText="position:fixed;top:0;left:0;right:0;z-index:99999;padding:6px 12px;font:12px monospace;color:#fff;text-align:center;background:"+bg;document.documentElement.appendChild(d);}d.textContent=t;d.style.background=bg;}banner("[AL] auto-login active","#0a7");function nset(el,val){try{var d=Object.getOwnPropertyDescriptor(Object.getPrototypeOf(el),"value")||Object.getOwnPropertyDescriptor(HTMLInputElement.prototype,"value");if(d&&d.set){d.set.call(el,val);return;}}catch(e){}el.value=val;}function fire(el,t){try{el.dispatchEvent(new Event(t,{bubbles:true}));}catch(e){}}function apiLogin(){L("apiLogin start");return fetch("/api/v5/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:U,password:P})}).then(function(r){return r.json();}).then(function(j){L("login resp",j);if(!j||!j.token)throw new Error("no token");var token=j.token;var keys=["EMQX_USER_INFO","emqx_user_info","user","userInfo","EMQX_DASHBOARD","emqx_dashboard_user"];try{var data=JSON.stringify({token:token,license:j.license||{},version:j.version||""});for(var i=0;i<keys.length;i++){localStorage.setItem(keys[i],data);}L("token stored under keys",keys);}catch(e){L("storage error",e);}banner("[AL] API login OK, reloading","#080");setTimeout(function(){location.replace("/");},800);return true;}).catch(function(e){L("apiLogin failed",e);return false;});}function fillForm(){var path=(location.pathname||"")+(location.hash||"");if(path.indexOf("login")<0)return false;var p=document.querySelector("input[type=password]");if(!p)return false;var u=null,all=document.querySelectorAll("input");for(var i=0;i<all.length;i++){var el=all[i];if(el===p||el.type==="password"||el.type==="hidden"||el.type==="checkbox")continue;u=el;break;}if(!u)return false;L("filling form",u.outerHTML.substring(0,80),p.outerHTML.substring(0,80));banner("[AL] filling form...","#a70");nset(u,U);fire(u,"input");fire(u,"change");fire(u,"blur");nset(p,P);fire(p,"input");fire(p,"change");fire(p,"blur");setTimeout(function(){var btn=null,bs=document.querySelectorAll("button");for(var j=0;j<bs.length;j++){var b=bs[j];if(b.disabled)continue;var t=(b.textContent||"").toLowerCase();if(t.indexOf("login")>=0||t.indexOf("sign in")>=0||b.type==="submit"||b.classList.contains("login-btn")||b.classList.contains("el-button--primary")){btn=b;break;}}if(btn){L("clicking",btn.textContent);btn.click();}else{L("no button, form submit");var f=p.form||u.form;if(f)f.dispatchEvent(new Event("submit",{bubbles:true,cancelable:true}));}},300);return true;}function tryAll(){if(DONE)return;if(fillForm()){DONE=true;setTimeout(function(){if(location.pathname.indexOf("login")>=0){L("still on /login after click, trying API fallback");apiLogin();}else{banner("[AL] success","#080");}},2500);return;}}var iv=setInterval(tryAll,250);setTimeout(function(){clearInterval(iv);if(!DONE){L("form not found in 5s, trying API direct");apiLogin();}},5000);setTimeout(function(){clearInterval(iv);banner("[AL] giving up after 60s","#a00");},60000);try{var mo=new MutationObserver(function(){tryAll();});mo.observe(document.documentElement,{childList:true,subtree:true});setTimeout(function(){mo.disconnect();},60000);}catch(e){}})();</script></head>';
      sub_filter_once on;
      sub_filter_types text/html;
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - emqx.{{ .Values.global.domain }}
      secretName: aiot-emqx-dashboard-tls
  rules:
    - host: emqx.{{ .Values.global.domain }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aiot-emqx
                port:
                  name: dashboard
