apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aiot-emqx-dashboard
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/component: emqx
    {{- include "aiot.labels" . | nindent 4 }}
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/auth-url: http://authentik-server.authentik.svc.cluster.local/outpost.goauthentik.io/auth/nginx
    nginx.ingress.kubernetes.io/auth-signin: https://$http_host/outpost.goauthentik.io/start?rd=$scheme://$http_host$escaped_request_uri
    nginx.ingress.kubernetes.io/auth-response-headers: Set-Cookie,X-authentik-username,X-authentik-groups,X-authentik-email,X-authentik-name,X-authentik-uid
    nginx.ingress.kubernetes.io/auth-snippet: |
      proxy_set_header X-Forwarded-Host $http_host;
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header Accept-Encoding "";
      sub_filter_types text/html application/javascript;
      sub_filter_once off;
      sub_filter 'state:{user:_()||{}' 'state:{user:(window.__EMQX_PREAUTH__||_()||{})';
      sub_filter 'r&&!l.token&&c(o),t()' '(window.__EMQX_PREAUTH__&&!l.token&&s["a"].commit("UPDATE_USER_INFO",window.__EMQX_PREAUTH__)),t()';
      sub_filter '</head>' '<script>(function(){try{var x=new XMLHttpRequest();x.open("POST","/api/v5/login",false);x.setRequestHeader("Content-Type","application/json");x.send(JSON.stringify({username:"admin",password:"AiotEmqx2026!"}));if(x.status>=200&&x.status<300){window.__EMQX_PREAUTH__=JSON.parse(x.responseText);console.log("[AL] preauth OK");}else{console.error("[AL] preauth failed",x.status);}}catch(e){console.error("[AL] err",e);}})();</script></head>';
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - emqx.{{ .Values.global.domain }}
      secretName: aiot-emqx-dashboard-tls
  rules:
    - host: emqx.{{ .Values.global.domain }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aiot-emqx
                port:
                  name: dashboard
