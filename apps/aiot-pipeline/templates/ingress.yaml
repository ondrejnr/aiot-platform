apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aiot-emqx-dashboard
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/component: emqx
    {{- include "aiot.labels" . | nindent 4 }}
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/auth-url: http://authentik-server.authentik.svc.cluster.local/outpost.goauthentik.io/auth/nginx
    nginx.ingress.kubernetes.io/auth-signin: https://authentik.{{ .Values.global.domain }}/outpost.goauthentik.io/start?rd=$scheme://$http_host$escaped_request_uri
    nginx.ingress.kubernetes.io/auth-response-headers: Set-Cookie,X-authentik-username,X-authentik-groups,X-authentik-email,X-authentik-name,X-authentik-uid
    nginx.ingress.kubernetes.io/auth-snippet: |
      proxy_set_header X-Forwarded-Host $http_host;
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header Accept-Encoding "";
      sub_filter '</head>' '<script>(function(){var U="admin",P="AiotEmqx2026!",DONE=false;function dispatch(el,t){el.dispatchEvent(new Event(t,{bubbles:true}));}function attempt(){if(DONE)return true;var path=(location.pathname||"")+(location.hash||"");if(path.indexOf("login")<0)return false;var p=document.querySelector("input[type=password]");if(!p)return false;var u=null,all=document.querySelectorAll("input");for(var i=0;i<all.length;i++){var el=all[i];if(el===p)continue;if(el.type==="password")continue;if(el.type==="hidden")continue;u=el;break;}if(!u)return false;var btn=document.querySelector("button[type=submit],button.login-btn,form button,.login-btn,.el-button--primary");if(!btn)return false;u.focus();u.value=U;dispatch(u,"input");dispatch(u,"change");dispatch(u,"blur");p.focus();p.value=P;dispatch(p,"input");dispatch(p,"change");dispatch(p,"blur");DONE=true;setTimeout(function(){try{btn.click();}catch(e){}setTimeout(function(){if(location.pathname.indexOf("login")>=0){try{var f=p.form||u.form;if(f)f.dispatchEvent(new Event("submit",{bubbles:true,cancelable:true}));}catch(e){}}},800);},200);return true;}var iv=setInterval(function(){if(attempt())clearInterval(iv);},200);setTimeout(function(){clearInterval(iv);},30000);try{var mo=new MutationObserver(function(){attempt();});mo.observe(document.documentElement,{childList:true,subtree:true});setTimeout(function(){mo.disconnect();},30000);}catch(e){}})();</script></head>';
      sub_filter_once on;
      sub_filter_types text/html;
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - emqx.{{ .Values.global.domain }}
      secretName: aiot-emqx-dashboard-tls
  rules:
    - host: emqx.{{ .Values.global.domain }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aiot-emqx
                port:
                  name: dashboard
