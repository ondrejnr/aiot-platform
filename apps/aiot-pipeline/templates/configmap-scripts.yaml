apiVersion: v1
kind: ConfigMap
metadata:
  name: aiot-pipeline-scripts
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "aiot.labels" . | nindent 4 }}
data:
  sensor_simulator.py: |
    import json, os, random, time
    from datetime import datetime, timezone
    import paho.mqtt.client as mqtt

    host = os.getenv("MQTT_HOST", "aiot-emqx")
    port = int(os.getenv("MQTT_PORT", "1883"))
    topic = os.getenv("MQTT_TOPIC", "aiot/sensors/telemetry")
    interval = float(os.getenv("SENSOR_INTERVAL_SECONDS", "2"))
    client = mqtt.Client(client_id="sensor-simulator")
    client.connect(host, port, 60)
    client.loop_start()
    sensors = [f"sensor-{i:03d}" for i in range(1, 11)]
    locations = ["lab", "warehouse", "office", "outside", "plant"]
    print(f"publishing MQTT telemetry to {host}:{port}/{topic}", flush=True)
    while True:
        payload = {
            "ts": datetime.now(timezone.utc).isoformat(),
            "sensor_id": random.choice(sensors),
            "location": random.choice(locations),
            "temperature": round(random.uniform(18.0, 31.0), 2),
            "humidity": round(random.uniform(35.0, 78.0), 2),
            "pressure": round(random.uniform(995.0, 1028.0), 2),
            "battery": round(random.uniform(3.35, 4.20), 3),
        }
        client.publish(topic, json.dumps(payload), qos=1)
        print(json.dumps(payload), flush=True)
        time.sleep(interval)
  mqtt_to_redis.py: |
    import json, os, time
    from datetime import datetime, timezone
    import paho.mqtt.client as mqtt
    import redis

    mqtt_host = os.getenv("MQTT_HOST", "aiot-emqx")
    mqtt_port = int(os.getenv("MQTT_PORT", "1883"))
    topic = os.getenv("MQTT_TOPIC", "aiot/sensors/telemetry")
    redis_host = os.getenv("REDIS_HOST", "aiot-redis")
    stream = os.getenv("REDIS_STREAM", "sensor_data")
    r = redis.Redis(host=redis_host, port=6379, decode_responses=True)

    def on_connect(client, userdata, flags, rc):
        print(f"connected to MQTT rc={rc}; subscribing {topic}", flush=True)
        client.subscribe(topic, qos=1)

    def on_message(client, userdata, msg):
        try:
            payload = json.loads(msg.payload.decode("utf-8"))
            payload["mqtt_topic"] = msg.topic
            payload["mqtt_received_at"] = datetime.now(timezone.utc).isoformat()
            r.xadd(stream, {"payload": json.dumps(payload)}, maxlen=100000, approximate=True)
            print(f"mqtt->redis {payload.get('sensor_id')}", flush=True)
        except Exception as exc:
            print(f"mqtt->redis error: {exc}", flush=True)

    while True:
        try:
            r.ping()
            client = mqtt.Client(client_id="mqtt-to-redis")
            client.on_connect = on_connect
            client.on_message = on_message
            client.connect(mqtt_host, mqtt_port, 60)
            client.loop_forever()
        except Exception as exc:
            print(f"mqtt->redis reconnect after error: {exc}", flush=True)
            time.sleep(5)
  redis_to_redpanda.py: |
    import json, os, socket, time
    import redis
    from kafka import KafkaProducer

    redis_host = os.getenv("REDIS_HOST", "aiot-redis")
    stream = os.getenv("REDIS_STREAM", "sensor_data")
    group = os.getenv("REDIS_GROUP", "redpanda-bridge")
    consumer_name = socket.gethostname()
    brokers = os.getenv("KAFKA_BROKERS", "aiot-redpanda:9092")
    topic = os.getenv("KAFKA_TOPIC", "sensor-data")
    r = redis.Redis(host=redis_host, port=6379, decode_responses=True)

    while True:
        try:
            try:
                r.xgroup_create(stream, group, id="0", mkstream=True)
            except redis.ResponseError as exc:
                if "BUSYGROUP" not in str(exc):
                    raise
            producer = KafkaProducer(
                bootstrap_servers=brokers.split(","),
                value_serializer=lambda value: json.dumps(value).encode("utf-8"),
                linger_ms=100,
            )
            print(f"redis stream {stream} -> redpanda {brokers}/{topic}", flush=True)
            while True:
                rows = r.xreadgroup(group, consumer_name, {stream: ">"}, count=100, block=5000)
                for _, messages in rows:
                    for msg_id, fields in messages:
                        payload = json.loads(fields.get("payload", "{}"))
                        producer.send(topic, payload)
                        r.xack(stream, group, msg_id)
                        print(f"redis->redpanda {payload.get('sensor_id')}", flush=True)
                producer.flush()
        except Exception as exc:
            print(f"redis->redpanda reconnect after error: {exc}", flush=True)
            time.sleep(5)
  pg_sink.py: |
    import json, os, time
    from kafka import KafkaConsumer
    import psycopg2
    import psycopg2.extras

    brokers = os.getenv("KAFKA_BROKERS", "aiot-redpanda:9092")
    topic = os.getenv("KAFKA_TOPIC", "sensor-data")
    table = os.getenv("PG_TABLE", "sensor_data")

    create_sql = f"""
    create table if not exists {table} (
      id bigserial primary key,
      ts timestamptz,
      sensor_id text,
      location text,
      temperature double precision,
      humidity double precision,
      pressure double precision,
      battery double precision,
      payload jsonb not null,
      ingested_at timestamptz not null default now()
    );
    create index if not exists {table}_ts_idx on {table} (ts desc);
    create index if not exists {table}_sensor_id_idx on {table} (sensor_id);
    """
    insert_sql = f"""
    insert into {table} (ts, sensor_id, location, temperature, humidity, pressure, battery, payload)
    values (%s, %s, %s, %s, %s, %s, %s, %s)
    """

    def pg_connect():
        return psycopg2.connect(
            host=os.getenv("PGHOST"),
            port=int(os.getenv("PGPORT", "5432")),
            dbname=os.getenv("PGDATABASE"),
            user=os.getenv("PGUSER"),
            password=os.getenv("PGPASSWORD"),
        )

    while True:
        try:
            conn = pg_connect()
            conn.autocommit = True
            with conn.cursor() as cur:
                cur.execute(create_sql)
            conn.autocommit = False
            consumer = KafkaConsumer(
                topic,
                bootstrap_servers=brokers.split(","),
                group_id="pg-sink",
                auto_offset_reset="earliest",
                enable_auto_commit=False,
                value_deserializer=lambda value: json.loads(value.decode("utf-8")),
            )
            print(f"redpanda {brokers}/{topic} -> postgres {os.getenv('PGHOST')}/{os.getenv('PGDATABASE')}.{table}", flush=True)
            for msg in consumer:
                payload = msg.value
                with conn.cursor() as cur:
                    cur.execute(insert_sql, (
                        payload.get("ts"), payload.get("sensor_id"), payload.get("location"),
                        payload.get("temperature"), payload.get("humidity"), payload.get("pressure"),
                        payload.get("battery"), psycopg2.extras.Json(payload),
                    ))
                conn.commit()
                consumer.commit()
                print(f"redpanda->pg {payload.get('sensor_id')}", flush=True)
        except Exception as exc:
            print(f"pg-sink reconnect after error: {exc}", flush=True)
            time.sleep(5)
