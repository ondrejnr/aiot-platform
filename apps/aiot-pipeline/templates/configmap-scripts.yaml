apiVersion: v1
kind: ConfigMap
metadata:
  name: aiot-pipeline-scripts
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "aiot.labels" . | nindent 4 }}
data:
  sensor_simulator.py: |
    import json, os, random, socket, time, hashlib
    from datetime import datetime, timezone
    import paho.mqtt.client as mqtt

    host = os.getenv("MQTT_HOST", "aiot-emqx")
    port = int(os.getenv("MQTT_PORT", "1883"))
    topic = os.getenv("MQTT_TOPIC", "aiot/sensors/telemetry")
    interval = float(os.getenv("SENSOR_INTERVAL_SECONDS", "2"))
    pool_size = int(os.getenv("SENSOR_POOL_SIZE", "50"))
    hostname = socket.gethostname()
    # Stable index per pod -> exactly one sensor_id per replica
    h = int(hashlib.sha1(hostname.encode()).hexdigest(), 16)
    sensor_id = f"sensor-{(h % pool_size) + 1:03d}"
    location = ["lab", "warehouse", "office", "outside", "plant"][h % 5]
    client_id = f"sensor-sim-{hostname}"
    client = mqtt.Client(
        client_id=client_id,
        callback_api_version=mqtt.CallbackAPIVersion.VERSION2,
    )
    while True:
        try:
            client.connect(host, port, 60)
            break
        except Exception as exc:
            print(f"{client_id} waiting for {host}:{port}: {exc}", flush=True)
            time.sleep(3)
    client.loop_start()
    print(f"{client_id} publishing as {sensor_id}@{location} -> {host}:{port}/{topic}", flush=True)
    n = 0
    last = time.monotonic()
    while True:
        payload = {
            "ts": datetime.now(timezone.utc).isoformat(),
            "sensor_id": sensor_id,
            "location": location,
            "temperature": round(random.uniform(18.0, 31.0), 2),
            "humidity": round(random.uniform(35.0, 78.0), 2),
            "pressure": round(random.uniform(995.0, 1028.0), 2),
            "battery": round(random.uniform(3.35, 4.20), 3),
        }
        client.publish(topic, json.dumps(payload), qos=0)
        n += 1
        if time.monotonic() - last >= 30:
            print(f"{sensor_id} published total={n}", flush=True)
            last = time.monotonic()
        time.sleep(interval)
  mqtt_to_redis.py: |
    # Async MQTT -> Redis Stream bridge using gmqtt + redis.asyncio.
    # MQTT v5 shared subscription so replicas split the load.
    # N writer tasks drain an asyncio.Queue and flush pipelined XADDs in batches.
    import asyncio, os, signal, time, uuid
    from gmqtt import Client as MQTTClient
    from gmqtt.mqtt.constants import MQTTv50
    import redis.asyncio as aioredis

    mqtt_host    = os.getenv("MQTT_HOST", "aiot-emqx")
    mqtt_port    = int(os.getenv("MQTT_PORT", "1883"))
    topic        = os.getenv("MQTT_TOPIC", "aiot/sensors/telemetry")
    share_group  = os.getenv("MQTT_SHARE_GROUP", "g1")
    redis_host   = os.getenv("REDIS_HOST", "aiot-redis")
    stream       = os.getenv("REDIS_STREAM", "sensor_data")
    batch_size   = int(os.getenv("BATCH_SIZE", "1000"))
    batch_ms     = int(os.getenv("BATCH_MS", "20"))
    queue_max    = int(os.getenv("QUEUE_MAX", "200000"))
    stream_maxlen= int(os.getenv("STREAM_MAXLEN", "500000"))
    writers      = int(os.getenv("WRITERS", "4"))
    sub_qos      = int(os.getenv("MQTT_QOS", "1"))

    sub_topic = f"$share/{share_group}/{topic}"
    counter = {"in": 0, "out": 0, "drop": 0, "errors": 0}
    STOP = asyncio.Event()

    async def writer(idx, q, r):
        # Drain up to batch_size or until batch_ms elapses, then pipeline XADD.
        while True:
            try:
                first = await q.get()
            except asyncio.CancelledError:
                return
            items = [first]
            deadline = asyncio.get_event_loop().time() + batch_ms / 1000.0
            while len(items) < batch_size:
                timeout = deadline - asyncio.get_event_loop().time()
                if timeout <= 0:
                    break
                try:
                    items.append(await asyncio.wait_for(q.get(), timeout=timeout))
                except asyncio.TimeoutError:
                    break
            try:
                pipe = r.pipeline(transaction=False)
                for payload in items:
                    pipe.xadd(stream, {b"payload": payload}, maxlen=stream_maxlen, approximate=True)
                await pipe.execute()
                counter["out"] += len(items)
            except Exception as exc:
                # OOM / connection / timeout: drop the batch instead of blocking.
                # Stream MAXLEN + maxmemory=noeviction means producer must shed load.
                msg = str(exc)
                counter["errors"] += 1
                counter["drop"] += len(items)
                if counter["errors"] % 50 == 1:
                    print(f"writer{idx} drop {len(items)} after error: {msg[:200]}", flush=True)
                # Short backoff only on connection-level errors, not on OOM
                if "OOM" not in msg and "command not allowed" not in msg:
                    await asyncio.sleep(0.2)

    async def reporter(q):
        while not STOP.is_set():
            await asyncio.sleep(10)
            print(
                f"mqtt->redis stats in={counter['in']} out={counter['out']} "
                f"drop={counter['drop']} errors={counter['errors']} q={q.qsize()}",
                flush=True,
            )

    async def run():
        r = aioredis.Redis(host=redis_host, port=6379, decode_responses=False)
        await r.ping()
        q = asyncio.Queue(maxsize=queue_max)

        def on_connect(client, flags, rc, properties):
            print(f"connected to MQTT rc={rc}; subscribing {sub_topic} qos={sub_qos}", flush=True)
            client.subscribe(sub_topic, qos=sub_qos)

        def on_disconnect(client, packet, exc=None):
            print(f"disconnected from MQTT exc={exc}", flush=True)

        def on_message(client, topic_, payload, qos, properties):
            counter["in"] += 1
            try:
                q.put_nowait(bytes(payload))
            except asyncio.QueueFull:
                counter["drop"] += 1
            return 0

        tasks = [asyncio.create_task(writer(i, q, r)) for i in range(writers)]
        tasks.append(asyncio.create_task(reporter(q)))

        while not STOP.is_set():
            client = MQTTClient(f"mqtt-to-redis-{uuid.uuid4().hex[:10]}")
            client.on_connect = on_connect
            client.on_disconnect = on_disconnect
            client.on_message = on_message
            try:
                await client.connect(mqtt_host, mqtt_port, version=MQTTv50, keepalive=120)
                await STOP.wait()
                await client.disconnect()
                break
            except Exception as exc:
                print(f"mqtt->redis reconnect after error: {exc}", flush=True)
                try:
                    await client.disconnect()
                except Exception:
                    pass
                await asyncio.sleep(3)

        for t in tasks:
            t.cancel()
        await asyncio.gather(*tasks, return_exceptions=True)
        await r.aclose()

    def _stop(*_):
        STOP.set()

    loop = asyncio.new_event_loop()
    asyncio.set_event_loop(loop)
    for sig in (signal.SIGTERM, signal.SIGINT):
        loop.add_signal_handler(sig, _stop)
    loop.run_until_complete(run())
  redis_to_redpanda.py: |
    # Redis Stream -> Redpanda bridge with batched XREAD/XACK and batched produce.
    import os, socket, time
    import redis
    from kafka import KafkaProducer

    redis_host  = os.getenv("REDIS_HOST", "aiot-redis")
    stream      = os.getenv("REDIS_STREAM", "sensor_data")
    group       = os.getenv("REDIS_GROUP", "redpanda-bridge")
    consumer    = socket.gethostname()
    brokers     = os.getenv("KAFKA_BROKERS", "aiot-redpanda:9092")
    topic       = os.getenv("KAFKA_TOPIC", "sensor-data")
    batch_count = int(os.getenv("BATCH_COUNT", "2000"))
    block_ms    = int(os.getenv("BLOCK_MS", "200"))

    r = redis.Redis(host=redis_host, port=6379, decode_responses=False, socket_keepalive=True)
    counter = {"in": 0, "out": 0, "errors": 0}
    last_report = time.monotonic()

    def report():
        global last_report
        now = time.monotonic()
        if now - last_report >= 10:
            print(f"redis->redpanda in={counter['in']} out={counter['out']} errors={counter['errors']}", flush=True)
            last_report = now

    while True:
        try:
            try:
                r.xgroup_create(stream, group, id="0", mkstream=True)
            except redis.ResponseError as exc:
                if "BUSYGROUP" not in str(exc):
                    raise
            producer = KafkaProducer(
                bootstrap_servers=brokers.split(","),
                value_serializer=None,
                key_serializer=None,
                linger_ms=5,
                batch_size=524288,
                buffer_memory=256 * 1024 * 1024,
                compression_type="lz4",
                acks=1,
                max_in_flight_requests_per_connection=10,
            )
            print(f"redis stream {stream} -> redpanda {brokers}/{topic}", flush=True)
            while True:
                rows = r.xreadgroup(group, consumer, {stream: b">"}, count=batch_count, block=block_ms)
                if not rows:
                    report()
                    continue
                ids = []
                for _, messages in rows:
                    for msg_id, fields in messages:
                        payload = fields.get(b"payload", b"{}")
                        # use sensor_id-ish key for partition spread; fall back to None
                        producer.send(topic, value=payload)
                        ids.append(msg_id)
                counter["in"] += len(ids)
                if ids:
                    r.xack(stream, group, *ids)
                    counter["out"] += len(ids)
                report()
        except Exception as exc:
            counter["errors"] += 1
            print(f"redis->redpanda reconnect after error: {exc}", flush=True)
            time.sleep(3)
  pg_sink.py: |
    # Redpanda -> Postgres sink using psycopg3 BINARY COPY for max throughput.
    # Connects through PgBouncer (transaction pooling) at PGHOST.
    import json, os, time
    from datetime import datetime
    from kafka import KafkaConsumer
    import psycopg
    from psycopg import sql
    from psycopg.types.json import Jsonb

    brokers   = os.getenv("KAFKA_BROKERS", "aiot-redpanda:9092")
    topic     = os.getenv("KAFKA_TOPIC", "sensor-data")
    table     = os.getenv("PG_TABLE", "sensor_data")
    batch_max = int(os.getenv("BATCH_MAX", "5000"))
    poll_ms   = int(os.getenv("POLL_MS", "200"))

    # Schema is owned by the db-init Job (declarative partitioned table).
    # pg-sink only INSERTs via COPY; do NOT run DDL here.

    def pg_dsn():
        return (
            f"host={os.getenv('PGHOST')} port={os.getenv('PGPORT', '5432')} "
            f"dbname={os.getenv('PGDATABASE')} user={os.getenv('PGUSER')} "
            f"password={os.getenv('PGPASSWORD')}"
        )

    def parse_ts(v):
        if not v:
            return None
        # 2026-05-09T12:34:56.789Z or +00:00
        try:
            return datetime.fromisoformat(v.replace("Z", "+00:00"))
        except Exception:
            return None

    copy_stmt = (
        f"COPY {table} (ts, sensor_id, location, temperature, humidity, "
        f"pressure, battery, payload) FROM STDIN WITH (FORMAT BINARY)"
    )

    while True:
        try:
            conn = psycopg.connect(pg_dsn(), autocommit=False)
            consumer = KafkaConsumer(
                topic,
                bootstrap_servers=brokers.split(","),
                group_id="pg-sink",
                auto_offset_reset="latest",
                enable_auto_commit=False,
                value_deserializer=lambda value: json.loads(value.decode("utf-8")),
                max_poll_records=batch_max,
                fetch_max_bytes=32 * 1024 * 1024,
                max_partition_fetch_bytes=10 * 1024 * 1024,
            )
            print(
                f"redpanda {brokers}/{topic} -> postgres {os.getenv('PGHOST')}/"
                f"{os.getenv('PGDATABASE')}.{table} (psycopg3 binary COPY, batch={batch_max})",
                flush=True,
            )
            total = 0
            last_report = time.monotonic()
            while True:
                polled = consumer.poll(timeout_ms=poll_ms, max_records=batch_max)
                rows = []
                for tp, msgs in polled.items():
                    for msg in msgs:
                        try:
                            p = msg.value
                            rows.append((
                                parse_ts(p.get("ts")),
                                p.get("sensor_id"),
                                p.get("location"),
                                p.get("temperature"),
                                p.get("humidity"),
                                p.get("pressure"),
                                p.get("battery"),
                                Jsonb(p),
                            ))
                        except Exception as exc:
                            print(f"pg-sink skip bad row: {exc}", flush=True)
                if rows:
                    with conn.cursor() as cur:
                        with cur.copy(copy_stmt) as cp:
                            cp.set_types(["timestamptz", "text", "text",
                                          "float8", "float8", "float8", "float8", "jsonb"])
                            for r in rows:
                                cp.write_row(r)
                    conn.commit()
                    consumer.commit()
                    total += len(rows)
                now = time.monotonic()
                if now - last_report >= 10:
                    print(f"pg-sink total={total}", flush=True)
                    last_report = now
        except Exception as exc:
            print(f"pg-sink reconnect after error: {exc}", flush=True)
            try:
                conn.close()
            except Exception:
                pass
            time.sleep(3)
