apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiot-redis
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/component: redis
    {{- include "aiot.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/component: redis
        {{- include "aiot.labels" . | nindent 8 }}
    spec:
      priorityClassName: {{ .Values.priorityClass.data }}
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          # Loadtest-tuned: no persistence (no RDB/AOF IO storms),
          # hard memory cap with noeviction so XADD fails fast = backpressure
          # to mqtt-to-redis instead of OOMKilling the whole pod.
          args:
            - "redis-server"
            - "--save"
            - ""
            - "--appendonly"
            - "no"
            - "--maxmemory"
            - "1500mb"
            - "--maxmemory-policy"
            - "noeviction"
            - "--tcp-backlog"
            - "4096"
            - "--timeout"
            - "0"
            - "--tcp-keepalive"
            - "60"
          ports:
            - name: redis
              containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 5
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
      volumes:
        - name: data
          emptyDir: {}
