{{- /*
EMQX cluster: 3-node StatefulSet with k8s discovery, headless service
for cluster gossip + ClusterIP service for clients (round-robin).
Sized for shared single-host k3d (Hetzner): 1-2 CPU / 2 Gi per pod.
*/ -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aiot-emqx
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "aiot.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aiot-emqx
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "aiot.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["endpoints", "pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aiot-emqx
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "aiot.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: aiot-emqx
subjects:
  - kind: ServiceAccount
    name: aiot-emqx
    namespace: {{ .Values.global.namespace }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: aiot-emqx
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/component: emqx
    {{- include "aiot.labels" . | nindent 4 }}
spec:
  serviceName: aiot-emqx-headless
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/component: emqx
  template:
    metadata:
      labels:
        app.kubernetes.io/component: emqx
        {{- include "aiot.labels" . | nindent 8 }}
    spec:
      priorityClassName: {{ .Values.priorityClass.data }}
      serviceAccountName: aiot-emqx
      terminationGracePeriodSeconds: 60
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/component: emqx
                topologyKey: kubernetes.io/hostname
      containers:
        - name: emqx
          image: emqx/emqx:5.8.4
          imagePullPolicy: IfNotPresent
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: EMQX_HOST
              value: "$(POD_NAME).aiot-emqx-headless.$(POD_NAMESPACE).svc.cluster.local"
            - name: EMQX_NAME
              value: aiot-emqx
            - name: EMQX_NODE__COOKIE
              value: aiot-emqx-cookie
            - name: EMQX_CLUSTER__DISCOVERY_STRATEGY
              value: k8s
            - name: EMQX_CLUSTER__K8S__APISERVER
              value: "https://kubernetes.default.svc:443"
            - name: EMQX_CLUSTER__K8S__SERVICE_NAME
              value: aiot-emqx-headless
            - name: EMQX_CLUSTER__K8S__NAMESPACE
              value: {{ .Values.global.namespace | quote }}
            - name: EMQX_CLUSTER__K8S__ADDRESS_TYPE
              value: hostname
            - name: EMQX_CLUSTER__K8S__SUFFIX
              value: "svc.cluster.local"
            - name: EMQX_DASHBOARD__DEFAULT_USERNAME
              value: admin
            - name: EMQX_DASHBOARD__DEFAULT_PASSWORD
              value: AiotEmqx2026!
            - name: EMQX_LISTENERS__TCP__DEFAULT__ACCEPTORS
              value: "32"
            - name: EMQX_LISTENERS__TCP__DEFAULT__MAX_CONNECTIONS
              value: "50000"
            - name: EMQX_LISTENERS__TCP__DEFAULT__MAX_CONN_RATE
              value: "2000"
            - name: EMQX_LISTENERS__TCP__DEFAULT__MESSAGES_RATE
              value: "infinity"
            - name: EMQX_LISTENERS__TCP__DEFAULT__BYTES_RATE
              value: "infinity"
            - name: EMQX_FORCE_SHUTDOWN__MAX_MAILBOX_SIZE
              value: "1000000"
            - name: EMQX_FORCE_SHUTDOWN__MAX_HEAP_SIZE
              value: "512MB"
            - name: EMQX_NODE__GLOBAL_GC_INTERVAL
              value: "15s"
            - name: EMQX_LOG__CONSOLE__LEVEL
              value: warning
            - name: EMQX_MQTT__MAX_INFLIGHT
              value: "8192"
            - name: EMQX_MQTT__MAX_MQUEUE_LEN
              value: "100000"
            - name: EMQX_MQTT__SHARED_SUBSCRIPTION_STRATEGY
              value: "sticky"
          ports:
            - name: mqtt
              containerPort: 1883
            - name: dashboard
              containerPort: 18083
            - name: ekka
              containerPort: 4370
            - name: dist
              containerPort: 5369
          readinessProbe:
            tcpSocket:
              port: mqtt
            initialDelaySeconds: 45
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 10
          livenessProbe:
            tcpSocket:
              port: mqtt
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /opt/emqx/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.redpanda.storageClass | quote }}
        resources:
          requests:
            storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: aiot-emqx-headless
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/component: emqx
    {{- include "aiot.labels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/component: emqx
  ports:
    - name: mqtt
      port: 1883
      targetPort: mqtt
    - name: dashboard
      port: 18083
      targetPort: dashboard
    - name: ekka
      port: 4370
      targetPort: ekka
    - name: dist
      port: 5369
      targetPort: dist
