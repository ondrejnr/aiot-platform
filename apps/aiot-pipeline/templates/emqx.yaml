apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiot-emqx
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/component: emqx
    {{- include "aiot.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: emqx
  template:
    metadata:
      labels:
        app.kubernetes.io/component: emqx
        {{- include "aiot.labels" . | nindent 8 }}
    spec:
      containers:
        - name: emqx
          image: emqx/emqx-enterprise:5.8.4
          imagePullPolicy: IfNotPresent
          env:
            - name: EMQX_NAME
              value: aiot-emqx
            - name: EMQX_NODE__COOKIE
              value: aiot-emqx-cookie
            - name: EMQX_DASHBOARD__DEFAULT_USERNAME
              value: admin
            - name: EMQX_DASHBOARD__DEFAULT_PASSWORD
              value: AiotEmqx2026!
            - name: EMQX_DASHBOARD__SSO__OIDC__BACKEND
              value: oidc
            - name: EMQX_DASHBOARD__SSO__OIDC__PROVIDER
              value: generic
            - name: EMQX_DASHBOARD__SSO__OIDC__ISSUER
              value: https://authentik.46.4.123.8.nip.io/application/o/emqx/
            - name: EMQX_DASHBOARD__SSO__OIDC__CLIENTID
              value: emqx
            - name: EMQX_DASHBOARD__SSO__OIDC__SECRET
              valueFrom:
                secretKeyRef:
                  name: aiot-emqx-oidc
                  key: client-secret
            - name: EMQX_DASHBOARD__SSO__OIDC__SCOPES
              value: '["openid","profile","email"]'
            - name: EMQX_DASHBOARD__SSO__OIDC__DASHBOARD_ADDR
              value: https://emqx.46.4.123.8.nip.io
            - name: EMQX_DASHBOARD__SSO__OIDC__PREFERRED_AUTH_METHODS
              value: '["client_secret_post","client_secret_basic"]'
          ports:
            - name: mqtt
              containerPort: 1883
            - name: dashboard
              containerPort: 18083
          readinessProbe:
            tcpSocket:
              port: mqtt
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: mqtt
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1500m
              memory: 1536Mi
