apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiot-emqx
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/component: emqx
    {{- include "aiot.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/component: emqx
  template:
    metadata:
      labels:
        app.kubernetes.io/component: emqx
        {{- include "aiot.labels" . | nindent 8 }}
    spec:
      containers:
        - name: emqx
          # Open Source variant - no concurrent-session license limit.
          image: emqx/emqx:5.8.4
          imagePullPolicy: IfNotPresent
          env:
            - name: EMQX_NAME
              value: aiot-emqx
            - name: EMQX_NODE__COOKIE
              value: aiot-emqx-cookie
            - name: EMQX_DASHBOARD__DEFAULT_USERNAME
              value: admin
            - name: EMQX_DASHBOARD__DEFAULT_PASSWORD
              value: AiotEmqx2026!
            # High-throughput tuning
            - name: EMQX_LISTENERS__TCP__DEFAULT__ACCEPTORS
              value: "64"
            - name: EMQX_LISTENERS__TCP__DEFAULT__MAX_CONNECTIONS
              value: "infinity"
            - name: EMQX_LISTENERS__TCP__DEFAULT__MAX_CONN_RATE
              value: "5000"
            - name: EMQX_LISTENERS__TCP__DEFAULT__MESSAGES_RATE
              value: "infinity"
            - name: EMQX_LISTENERS__TCP__DEFAULT__BYTES_RATE
              value: "infinity"
            # Per-session mailbox: default 1000 caused mailbox_overflow under load
            - name: EMQX_FORCE_SHUTDOWN__MAX_MAILBOX_SIZE
              value: "10000000"
            - name: EMQX_FORCE_SHUTDOWN__MAX_HEAP_SIZE
              value: "2GB"
            # Disable SysMon overload alarms tripping needlessly
            - name: EMQX_SYSMON__VM__BUSY_DIST_PORT
              value: "true"
            - name: EMQX_MQTT__MAX_INFLIGHT
              value: "32768"
            - name: EMQX_MQTT__MAX_MQUEUE_LEN
              value: "1000000"
            - name: EMQX_MQTT__SHARED_SUBSCRIPTION_STRATEGY
              value: "sticky"
            - name: EMQX_MQTT__MQUEUE_DEFAULT_PRIORITY
              value: "highest"
          ports:
            - name: mqtt
              containerPort: 1883
            - name: dashboard
              containerPort: 18083
          readinessProbe:
            tcpSocket:
              port: mqtt
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: mqtt
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
            limits:
              cpu: "6"
              memory: 8Gi
