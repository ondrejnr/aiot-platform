{{- /*
Daily maintenance:
- create the next-day partition (idempotent)
- drop partitions older than {{ .Values.retention.pgDays }} days
- ensure Redpanda topic retention (ms + bytes) is set
Runs at 03:15 UTC every day.
*/ -}}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: aiot-pg-partition-maint
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/component: maintenance
    {{- include "aiot.labels" . | nindent 4 }}
spec:
  schedule: "15 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 0
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 3
      template:
        spec:
          restartPolicy: OnFailure
          priorityClassName: {{ .Values.priorityClass.pipeline }}
          containers:
            - name: psql
              image: postgres:17-alpine
              imagePullPolicy: IfNotPresent
              envFrom:
                - secretRef:
                    name: aiot-pg-credentials
              env:
                - name: RETENTION_DAYS
                  value: {{ .Values.retention.pgDays | quote }}
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -e
                  psql -v ON_ERROR_STOP=1 -v retention_days="${RETENTION_DAYS}" <<'SQL'
                  -- Pre-create next 4 days of partitions (idempotent)
                  with days as (
                    select generate_series(current_date, current_date + 3, '1 day'::interval)::date as d
                  )
                  select format(
                    'create table if not exists sensor_data_%s partition of sensor_data for values from (%L) to (%L);',
                    to_char(d, 'YYYYMMDD'), d::timestamptz, (d + 1)::timestamptz
                  )
                  from days
                  \gexec

                  -- Drop partitions older than retention_days
                  select format('drop table if exists %I;', c.relname)
                  from pg_inherits i
                  join pg_class c on c.oid = i.inhrelid
                  join pg_class p on p.oid = i.inhparent
                  where p.relname = 'sensor_data'
                    and c.relname ~ '^sensor_data_[0-9]{8}$'
                    and to_date(substring(c.relname from 13), 'YYYYMMDD')
                        < (current_date - (:'retention_days')::int)
                  \gexec
                  SQL
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
---
{{- /*
Apply Redpanda topic retention via rpk-as-Job.
Idempotent (alter-config). Runs once per chart upgrade.
*/ -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: aiot-redpanda-retention
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/component: redpanda-init
    {{- include "aiot.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      priorityClassName: {{ .Values.priorityClass.pipeline }}
      containers:
        - name: rpk
          image: redpandadata/redpanda:v24.2.4
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              # Wait for brokers to be ready
              for i in $(seq 1 30); do
                if rpk -X brokers=aiot-redpanda:9092 cluster info >/dev/null 2>&1; then break; fi
                echo "waiting for redpanda... ($i/30)"; sleep 2
              done
              # Apply retention to sensor-data topic
              rpk -X brokers=aiot-redpanda:9092 topic alter-config sensor-data \
                --set retention.ms={{ .Values.retention.redpandaMs }} \
                --set retention.bytes={{ .Values.retention.redpandaBytesPerPartition }} \
                --set segment.bytes=134217728 \
                --set compression.type=producer
              rpk -X brokers=aiot-redpanda:9092 topic describe sensor-data
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
