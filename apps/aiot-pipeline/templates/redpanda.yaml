apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: aiot-redpanda
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/component: redpanda
    {{- include "aiot.labels" . | nindent 4 }}
spec:
  serviceName: aiot-redpanda
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/component: redpanda
  template:
    metadata:
      labels:
        app.kubernetes.io/component: redpanda
        {{- include "aiot.labels" . | nindent 8 }}
    spec:
      priorityClassName: {{ .Values.priorityClass.data }}
      terminationGracePeriodSeconds: 60
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/component: redpanda
                topologyKey: kubernetes.io/hostname
      containers:
        - name: redpanda
          image: docker.redpanda.com/redpandadata/redpanda:v24.3.5
          imagePullPolicy: IfNotPresent
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          command:
            - /bin/bash
            - -c
            - |
              ORDINAL=${POD_NAME##*-}
              exec /usr/bin/rpk redpanda start \
                --overprovisioned \
                --smp 1 \
                --memory 1G \
                --reserve-memory 256M \
                --node-id ${ORDINAL} \
                --check=false \
                --kafka-addr internal://0.0.0.0:9092 \
                --advertise-kafka-addr internal://${POD_NAME}.aiot-redpanda.aiot.svc.cluster.local:9092 \
                --rpc-addr 0.0.0.0:33145 \
                --advertise-rpc-addr ${POD_NAME}.aiot-redpanda.aiot.svc.cluster.local:33145 \
                --seeds aiot-redpanda-0.aiot-redpanda.aiot.svc.cluster.local:33145,aiot-redpanda-1.aiot-redpanda.aiot.svc.cluster.local:33145,aiot-redpanda-2.aiot-redpanda.aiot.svc.cluster.local:33145
          ports:
            - name: kafka
              containerPort: 9092
            - name: admin
              containerPort: 9644
            - name: rpc
              containerPort: 33145
          volumeMounts:
            - name: data
              mountPath: /var/lib/redpanda/data
          readinessProbe:
            httpGet:
              path: /v1/status/ready
              port: admin
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /v1/status/ready
              port: admin
            initialDelaySeconds: 90
            periodSeconds: 30
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.redpanda.storageClass | quote }}
        resources:
          requests:
            storage: {{ .Values.redpanda.storageSize | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiot-redpanda-console
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/component: redpanda-console
    {{- include "aiot.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: redpanda-console
  template:
    metadata:
      labels:
        app.kubernetes.io/component: redpanda-console
        {{- include "aiot.labels" . | nindent 8 }}
    spec:
      containers:
        - name: console
          image: docker.redpanda.com/redpandadata/console:v2.8.4
          imagePullPolicy: IfNotPresent
          env:
            - name: KAFKA_BROKERS
              value: aiot-redpanda.aiot.svc.cluster.local:9092
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /admin/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: aiot-redpanda-topic-init
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/component: redpanda-init
    {{- include "aiot.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 20
  template:
    metadata:
      labels:
        app.kubernetes.io/component: redpanda-init
        {{- include "aiot.labels" . | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      priorityClassName: {{ .Values.priorityClass.pipeline }}
      containers:
        - name: rpk
          image: docker.redpanda.com/redpandadata/redpanda:v24.3.5
          command:
            - /bin/bash
            - -c
            - |
              set -e
              BROKERS="aiot-redpanda-0.aiot-redpanda.aiot.svc.cluster.local:9092,aiot-redpanda-1.aiot-redpanda.aiot.svc.cluster.local:9092,aiot-redpanda-2.aiot-redpanda.aiot.svc.cluster.local:9092"
              echo "Waiting for brokers..."
              for i in $(seq 1 60); do
                if rpk -X brokers=$BROKERS cluster info >/dev/null 2>&1; then
                  echo "Brokers ready"; break
                fi
                sleep 5
              done
              echo "Creating/altering topic ${TOPIC} (24 partitions, RF=3)"
              rpk -X brokers=$BROKERS topic create ${TOPIC} -p 24 -r 3 \
                -c min.insync.replicas=2 \
                -c retention.ms=86400000 \
                -c compression.type=producer \
                -c segment.bytes=268435456 \
                || rpk -X brokers=$BROKERS topic alter-config ${TOPIC} \
                     --set min.insync.replicas=2 \
                     --set retention.ms=86400000 \
                     --set compression.type=producer
              rpk -X brokers=$BROKERS topic describe ${TOPIC}
          env:
            - name: TOPIC
              value: {{ .Values.redpanda.topic | quote }}
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
