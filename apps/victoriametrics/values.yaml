# No live values dump available — pass-through skeleton for victoria-metrics-k8s-stack
victoria-metrics-k8s-stack:
  # Disabled on k3d because the generated vmalertmanager pod labels exceed the 63-char limit
  # with this long release name, which floods Kubernetes Events with ReconcilationError.
  alertmanager:
    enabled: false
  vmalert:
    spec:
      extraArgs:
        notifier.blackhole: "true"
  # Disabled because the rendered Service name exceeds Kubernetes 63-char limit with this release name.
  kubeControllerManager:
    enabled: false
