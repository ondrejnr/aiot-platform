victoria-metrics-k8s-stack:
  # Disabled on k3d because the generated vmalertmanager pod labels exceed the 63-char limit
  # with this long release name. Standalone alertmanager (apps/alertmanager) sa používa miesto neho.
  alertmanager:
    enabled: false
  vmsingle:
    spec:
      retentionPeriod: "7d"
  vmalert:
    spec:
      notifiers:
        - url: "http://am.monitoring.svc:9093"
  kubeControllerManager:
    enabled: false
  kubeScheduler:
    enabled: false
  kubeProxy:
    enabled: false
  kubeEtcd:
    enabled: false
  defaultRules:
    rules:
      kubeScheduler: false
      kubeControllerManager: false
      kubeProxy: false
      etcd: false
