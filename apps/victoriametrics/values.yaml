victoria-metrics-k8s-stack:
  # Disabled on k3d because the generated vmalertmanager pod labels exceed the 63-char limit
  # with this long release name. Standalone alertmanager (apps/alertmanager) sa používa miesto neho.
  alertmanager:
    enabled: false
  vmsingle:
    spec:
      retentionPeriod: "1"
      image:
        tag: "v1.151.0" # {"$imagepolicy": "flux-system:victoriametrics-stable:tag"}
    # Keep CPU limit under 1 core so agent nodes stay <100% total limits (Zabbix trigger).
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: 800m
        memory: 1500Mi
  prometheus-node-exporter:
    hostRootFsMount:
      mountPropagation: None
  vmalert:
    spec:
      extraArgs:
        notifier.blackhole: "true"
  kubeControllerManager:
    enabled: false
  kubeScheduler:
    enabled: false
  kubeProxy:
    enabled: false
  kubeEtcd:
    enabled: false
  defaultRules:
    # Disable rule groups for components that are not exposed/scraped on this k3d cluster.
    groups:
      kubeScheduler:
        create: false
      kubeControllerManager:
        create: false
      kubeProxy:
        create: false
      etcd:
        create: false
    rules:
      # k3d cluster has high pod churn (CronJobs, Jobs, controller restarts, reboots).
      # 24h window after a reboot easily exceeds the default 3x ratio. Bump to 10x to
      # catch only truly anomalous churn while ignoring normal cluster turnover.
      TooHighChurnRate24h:
        create: true
        spec:
          expr: |-
            (
               sum(increase(vm_new_timeseries_created_total[24h])) by (instance, job, cluster)
               >
               (sum(vm_cache_entries{type="storage/hour_metric_ids"}) by (instance, job, cluster) * 10)
            )
