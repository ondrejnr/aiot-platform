{{- if .Values.puppetboard.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: puppetboard
  namespace: puppet
  labels:
    app: puppetboard
spec:
  replicas: {{ .Values.puppetboard.replicas }}
  selector:
    matchLabels:
      app: puppetboard
  template:
    metadata:
      labels:
        app: puppetboard
    spec:
      containers:
      - name: puppetboard
        image: {{ .Values.puppetboard.image }}
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        env:
        - name: PUPPETDB_HOST
          value: {{ .Values.puppetboard.puppetdbHost | quote }}
        - name: PUPPETDB_PORT
          value: {{ .Values.puppetboard.puppetdbPort | quote }}
        - name: PUPPETDB_PROTO
          value: {{ .Values.puppetboard.puppetdbProto | quote }}
        - name: PUPPETDB_SSL_VERIFY
          value: "False"
        - name: SECRET_KEY
          value: {{ .Values.puppetboard.secretKey | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: puppetboard
  namespace: puppet
  labels:
    app: puppetboard
spec:
  selector:
    app: puppetboard
  ports:
  - name: http
    port: 80
    targetPort: 8000
{{- if .Values.puppetboard.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: puppetboard
  namespace: puppet
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.puppetboard.ingress.clusterIssuer | quote }}
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: {{ .Values.puppetboard.ingress.className }}
  tls:
  - hosts:
    - {{ .Values.puppetboard.ingress.host }}
    secretName: puppetboard-tls
  rules:
  - host: {{ .Values.puppetboard.ingress.host }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: puppetboard
            port:
              number: 80
{{- end }}
{{- end }}
