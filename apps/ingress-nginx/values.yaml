ingress-nginx:
  controller:
    watchIngressWithoutClass: true
    ingressClassResource:
      default: true
    admissionWebhooks:
      enabled: false
    hostPort:
      enabled: false
    service:
      enabled: true
      type: LoadBalancer
      ports:
        http:
          port: 80
          targetPort: 80
          protocol: TCP
        https:
          port: 443
          targetPort: 443
          protocol: TCP
    allowSnippetAnnotations: true
    config:
      annotations-risk-level: Critical
    metrics:
      enabled: true
      port: 10254
      service:
        servicePort: 10254
      serviceMonitor:
        enabled: true
        namespace: monitoring
        additionalLabels:
          release: prometheus
        scrapeInterval: 60s
