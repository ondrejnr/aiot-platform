ingress-nginx:
  controller:
    watchIngressWithoutClass: true
    ingressClassResource:
      default: true
    admissionWebhooks:
      enabled: false
    hostPort:
      enabled: true
      ports:
        http: 80
        https: 443
    service:
      enabled: false
    allowSnippetAnnotations: true
    config:
      annotations-risk-level: Critical
