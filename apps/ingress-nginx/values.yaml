ingress-nginx:
  controller:
    watchIngressWithoutClass: true
    ingressClassResource:
      default: true
    admissionWebhooks:
      enabled: false
    hostPort:
      enabled: true
      ports:
        http: 80
        https: 443
    service:
      enabled: false
    allowSnippetAnnotations: true
    config:
      annotations-risk-level: Critical
    metrics:
      enabled: true
      port: 10254
      service:
        servicePort: 10254
      serviceMonitor:
        enabled: true
        namespace: monitoring
        additionalLabels:
          release: prometheus
        scrapeInterval: 60s
