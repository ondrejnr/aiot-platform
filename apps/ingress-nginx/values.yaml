ingress-nginx:
  controller:
    watchIngressWithoutClass: true
    ingressClassResource:
      default: true
    admissionWebhooks:
      enabled: false
    hostNetwork: true
    hostPort:
      enabled: false
    service:
      enabled: true
      type: ClusterIP
    dnsPolicy: ClusterFirstWithHostNet
    allowSnippetAnnotations: true
    config:
      annotations-risk-level: Critical
    image:
      tag: "v1.15.1" # {"$imagepolicy": "flux-system:ingress-nginx-controller-stable:tag"}
    metrics:
      enabled: true
      port: 10254
      service:
        servicePort: 10254
      serviceMonitor:
        enabled: true
        namespace: monitoring
        additionalLabels:
          release: prometheus
        scrapeInterval: 60s
