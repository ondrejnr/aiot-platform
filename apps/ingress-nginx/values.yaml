ingress-nginx:
  controller:
    watchIngressWithoutClass: true
    ingressClassResource:
      default: true
    admissionWebhooks:
      enabled: false
    hostNetwork: true
    hostPort:
      enabled: false
    service:
      enabled: true
      type: NodePort
      nodePorts:
        http: 30080
        https: 30443
    dnsPolicy: ClusterFirstWithHostNet
    allowSnippetAnnotations: true
    config:
      annotations-risk-level: Critical
    metrics:
      enabled: true
      port: 10254
      service:
        servicePort: 10254
      serviceMonitor:
        enabled: true
        namespace: monitoring
        additionalLabels:
          release: prometheus
        scrapeInterval: 60s
