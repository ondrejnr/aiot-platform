ingress-nginx:
  controller:
    watchIngressWithoutClass: true
    ingressClassResource:
      default: true
    admissionWebhooks:
      enabled: false
    hostNetwork: true
    hostPort:
      enabled: false
    service:
      enabled: true
      type: NodePort
      ports:
        http:
          port: 80
          nodePort: 30080
          protocol: TCP
        https:
          port: 443
          nodePort: 30443
          protocol: TCP
    dnsPolicy: ClusterFirstWithHostNet
    allowSnippetAnnotations: true
    config:
      annotations-risk-level: Critical
    metrics:
      enabled: true
      port: 10254
      service:
        servicePort: 10254
      serviceMonitor:
        enabled: true
        namespace: monitoring
        additionalLabels:
          release: prometheus
        scrapeInterval: 60s
