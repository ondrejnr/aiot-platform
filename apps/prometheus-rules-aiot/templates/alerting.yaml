apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: aiot-alerting
  namespace: {{ .Values.namespace }}
  labels:
    release: prometheus
spec:
  groups:
    - name: aiot.alerts
      interval: 1m
      rules:
        - alert: BlackboxProbeFailed
          expr: probe_success == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Probe failed: {{ "{{" }} $labels.instance {{ "}}" }}"
            description: "Blackbox probe {{ "{{" }} $labels.job {{ "}}" }} for {{ "{{" }} $labels.instance {{ "}}" }} failed for >5m."

        - alert: BlackboxCertExpiringSoon
          expr: probe_ssl_earliest_cert_expiry - time() < 7 * 24 * 3600
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "TLS cert expires <7d: {{ "{{" }} $labels.instance {{ "}}" }}"

        - alert: NodeNotReady
          expr: cluster:nodes_not_ready:count > 0
          for: 5m
          labels: { severity: critical }
          annotations:
            summary: "{{ "{{" }} $value {{ "}}" }} node(s) NotReady"

        - alert: NodeDiskPressure
          expr: cluster:nodes_disk_pressure:count > 0
          for: 5m
          labels: { severity: warning }
          annotations:
            summary: "{{ "{{" }} $value {{ "}}" }} node(s) under DiskPressure"

        - alert: PodsPendingTooLong
          expr: cluster:pods_pending:count > 0
          for: 15m
          labels: { severity: warning }
          annotations:
            summary: "{{ "{{" }} $value {{ "}}" }} pods stuck Pending >15m"

        - alert: ContainerRestartingFast
          expr: rate(kube_pod_container_status_restarts_total[15m]) * 60 * 15 > 3
          for: 15m
          labels: { severity: warning }
          annotations:
            summary: "{{ "{{" }} $labels.namespace {{ "}}" }}/{{ "{{" }} $labels.pod {{ "}}" }} restarted >3× in 15m"

        - alert: IngressNginx5xxRate
          expr: |
            sum by (ingress, exported_namespace) (rate(nginx_ingress_controller_requests{status=~"5.."}[5m]))
            /
            sum by (ingress, exported_namespace) (rate(nginx_ingress_controller_requests[5m]))
            > 0.05
          for: 10m
          labels: { severity: warning }
          annotations:
            summary: ">5% 5xx on ingress {{ "{{" }} $labels.exported_namespace {{ "}}" }}/{{ "{{" }} $labels.ingress {{ "}}" }}"

        - alert: VMSingleHighDiskUsage
          expr: vm_data_size_bytes{job=~".*vmsingle.*"} / vm_free_disk_space_bytes{job=~".*vmsingle.*"} > 0.8
          for: 30m
          labels: { severity: warning }
          annotations:
            summary: "vmsingle disk >80% used"

        - alert: VMAgentRemoteWriteBacklog
          expr: vmagent_remotewrite_pending_data_bytes > 100 * 1024 * 1024
          for: 15m
          labels: { severity: warning }
          annotations:
            summary: "vmagent remoteWrite backlog >100MB"
