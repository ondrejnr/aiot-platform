apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cloudbeaver-data
  namespace: aiot
  labels:
    app.kubernetes.io/name: cloudbeaver
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: {{ .Values.storageClass | quote }}
  resources:
    requests:
      storage: {{ .Values.storageSize | quote }}
