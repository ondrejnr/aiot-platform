apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudbeaver
  namespace: aiot
  labels:
    app.kubernetes.io/name: cloudbeaver
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudbeaver
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudbeaver
    spec:
      containers:
        - name: cloudbeaver
          image: {{ .Values.image | quote }}
          imagePullPolicy: IfNotPresent
          env:
            - name: CLOUDBEAVER_APP_GRANT_CONNECTIONS_ACCESS_TO_ANONYMOUS_TEAM
              value: "true"
            - name: CB_SERVER_NAME
              value: CloudBeaver AIOT
            - name: CB_ADMIN_NAME
              value: {{ .Values.admin.username | quote }}
            - name: CB_ADMIN_PASSWORD
              value: {{ .Values.admin.password | quote }}
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms512m -Xmx1536m -XX:+ExitOnOutOfMemoryError"
          ports:
            - name: http
              containerPort: 8978
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 10
          livenessProbe:
            exec:
              command: ["stat", "/opt/cloudbeaver/workspace"]
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /opt/cloudbeaver/workspace
            - name: conf
              mountPath: /opt/cloudbeaver/conf/initial-data.conf
              subPath: initial-data.conf
            - name: conf
              mountPath: /opt/cloudbeaver/conf/initial-data-sources.conf
              subPath: initial-data-sources.conf
          resources:
            requests:
              cpu: 100m
              memory: 768Mi
            limits:
              cpu: 500m
              memory: 2Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: cloudbeaver-data
        - name: conf
          configMap:
            name: cloudbeaver-conf
