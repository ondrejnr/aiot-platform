# AWX Operator helm chart 3.2.1 (operator app v2.19.1)
# We deploy ONLY the operator here; AWX CR is in apps/awx for separation
awx-operator:
  AWX:
    enabled: false  # bundled AWX disabled; we manage AWX CR ourselves
  rbac:
    create: true
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  image: quay.io/ansible/awx-operator:2.19.1 # {"$imagepolicy": "flux-system:awx-operator-stable:tag"}
