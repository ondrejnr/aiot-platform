apiVersion: v1
kind: ServiceAccount
metadata:
  name: aiot-chaos-theater
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: aiot-chaos-theater
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aiot-chaos-theater-read
  namespace: {{ .Values.targetNamespace }}
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events", "services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["argoproj.io"]
    resources: ["workflows"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["litmuschaos.io"]
    resources: ["chaosengines", "chaosresults", "chaosexperiments"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aiot-chaos-theater-read
  namespace: {{ .Values.targetNamespace }}
subjects:
  - kind: ServiceAccount
    name: aiot-chaos-theater
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: aiot-chaos-theater-read
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aiot-chaos-theater-db-read
  namespace: {{ .Values.databaseNamespace }}
rules:
  - apiGroups: [""]
    resources: ["pods", "events"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aiot-chaos-theater-db-read
  namespace: {{ .Values.databaseNamespace }}
subjects:
  - kind: ServiceAccount
    name: aiot-chaos-theater
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: aiot-chaos-theater-db-read
