apiVersion: v1
kind: ServiceAccount
metadata:
  name: aiot-chaos-theater-authentik-bootstrap
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: aiot-chaos-theater
    app.kubernetes.io/part-of: aiot-platform
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aiot-chaos-theater-authentik-bootstrap-exec
  namespace: authentik
  labels:
    app.kubernetes.io/name: aiot-chaos-theater
    app.kubernetes.io/part-of: aiot-platform
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/exec"]
    verbs: ["get", "list", "create"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aiot-chaos-theater-authentik-bootstrap-exec
  namespace: authentik
  labels:
    app.kubernetes.io/name: aiot-chaos-theater
    app.kubernetes.io/part-of: aiot-platform
subjects:
  - kind: ServiceAccount
    name: aiot-chaos-theater-authentik-bootstrap
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: aiot-chaos-theater-authentik-bootstrap-exec
