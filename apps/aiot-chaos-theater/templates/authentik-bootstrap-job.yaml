apiVersion: batch/v1
kind: Job
metadata:
  name: aiot-chaos-theater-authentik-bootstrap
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: aiot-chaos-theater
    app.kubernetes.io/part-of: aiot-platform
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "30"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aiot-chaos-theater-authentik-bootstrap
        app.kubernetes.io/part-of: aiot-platform
    spec:
      serviceAccountName: aiot-chaos-theater-authentik-bootstrap
      restartPolicy: OnFailure
      containers:
        - name: bootstrap
          image: bitnamilegacy/kubectl:1.33.4
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "/bootstrap/bootstrap.sh"]
          volumeMounts:
            - name: script
              mountPath: /bootstrap
      volumes:
        - name: script
          configMap:
            name: aiot-chaos-theater-authentik-bootstrap
            defaultMode: 0755
