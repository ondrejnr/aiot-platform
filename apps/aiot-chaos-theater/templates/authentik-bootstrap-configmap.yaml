apiVersion: v1
kind: ConfigMap
metadata:
  name: aiot-chaos-theater-authentik-bootstrap
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: aiot-chaos-theater
    app.kubernetes.io/part-of: aiot-platform
data:
  bootstrap.sh: |-
    #!/bin/sh
    set -eu
    PY=/tmp/aiot-chaos-theater-authentik-bootstrap.py
    cat > "$PY" <<'PYCODE'
    from authentik.core.models import Application
    from authentik.outposts.models import Outpost
    from authentik.providers.proxy.models import ProxyProvider

    authentik_url = "https://authentik.46.4.123.8.nip.io"
    launch_url = "https://chaos-theater.46.4.123.8.nip.io"

    app, _ = Application.objects.get_or_create(slug="aiot-chaos-theater", defaults={"name": "AIoT Chaos Theater"})
    app.name = "AIoT Chaos Theater"
    app.provider = None
    app.meta_launch_url = launch_url
    app.open_in_new_tab = True
    if hasattr(app, "meta_description"):
        app.meta_description = "Read-only live map and replay view for Litmus chaos experiments on the AIoT pipeline."
    if hasattr(app, "meta_publisher"):
        app.meta_publisher = "AIoT Platform"
    app.save()

    outpost = Outpost.objects.filter(name="authentik Embedded Outpost").first()
    outpost_status = "missing"
    proxy_status = "missing"
    if outpost:
        cfg = outpost.config
        cfg.authentik_host = authentik_url
        cfg.authentik_host_browser = authentik_url
        outpost.config = cfg
        proxy = ProxyProvider.objects.filter(name="aiot-domain-fwd").first()
        if proxy:
            proxy_status = "present"
            if not outpost.providers.filter(pk=proxy.pk).exists():
                outpost.providers.add(proxy)
                proxy_status = "added"
        outpost.save()
        outpost_status = "updated"

    print({"application": app.slug, "launch": app.meta_launch_url, "provider": None, "outpost": outpost_status, "proxy": proxy_status})
    PYCODE
    kubectl -n authentik exec deploy/authentik-server -- ak shell -c "$(cat "$PY")"
