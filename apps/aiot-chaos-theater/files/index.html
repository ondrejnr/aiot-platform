<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AIoT Chaos Theater</title>
  <link rel="stylesheet" href="/styles.css?v=flow1" />
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <div class="kicker"><span class="pulse"></span> AIoT Chaos Theater</div>
        <h1>Čo sa deje počas chaosu</h1>
      </div>
      <div class="statusbox">
        <div id="heroExperiment" class="status-title">Načítavam…</div>
        <div id="heroStatus" class="pill idle">waiting</div>
        <div id="lastUpdated" class="tiny">—</div>
      </div>
    </header>

    <section id="focus" class="focus"></section>

    <section class="card">
      <div class="section-head">
        <h2>Pipeline</h2>
        <button id="replayBtn" class="ghost">Replay</button>
      </div>
      <div id="topology" class="pipeline"></div>
      <div id="componentDetail" class="component-detail"></div>
    </section>

    <section class="card">
      <div class="section-head">
        <h2>Dynamický priebeh</h2>
        <span class="tiny">udalosti na časovej osi</span>
      </div>
      <div id="flowGraph" class="flow-graph"></div>
    </section>

    <section class="card">
      <div class="section-head">
        <h2>Priebeh</h2>
        <span class="tiny">len dôležité udalosti</span>
      </div>
      <div id="timeline" class="timeline"></div>
    </section>

    <section class="card compact-card">
      <h2>Experimenty v Litmuse</h2>
      <div id="experiments" class="experiments"></div>
    </section>
  </main>
  <script src="/app.js?v=flow1"></script>
</body>
</html>
