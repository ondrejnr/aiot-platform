nameOverride: gitops-demo
replicaCount: 2

image:
  repository: ghcr.io/stefanprodan/podinfo
  tag: 6.9.1
  pullPolicy: IfNotPresent

service:
  port: 80
  targetPort: 9898

ingress:
  enabled: true
  className: nginx
  host: gitops-demo.46.4.123.8.nip.io
  tlsSecretName: gitops-demo-tls
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"

resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi

podAnnotations:
  training.aiot.dev/purpose: "gitops-flux-demo"
