apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
spec:
  strategy: { type: Recreate }
  replicas: 1
  selector:
    matchLabels: { app: ollama }
  template:
    metadata:
      labels: { app: ollama }
    spec:
      containers:
        - name: ollama
          image: ollama/ollama:0.6.8
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 11434
          env:
            - name: OLLAMA_HOST
              value: 0.0.0.0:11434
          command: ["/bin/sh", "-lc"]
          args:
            - |
              ollama serve &
              pid=$!
              until ollama list >/dev/null 2>&1; do sleep 5; done
              ollama pull {{ .Values.model | quote }} || true
              wait $pid
          resources:
            requests:
              cpu: "1"
              memory: 12Gi
            limits:
              cpu: "2"
              memory: 24Gi
          volumeMounts:
            - name: data
              mountPath: /root/.ollama
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ollama-data
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
spec:
  strategy: { type: Recreate }
  selector: { app: ollama }
  ports:
    - name: http
      port: 11434
      targetPort: 11434
