apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-sre-agent-app
  labels: { app: ai-sre-agent }
data:
  app.py: |-
    import os, ssl, json, time, urllib.request, urllib.parse, traceback, html
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
    
    TOKEN=open('/var/run/secrets/kubernetes.io/serviceaccount/token').read().strip()
    CA='/var/run/secrets/kubernetes.io/serviceaccount/ca.crt'
    K8S='https://kubernetes.default.svc'
    OLLAMA=os.environ.get('OLLAMA_URL','http://ollama:11434')
    MODEL=os.environ.get('MODEL','qwen2.5-coder:7b')
    EMBED_MODEL=os.environ.get('EMBED_MODEL','nomic-embed-text')
    QDRANT=os.environ.get('QDRANT_URL','http://qdrant.qdrant.svc:6333')
    QDRANT_COLLECTION=os.environ.get('QDRANT_COLLECTION','sre_kb')
    UI_TOKEN=os.environ.get('SRE_AGENT_TOKEN','')
    AUDIT='/audit/audit.log'
    PENDING='/audit/pending.json'
    INCIDENTS='/audit/incidents.jsonl'
    KNOWLEDGE='/knowledge'
    CTX=ssl.create_default_context(cafile=CA)
    
    def embed(text):
      req=urllib.request.Request(OLLAMA+'/api/embeddings',data=json.dumps({'model':EMBED_MODEL,'prompt':text[:4000]}).encode(),headers={'Content-Type':'application/json'})
      return json.loads(urllib.request.urlopen(req,timeout=60).read()).get('embedding',[])
    
    def qdrant(method,path,body=None):
      data=None if body is None else json.dumps(body).encode()
      req=urllib.request.Request(QDRANT+path,data=data,method=method,headers={'Content-Type':'application/json'})
      with urllib.request.urlopen(req,timeout=30) as r: return json.loads(r.read().decode())
    
    def rag_init():
      try:
        qdrant('PUT','/collections/'+QDRANT_COLLECTION,{'vectors':{'size':768,'distance':'Cosine'}})
      except Exception: pass
    
    def rag_index(doc_id, text, meta):
      try:
        v=embed(text)
        if not v: return
        qdrant('PUT','/collections/'+QDRANT_COLLECTION+'/points',{'points':[{'id':doc_id,'vector':v,'payload':{'text':text[:2000],**meta}}]})
      except Exception as e:
        try: open(AUDIT,'a').write(time.strftime('%FT%T%z ')+'rag_index_error: '+repr(e)+'\n')
        except Exception: pass
    
    def rag_search(query, top_k=3):
      try:
        v=embed(query)
        if not v: return []
        r=qdrant('POST','/collections/'+QDRANT_COLLECTION+'/points/search',{'vector':v,'limit':top_k,'with_payload':True})
        return [{'score':p.get('score'),'text':p.get('payload',{}).get('text',''),'source':p.get('payload',{}).get('source','')} for p in r.get('result',[])]
      except Exception: return []
    
    def rag_index_events():
      try:
        ev=k8s('GET','/api/v1/events?limit=300')
        items=ev.get('items',[]) if isinstance(ev,dict) else []
        items=[e for e in items if e.get('type')=='Warning']
        items.sort(key=lambda e: e.get('lastTimestamp') or e.get('eventTime') or '', reverse=True)
        pid=900000
        for e in items[:150]:
          ns=e.get('involvedObject',{}).get('namespace','-')
          kind=e.get('involvedObject',{}).get('kind','-')
          name=e.get('involvedObject',{}).get('name','-')
          reason=e.get('reason','')
          msg=e.get('message','')
          ts=e.get('lastTimestamp','')
          txt='Warning event %s/%s/%s reason=%s at=%s msg=%s' % (ns,kind,name,reason,ts,msg)
          rag_index(pid, txt, {'source':'k8s_events','kind':'event','ns':ns,'reason':reason}); pid+=1
      except Exception as e:
        try: open(AUDIT,'a').write(time.strftime('%FT%T%z ')+'rag_events_error: '+repr(e)+'\n')
        except Exception: pass
    
    def rag_index_helmreleases():
      try:
        pid=800000
        for hr in list_helmreleases():
          ns=hr.get('metadata',{}).get('namespace','-'); name=hr.get('metadata',{}).get('name','-')
          st=hr_status(hr) or {}
          txt='HelmRelease %s/%s ready=%s reason=%s msg=%s chart=%s' % (ns,name,st.get('ready'),st.get('reason'),st.get('message',''),hr.get('spec',{}).get('chart',{}).get('spec',{}).get('chart',''))
          rag_index(pid, txt, {'source':'flux_hr','kind':'helmrelease','ns':ns,'name':name}); pid+=1
      except Exception as e:
        try: open(AUDIT,'a').write(time.strftime('%FT%T%z ')+'rag_hr_error: '+repr(e)+'\n')
        except Exception: pass
    
    def rag_bootstrap():
      rag_init()
      pid=1
      try:
        for fn in os.listdir(KNOWLEDGE):
          p=os.path.join(KNOWLEDGE,fn)
          if not os.path.isfile(p): continue
          try: txt=open(p,encoding='utf-8',errors='ignore').read()
          except Exception: continue
          for i in range(0,len(txt),1500):
            chunk=txt[i:i+1500]
            if chunk.strip(): rag_index(pid,chunk,{'source':fn,'kind':'knowledge'}); pid+=1
      except Exception: pass
      try:
        if os.path.exists(INCIDENTS):
          for ln in open(INCIDENTS,encoding='utf-8',errors='ignore'):
            ln=ln.strip()
            if not ln: continue
            rag_index(pid,ln,{'source':'incidents.jsonl','kind':'incident'}); pid+=1
      except Exception: pass
      rag_index_events()
      rag_index_helmreleases()
    
    def rag_refresh_loop():
      while True:
        try: time.sleep(300)
        except Exception: time.sleep(60)
        try: rag_index_events()
        except Exception: pass
        try: rag_index_helmreleases()
        except Exception: pass
    
    def audit(msg):
      os.makedirs('/audit', exist_ok=True)
      with open(AUDIT,'a',encoding='utf-8') as f:
        f.write(time.strftime('%FT%T%z ') + msg + '\n')
    
    def k8s(method, path, body=None, ctype='application/json', timeout=25):
      data=None if body is None else json.dumps(body).encode()
      req=urllib.request.Request(K8S+path, data=data, method=method)
      req.add_header('Authorization','Bearer '+TOKEN)
      req.add_header('Accept','application/json')
      if body is not None:
        req.add_header('Content-Type',ctype)
      with urllib.request.urlopen(req, context=CTX, timeout=timeout) as r:
        raw=r.read().decode('utf-8','replace')
        return json.loads(raw) if raw else {}
    
    def ollama(prompt, num_predict=350):
      body=json.dumps({'model':MODEL,'prompt':prompt,'stream':False,'options':{'temperature':0.1,'num_predict':num_predict}}).encode()
      req=urllib.request.Request(OLLAMA+'/api/generate',data=body,headers={'Content-Type':'application/json'})
      with urllib.request.urlopen(req, timeout=900) as r:
        return json.loads(r.read().decode()).get('response','')
    
    def ollama_chat(messages, tools=None, num_predict=600):
      payload={'model':MODEL,'messages':messages,'stream':False,'options':{'temperature':0.1,'num_predict':num_predict}}
      if tools: payload['tools']=tools
      req=urllib.request.Request(OLLAMA+'/api/chat',data=json.dumps(payload).encode(),headers={'Content-Type':'application/json'})
      with urllib.request.urlopen(req, timeout=900) as r:
        return json.loads(r.read().decode()).get('message',{})
    
    def hr_status(hr):
      conds=hr.get('status',{}).get('conditions',[]) or []
      ready=next((c for c in conds if c.get('type')=='Ready'),{})
      return {
        'name': hr['metadata']['name'],
        'namespace': hr['metadata']['namespace'],
        'ready': ready.get('status','Unknown'),
        'reason': ready.get('reason',''),
        'message': ready.get('message',''),
        'suspended': hr.get('spec',{}).get('suspend',False),
      }
    
    def list_helmreleases():
      try:
        return k8s('GET','/apis/helm.toolkit.fluxcd.io/v2/helmreleases').get('items',[])
      except Exception:
        try:
          return k8s('GET','/apis/helm.toolkit.fluxcd.io/v2beta2/helmreleases').get('items',[])
        except Exception:
          return []
    
    def collect(include_logs=True):
      pods=k8s('GET','/api/v1/pods?limit=1000').get('items',[])
      nodes=k8s('GET','/api/v1/nodes').get('items',[])
      hrs=list_helmreleases()
      bad=[]
      for p in pods:
        phase=p.get('status',{}).get('phase')
        waiting=[]
        for cs in p.get('status',{}).get('containerStatuses',[]) or []:
          st=cs.get('state',{})
          if st.get('waiting'):
            waiting.append(cs.get('name','?')+':'+st['waiting'].get('reason','waiting'))
        if phase not in ('Running','Succeeded') or waiting:
          bad.append({'ns':p['metadata']['namespace'],'pod':p['metadata']['name'],'phase':phase,'node':p.get('spec',{}).get('nodeName',''),'waiting':waiting})
      logs=[]
      if include_logs:
        for b in bad[:8]:
          try:
            path='/api/v1/namespaces/%s/pods/%s/log?tailLines=80&allContainers=true' % (urllib.parse.quote(b['ns']), urllib.parse.quote(b['pod']))
            req=urllib.request.Request(K8S+path,headers={'Authorization':'Bearer '+TOKEN})
            with urllib.request.urlopen(req, context=CTX, timeout=12) as r:
              txt=r.read().decode('utf-8','replace')[-4500:]
            logs.append('### %s/%s\n%s' % (b['ns'],b['pod'],txt))
          except Exception as e:
            logs.append('### %s/%s\nLOG_ERROR %s' % (b['ns'],b['pod'],e))
      return {
        'nodesReady': sum(1 for n in nodes for c in n.get('status',{}).get('conditions',[]) if c.get('type')=='Ready' and c.get('status')=='True'),
        'nodesTotal': len(nodes),
        'badPods': bad[:30],
        'badPodsCount': len(bad),
        'fluxProblemApps':[hr_status(h) for h in hrs if hr_status(h)['ready']!='True' and not hr_status(h)['suspended']],
        'logs':'\n\n'.join(logs)
      }
    
    def read_text(path):
      try:
        return open(path, encoding='utf-8').read()
      except Exception:
        return ''
    
    def load_knowledge():
      return {
        'rules': read_text(KNOWLEDGE + '/rules.yaml'),
        'runbooks': read_text(KNOWLEDGE + '/runbooks.yaml'),
        'seed_incidents': read_text(KNOWLEDGE + '/incidents.seed.jsonl'),
        'runtime_incidents': read_text(INCIDENTS),
      }
    
    def similar_incidents(service, data):
      text=(service+' '+json.dumps(data,ensure_ascii=False)).lower()
      rows=[]
      for src in (read_text(KNOWLEDGE + '/incidents.seed.jsonl'), read_text(INCIDENTS)):
        for line in src.splitlines():
          line=line.strip()
          if not line:
            continue
          try:
            item=json.loads(line)
          except Exception:
            continue
          hay=json.dumps(item,ensure_ascii=False).lower()
          score=0
          for tok in set((service+' grafana headlamp ingress flux helm image pod crashloop datasource 502 503').split()):
            if tok in text and tok in hay:
              score += 1
          if score:
            rows.append((score,item))
      rows=sorted(rows, key=lambda x:x[0], reverse=True)[:3]
      return [r[1] for r in rows]
    
    def append_incident(p, result, verify):
      item={
        'ts': time.strftime('%FT%TZ', time.gmtime()),
        'service': p.get('target'),
        'namespace': p.get('namespace'),
        'symptom': p.get('userMessage'),
        'proposed_action': p.get('action'),
        'result': result,
        'verify': verify,
      }
      os.makedirs('/audit', exist_ok=True)
      with open(INCIDENTS, 'a', encoding='utf-8') as f:
        f.write(json.dumps(item, ensure_ascii=False)+'\n')
      try: rag_index(int(time.time()*1000)%2**31, json.dumps(item,ensure_ascii=False), {'source':'incidents.jsonl','kind':'incident'})
      except Exception: pass
    
    def collect_target(target):
      ns = target if target else ''
      out = {'target': target, 'namespace': ns, 'pods': [], 'logs': '', 'ingresses': [], 'services': [], 'flux': []}
      try:
        pods = k8s('GET','/api/v1/namespaces/%s/pods?limit=200' % urllib.parse.quote(ns)).get('items',[])
        for p in pods:
          waiting=[]
          for cs in p.get('status',{}).get('containerStatuses',[]) or []:
            st=cs.get('state',{})
            if st.get('waiting'):
              waiting.append(cs.get('name','?')+':'+st['waiting'].get('reason','waiting'))
          out['pods'].append({'name':p['metadata']['name'],'phase':p.get('status',{}).get('phase'),'ready':p.get('status',{}).get('containerStatuses',[]),'waiting':waiting})
        logs=[]
        for p in pods[:4]:
          try:
            path='/api/v1/namespaces/%s/pods/%s/log?tailLines=80&allContainers=true' % (urllib.parse.quote(ns), urllib.parse.quote(p['metadata']['name']))
            req=urllib.request.Request(K8S+path,headers={'Authorization':'Bearer '+TOKEN})
            with urllib.request.urlopen(req, context=CTX, timeout=12) as r:
              logs.append('### '+p['metadata']['name']+'\n'+r.read().decode('utf-8','replace')[-3500:])
          except Exception as e:
            logs.append('### '+p['metadata']['name']+'\nLOG_ERROR '+repr(e))
        out['logs']='\n\n'.join(logs)
      except Exception as e:
        out['pods_error']=repr(e)
      try:
        out['ingresses']=k8s('GET','/apis/networking.k8s.io/v1/namespaces/%s/ingresses' % urllib.parse.quote(ns)).get('items',[])
      except Exception as e:
        out['ingress_error']=repr(e)
      try:
        out['services']=k8s('GET','/api/v1/namespaces/%s/services' % urllib.parse.quote(ns)).get('items',[])
      except Exception as e:
        out['services_error']=repr(e)
      try:
        hrs=list_helmreleases()
        out['flux']=[hr_status(h) for h in hrs if h['metadata']['namespace']==ns or target in h['metadata']['name']]
      except Exception as e:
        out['flux_error']=repr(e)
      return out
    
    def load_pending():
      try:
        return json.load(open(PENDING, encoding='utf-8'))
      except Exception:
        return None
    
    def save_pending(p):
      os.makedirs('/audit', exist_ok=True)
      with open(PENDING, 'w', encoding='utf-8') as f:
        json.dump(p, f, ensure_ascii=False, indent=2)
    
    def clear_pending():
      try:
        os.remove(PENDING)
      except Exception:
        pass
    
    def delete_events():
      nss=[n['metadata']['name'] for n in k8s('GET','/api/v1/namespaces').get('items',[])]
      cnt=0
      for ns in nss:
        try:
          evs=k8s('GET','/apis/events.k8s.io/v1/namespaces/%s/events' % ns).get('items',[])
          for e in evs:
            k8s('DELETE','/apis/events.k8s.io/v1/namespaces/%s/events/%s' % (ns, urllib.parse.quote(e['metadata']['name'])))
            cnt+=1
        except Exception:
          pass
      audit('approved_fix delete_events count=%s' % cnt)
      return 'Vymazané Kubernetes events: %s' % cnt
    
    def restart_deploy(ns,name):
      body={'spec':{'template':{'metadata':{'annotations':{'ai-sre-agent/restartedAt':time.strftime('%FT%TZ',time.gmtime())}}}}}
      k8s('PATCH','/apis/apps/v1/namespaces/%s/deployments/%s' % (urllib.parse.quote(ns), urllib.parse.quote(name)), body, 'application/merge-patch+json')
      audit('approved_fix restart_deployment %s/%s' % (ns,name))
      return 'Reštartovaný deployment: %s/%s' % (ns,name)
    
    def reconcile_hr(ns, name):
      ts=time.strftime('%FT%TZ', time.gmtime())
      body={'metadata':{'annotations':{'reconcile.fluxcd.io/requestedAt':ts}}}
      k8s('PATCH','/apis/helm.toolkit.fluxcd.io/v2/namespaces/%s/helmreleases/%s' % (urllib.parse.quote(ns), urllib.parse.quote(name)), body, 'application/merge-patch+json')
      audit('approved_fix flux_reconcile %s/%s' % (ns,name))
      return 'Spustený Flux reconcile HelmRelease: %s/%s' % (ns,name)
    
    def infer_target(msg):
      low=msg.lower()
      mapping={'grafana':'grafana','grafanu':'grafana','grafane':'grafana','prometheus':'monitoring','prometheusu':'monitoring','headlamp':'headlamp','headlampu':'headlamp','flux':'flux-system','jenkins':'jenkins','jenkinsu':'jenkins','gitea':'gitea','giteu':'gitea','zabbix':'zabbix','zabbixu':'zabbix','chef':'chef','chefa':'chef','signoz':'signoz','signozu':'signoz','authentik':'authentik','puppet':'puppet','pe':'pe-console','pe-console':'pe-console'}
      for k,v in mapping.items():
        if k in low:
          return k,v
      return '', ''
    
    def propose_action(target, ns, data):
      hr = data.get('flux',[{}])[0] if data.get('flux') else {}
      bad_pods=[p for p in data.get('pods',[]) if p.get('phase') not in ('Running','Succeeded') or p.get('waiting')]
      if hr.get('ready') and hr.get('ready') != 'True' and not hr.get('suspended'):
        return {'kind':'flux_reconcile','namespace':hr.get('namespace',ns),'name':hr.get('name')}
      if bad_pods:
        return {'kind':'restart_deploy','namespace':ns,'name':target}
      return {'kind':'none'}
    
    def render_plan(target, ns, data, proposed, user_msg):
      pods=data.get('pods',[])
      bad=[p for p in pods if p.get('phase') not in ('Running','Succeeded') or p.get('waiting')]
      apps=data.get('flux',[])
      apptxt=', '.join('%s/%s ready=%s reason=%s' % (a.get('namespace'),a.get('name'),a.get('ready'),a.get('reason')) for a in apps) or 'nenašiel som Flux HelmRelease'
      sims=similar_incidents(ns, data)
      simtxt='; '.join('%s: %s -> %s' % (s.get('service','?'), s.get('symptom','?'), s.get('fix',s.get('result','?'))) for s in sims) or 'nenašiel som podobný incident'
      if proposed.get('kind')=='flux_reconcile':
        navrh='Spustiť Flux reconcile HelmRelease %s/%s.' % (proposed.get('namespace'), proposed.get('name'))
      elif proposed.get('kind')=='restart_deploy':
        navrh='Reštartovať deployment %s/%s.' % (proposed.get('namespace'), proposed.get('name'))
      else:
        navrh='Zatiaľ nerobiť zmenu, iba sledovať alebo spraviť hlbšiu diagnostiku.'
      ans=('Diagnóza:\n'
           '- Skontroloval som namespace %s. Pods: %s, problémové: %s.\n'
           '- Flux: %s.\n\n'
         '- Podobné incidenty: %s.\n\n'
           'Návrh:\n'
           '- %s\n\n'
           'Riziko:\n'
           '- Zmenu nevykonám bez schválenia. Pri reštarte môže byť krátky výpadok služby.\n\n'
           'Čakám na schválenie:\n'
           '- Ak súhlasíš, napíš: schvaľujem\n'
           '- Ak nesúhlasíš, napíš: zamietam' % (ns, len(pods), len(bad), apptxt, simtxt, navrh))
      save_pending({'createdAt':time.time(),'userMessage':user_msg,'target':target,'namespace':ns,'action':proposed,'summary':ans})
      return ans
    
    def execute_pending():
      p=load_pending()
      if not p:
        return 'Nemám čakajúci návrh na vykonanie. Najprv napíš napríklad: oprav grafanu.'
      a=p.get('action',{})
      if a.get('kind')=='flux_reconcile':
        res=reconcile_hr(a.get('namespace',''), a.get('name',''))
      elif a.get('kind')=='restart_deploy':
        res=restart_deploy(a.get('namespace',''), a.get('name',''))
      elif a.get('kind')=='none':
        res='Nebola navrhnutá žiadna bezpečná automatická zmena. Treba ďalšiu diagnózu alebo manuálny fix.'
      else:
        res='Neznámy typ čakajúcej akcie: '+json.dumps(a,ensure_ascii=False)
      clear_pending()
      c=collect(include_logs=False)
      verify='nodes: %s/%s ready; problem pods: %s; Flux problem HRs: %s' % (c['nodesReady'],c['nodesTotal'],c['badPodsCount'],len(c['fluxProblemApps']))
      append_incident(p, res, verify)
      return res+'\n\nOverenie:\n- '+verify+'\n\nIncident som zapísal do knowledge base.'
    
    TOOLS=[
      {"type":"function","function":{"name":"get_pods","description":"List Kubernetes pods. namespace empty=all. only_problems=true returns only pods not Running.","parameters":{"type":"object","properties":{"namespace":{"type":"string"},"only_problems":{"type":"boolean"}}}}},
      {"type":"function","function":{"name":"get_pod_logs","description":"Get last N lines of logs from a container of a pod.","parameters":{"type":"object","properties":{"namespace":{"type":"string"},"name":{"type":"string"},"lines":{"type":"integer"},"container":{"type":"string"}},"required":["namespace","name"]}}},
      {"type":"function","function":{"name":"get_events","description":"Get recent Warning events from a namespace (or all).","parameters":{"type":"object","properties":{"namespace":{"type":"string"}}}}},
      {"type":"function","function":{"name":"describe_pod","description":"Get pod status: containers, restarts, conditions, message.","parameters":{"type":"object","properties":{"namespace":{"type":"string"},"name":{"type":"string"}},"required":["namespace","name"]}}},
      {"type":"function","function":{"name":"get_helmreleases","description":"List Flux HelmReleases with Ready status. only_problems=true filters to non-Ready ones.","parameters":{"type":"object","properties":{"only_problems":{"type":"boolean"}}}}},
      {"type":"function","function":{"name":"get_nodes","description":"List Kubernetes nodes with Ready status and roles.","parameters":{"type":"object","properties":{}}}},
      {"type":"function","function":{"name":"get_ingresses","description":"List Ingresses with hosts and target services.","parameters":{"type":"object","properties":{"namespace":{"type":"string"}}}}},
      {"type":"function","function":{"name":"search_runbooks","description":"Search past incidents and runbooks for similar problems (semantic RAG).","parameters":{"type":"object","properties":{"query":{"type":"string"}},"required":["query"]}}},
    ]
    
    def tool_get_pods(args):
      ns=args.get('namespace') or ''
      only_problems=bool(args.get('only_problems'))
      path='/api/v1/namespaces/'+urllib.parse.quote(ns)+'/pods?limit=200' if ns else '/api/v1/pods?limit=500'
      pods=k8s('GET',path).get('items',[])
      out=[]
      for p in pods:
        md=p.get('metadata',{}); st=p.get('status',{})
        phase=st.get('phase'); conds={c.get('type'):c.get('status') for c in st.get('conditions',[]) or []}
        cs=st.get('containerStatuses',[]) or []
        waiting=[c.get('state',{}).get('waiting',{}).get('reason') for c in cs if c.get('state',{}).get('waiting')]
        restarts=sum(c.get('restartCount',0) for c in cs)
        bad=phase!='Running' or conds.get('Ready')!='True' or any(waiting)
        if only_problems and not bad: continue
        out.append({'ns':md.get('namespace'),'name':md.get('name'),'phase':phase,'ready':conds.get('Ready'),'waiting':waiting,'restarts':restarts})
      return {'count':len(out),'pods':out[:60]}
    
    def tool_get_pod_logs(args):
      ns=args.get('namespace'); name=args.get('name'); lines=int(args.get('lines') or 100); cont=args.get('container') or ''
      q='?tailLines=%d' % min(lines,500)
      if cont: q+='&container='+urllib.parse.quote(cont)
      try:
        req=urllib.request.Request(K8S+'/api/v1/namespaces/'+urllib.parse.quote(ns)+'/pods/'+urllib.parse.quote(name)+'/log'+q)
        req.add_header('Authorization','Bearer '+TOKEN)
        with urllib.request.urlopen(req,context=CTX,timeout=25) as r:
          txt=r.read().decode(errors='replace')
        return {'lines':txt[-8000:]}
      except Exception as e:
        return {'error':repr(e)}
    
    def tool_get_events(args):
      ns=args.get('namespace') or ''
      path='/api/v1/namespaces/'+urllib.parse.quote(ns)+'/events?limit=100' if ns else '/api/v1/events?limit=300'
      evs=k8s('GET',path).get('items',[])
      out=[]
      for e in evs:
        if e.get('type')!='Warning': continue
        out.append({'ns':e.get('metadata',{}).get('namespace'),'reason':e.get('reason'),'object':e.get('involvedObject',{}).get('kind','')+'/'+e.get('involvedObject',{}).get('name',''),'message':(e.get('message','') or '')[:300],'lastTimestamp':e.get('lastTimestamp') or e.get('eventTime')})
      out.sort(key=lambda x: x.get('lastTimestamp') or '', reverse=True)
      return {'count':len(out),'events':out[:30]}
    
    def tool_describe_pod(args):
      ns=args.get('namespace'); name=args.get('name')
      try:
        p=k8s('GET','/api/v1/namespaces/'+urllib.parse.quote(ns)+'/pods/'+urllib.parse.quote(name))
      except Exception as e: return {'error':repr(e)}
      st=p.get('status',{}); cs=st.get('containerStatuses',[]) or []
      return {'phase':st.get('phase'),'message':st.get('message'),'reason':st.get('reason'),'conditions':[{'type':c.get('type'),'status':c.get('status'),'reason':c.get('reason'),'message':(c.get('message','') or '')[:200]} for c in st.get('conditions',[]) or []],'containers':[{'name':c.get('name'),'image':c.get('image'),'ready':c.get('ready'),'restartCount':c.get('restartCount'),'state':list(c.get('state',{}).keys()),'lastTermination':c.get('lastState',{}).get('terminated')} for c in cs]}
    
    def tool_get_helmreleases(args):
      only_problems=bool(args.get('only_problems'))
      hrs=list_helmreleases()
      out=[hr_status(h) for h in hrs]
      if only_problems: out=[h for h in out if h['ready']!='True' and not h['suspended']]
      return {'count':len(out),'helmreleases':[{'ns':h['namespace'],'name':h['name'],'ready':h['ready'],'message':(h.get('message','') or '')[:300]} for h in out[:40]]}
    
    def tool_get_nodes(args):
      ns=k8s('GET','/api/v1/nodes').get('items',[])
      out=[]
      for n in ns:
        conds={c.get('type'):c.get('status') for c in n.get('status',{}).get('conditions',[]) or []}
        out.append({'name':n.get('metadata',{}).get('name'),'ready':conds.get('Ready'),'roles':[k.split('/')[-1] for k in (n.get('metadata',{}).get('labels',{}) or {}) if k.startswith('node-role.kubernetes.io/')]})
      return {'count':len(out),'nodes':out}
    
    def tool_get_ingresses(args):
      ns=args.get('namespace') or ''
      path='/apis/networking.k8s.io/v1/namespaces/'+urllib.parse.quote(ns)+'/ingresses' if ns else '/apis/networking.k8s.io/v1/ingresses'
      igs=k8s('GET',path).get('items',[])
      out=[]
      for i in igs:
        md=i.get('metadata',{}); rules=i.get('spec',{}).get('rules',[]) or []
        hosts=[r.get('host') for r in rules]
        backends=[]
        for r in rules:
          for p in (r.get('http',{}).get('paths',[]) or []):
            b=p.get('backend',{}).get('service',{})
            backends.append((b.get('name'),b.get('port',{}).get('number')))
        out.append({'ns':md.get('namespace'),'name':md.get('name'),'hosts':hosts,'backends':backends})
      return {'count':len(out),'ingresses':out[:40]}
    
    def tool_search_runbooks(args):
      q=args.get('query') or ''
      hits=rag_search(q, top_k=5)
      return {'count':len(hits),'hits':[{'score':round(h.get('score') or 0,3),'source':h.get('source'),'text':(h.get('text') or '')[:500]} for h in hits]}
    
    TOOL_FNS={
      'get_pods':tool_get_pods,
      'get_pod_logs':tool_get_pod_logs,
      'get_events':tool_get_events,
      'describe_pod':tool_describe_pod,
      'get_helmreleases':tool_get_helmreleases,
      'get_nodes':tool_get_nodes,
      'get_ingresses':tool_get_ingresses,
      'search_runbooks':tool_search_runbooks,
    }
    
    SYSTEM_PROMPT='''Si Kubernetes SRE agent v klastri pouzivatela. Odpovedaj vyhradne po slovensky, strucne.
    
    PRAVIDLA:
    - Mas k dispozicii nastroje (tools). VOLAJ ICH na ziskanie datzkriesla, NIKDY si nevymyslaj cisla, mena podov, namespace ani chyby.
    - Klaster pouziva Flux.
    - Ak na otazku nepotrebujes data, odpovedz priamo bez volania nastrojov.
    - Bezne otazky o stave: zavolaj get_nodes a get_pods(only_problems=true) a get_helmreleases(only_problems=true).
    - Pri konkretnej sluzbe (napr. grafana): zavolaj get_pods(namespace=...) -> describe_pod -> get_pod_logs -> get_events.
    - Pri novom probleme zavolaj search_runbooks aby si nasiel podobny historicky incident.
    - Po max 4 volaniach napis FINALNU odpoved v tomto formate:
      Stav:
      <2-3 vety>
      Diagnoza:
      <co je zle, alebo "ziadne problemy">
      Navrh:
      <konkretny krok alebo "netreba zasahovat">
    
    Pri rizikovych zmenach (delete, restart, reconcile) NIKDY ich nespustaj sam. Iba navrhni a pockaj na potvrdenie pouzivatela formou: "potvrd vymazat events", "potvrd restart deployment ns/name", "potvrd flux reconcile ns/name".'''
    
    def chat_with_tools(user_msg, max_iters=4):
      msgs=[{'role':'system','content':SYSTEM_PROMPT},{'role':'user','content':user_msg}]
      for _ in range(max_iters):
        m=ollama_chat(msgs, tools=TOOLS, num_predict=600)
        tc=m.get('tool_calls') or []
        if not tc:
          return m.get('content','').strip() or '(prazdna odpoved modelu)'
        msgs.append({'role':'assistant','content':m.get('content',''),'tool_calls':tc})
        for call in tc[:4]:
          fn=(call.get('function') or {}).get('name')
          args=(call.get('function') or {}).get('arguments') or {}
          if isinstance(args,str):
            try: args=json.loads(args)
            except Exception: args={}
          try:
            result=TOOL_FNS[fn](args) if fn in TOOL_FNS else {'error':'unknown tool '+str(fn)}
          except Exception as e:
            result={'error':repr(e)}
          audit('tool '+str(fn)+' '+json.dumps(args,ensure_ascii=False)[:200])
          msgs.append({'role':'tool','content':json.dumps(result,ensure_ascii=False)[:6000]})
      m=ollama_chat(msgs+[{'role':'user','content':'Daj mi finalnu odpoved teraz vo formate Stav/Diagnoza/Navrh, ziadne dalsie volania nastrojov.'}], tools=None, num_predict=500)
      return (m.get('content') or '').strip() or '(model neodpovedal)'
    
    def answer_user(msg):
      low=msg.lower().strip()
      if low in ('schvaľujem','schvalujem','schval aktualny navrh','potvrdzujem','suhlasim','súhlasím'):
        return execute_pending()
      if low in ('zrus','zruš','zamietam','neschvalujem'):
        clear_pending(); return 'Čakajúci návrh je zrušený. Nič som nezmenil.'
      if 'potvrd' in low and 'event' in low:
        return delete_events()+'\n\nOverenie: spusti otázku "skontroluj stav".'
      if low.startswith('potvrd restart deployment '):
        target=low.replace('potvrd restart deployment ','').strip()
        if '/' not in target: return 'Formát: potvrď restart deployment namespace/name'
        ns,name=target.split('/',1); return restart_deploy(ns,name)
      if low.startswith('potvrd flux reconcile '):
        target=low.replace('potvrd flux reconcile ','').strip()
        if '/' not in target: return 'Formát: potvrď flux reconcile namespace/name'
        ns,name=target.split('/',1); return reconcile_hr(ns,name)
      try:
        return chat_with_tools(msg)
      except Exception as e:
        try: c=collect(include_logs=False)
        except Exception: c={'nodesReady':'?','nodesTotal':'?','badPodsCount':'?','fluxProblemApps':[]}
        return 'Chyba pri volani modelu/nastrojov: %r\n\nRychly stav: nodes %s/%s ready, badPods=%s, problemApps=%s' % (e,c.get('nodesReady'),c.get('nodesTotal'),c.get('badPodsCount'),len(c.get('fluxProblemApps',[])))
    
    PAGE='''<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI SRE Agent</title><style>
    :root{color-scheme:dark}body{margin:0;font-family:Inter,Segoe UI,system-ui;background:#0b1020;color:#e7eaf3}.top{height:52px;display:flex;align-items:center;gap:14px;padding:0 18px;background:#121a31;border-bottom:1px solid #26304d;position:sticky;top:0}.dot{width:10px;height:10px;border-radius:50%;background:#22c55e}.brand{font-weight:700}.status{font-size:13px;color:#aab3cf}.wrap{max-width:980px;margin:0 auto;padding:22px}.chat{display:flex;flex-direction:column;gap:14px;min-height:calc(100vh - 190px)}.msg{padding:14px 16px;border-radius:14px;line-height:1.45;white-space:pre-wrap}.user{align-self:flex-end;background:#2563eb;color:white;max-width:78%}.bot{align-self:flex-start;background:#151f38;border:1px solid #2b385c;max-width:86%}.composer{position:sticky;bottom:0;background:linear-gradient(transparent,#0b1020 20%);padding:18px 0}.box{display:flex;gap:10px}.box textarea{flex:1;min-height:54px;max-height:160px;resize:vertical;border-radius:14px;border:1px solid #34415f;background:#11182b;color:#e7eaf3;padding:13px}.box button,.login button{border:0;border-radius:12px;background:#22c55e;color:#07120b;font-weight:700;padding:0 18px}.hint{font-size:12px;color:#8f9ab8;margin-top:8px}.login{max-width:420px;margin:90px auto;background:#151f38;border:1px solid #2b385c;padding:24px;border-radius:18px}.login input{width:100%;box-sizing:border-box;border-radius:12px;border:1px solid #34415f;background:#0b1020;color:#e7eaf3;padding:13px;margin:12px 0}.spinner{color:#aab3cf}
    </style></head><body>{body}</body></html>'''
    APP='''<div class="top"><span class="dot"></span><span class="brand">AI SRE Agent</span><span id="status" class="status">načítavam stav…</span></div><div class="wrap"><div id="chat" class="chat"><div class="msg bot">Som lokálny SRE agent. Napíš problém normálne ako sem. Budem robiť: logy → diagnóza → plán → schválenie → fix → overenie.</div></div><div class="composer"><div class="box"><textarea id="input" placeholder="Napr. Skontroluj prečo Grafana nejde…"></textarea><button onclick="send()">Odoslať</button></div><div class="hint">Safe potvrdenia: „potvrď vymazať events“, „potvrď restart deployment namespace/name“, „potvrď flux reconcile namespace/name“. Po odpovedi klikni 👍/👎 — agent sa z toho učí.</div></div></div><script>
    let lastQ='';
    async function status(){try{let r=await fetch('/api/status');let j=await r.json();document.getElementById('status').textContent=`model ${j.model} · nodes ${j.nodesReady}/${j.nodesTotal} · bad pods ${j.badPodsCount} · Flux problémy ${j.problemApps}`}catch(e){document.getElementById('status').textContent='status nedostupný'}}
    function add(cls,txt){let d=document.createElement('div');d.className='msg '+cls;d.textContent=txt;document.getElementById('chat').appendChild(d);d.scrollIntoView({behavior:'smooth',block:'end'});return d}
    function addFeedback(answer){let q=lastQ;let bar=document.createElement('div');bar.className='fb';bar.style.cssText='align-self:flex-start;display:flex;gap:8px;margin-top:-6px;font-size:13px;color:#8f9ab8';let yes=document.createElement('button');yes.textContent='👍 užitočné';let no=document.createElement('button');no.textContent='👎 nie';for(let b of [yes,no]){b.style.cssText='background:#1a2444;border:1px solid #34415f;color:#e7eaf3;border-radius:8px;padding:4px 10px;cursor:pointer'};yes.onclick=()=>send_fb(q,answer,true,bar);no.onclick=()=>send_fb(q,answer,false,bar);bar.appendChild(yes);bar.appendChild(no);document.getElementById('chat').appendChild(bar)}
    async function send_fb(q,a,useful,bar){try{await fetch('/api/feedback',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q,answer:a,useful:useful})});bar.textContent=useful?'✓ uložené ako úspešné (pridané do RAG)':'✓ uložené ako neúspešné';bar.style.color='#22c55e'}catch(e){bar.textContent='chyba pri ukladaní spätnej väzby'}}
    async function send(){let el=document.getElementById('input');let text=el.value.trim();if(!text)return;el.value='';lastQ=text;add('user',text);let wait=add('bot spinner','pracujem… na CPU to môže trvať aj niekoľko minút');try{let r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text})});let j=await r.json();let ans=j.answer||JSON.stringify(j);wait.className='msg bot';wait.textContent=ans;addFeedback(ans)}catch(e){wait.className='msg bot';wait.textContent='Chyba alebo timeout: '+e}status()}
    document.getElementById('input').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.ctrlKey)send()});status();setInterval(status,30000);
    </script>'''
    
    class H(BaseHTTPRequestHandler):
      def authed(self, data=None):
        if not UI_TOKEN: return True
        cookie=self.headers.get('Cookie','')
        if ('sre_agent='+UI_TOKEN) in cookie: return True
        if data and data.get('token',[''])[0] == UI_TOKEN: return True
        qs=urllib.parse.parse_qs(urllib.parse.urlparse(self.path).query)
        return qs.get('token',[''])[0] == UI_TOKEN
      def send_html(self,body,code=200):
        b=PAGE.replace('{body}',body).encode()
        self.send_response(code); self.send_header('Content-Type','text/html; charset=utf-8'); self.send_header('Content-Length',str(len(b))); self.end_headers(); self.wfile.write(b)
      def send_json(self,obj,code=200):
        b=json.dumps(obj,ensure_ascii=False).encode()
        self.send_response(code); self.send_header('Content-Type','application/json; charset=utf-8'); self.send_header('Content-Length',str(len(b))); self.end_headers(); self.wfile.write(b)
      def login(self,msg=''):
        self.send_html('<div class="login"><h1>AI SRE Agent</h1><p>'+html.escape(msg or 'Zadaj agent token.')+'</p><form method="post" action="/login"><input name="token" type="password" autofocus placeholder="agent token"><button>Prihlásiť</button></form></div>')
      def do_HEAD(self): self.send_response(200); self.end_headers()
      def do_GET(self):
        if self.path.startswith('/api/status'):
          if not self.authed(): return self.send_json({'error':'unauthorized'},401)
          c=collect(include_logs=False); return self.send_json({'model':MODEL,'nodesReady':c['nodesReady'],'nodesTotal':c['nodesTotal'],'badPodsCount':c['badPodsCount'],'problemApps':len(c['fluxProblemApps'])})
        if not self.authed(): return self.login()
        self.send_html(APP)
      def do_POST(self):
        try:
          ln=int(self.headers.get('Content-Length','0')); raw=self.rfile.read(ln).decode()
          if self.path=='/login':
            data=urllib.parse.parse_qs(raw)
            if data.get('token',[''])[0] == UI_TOKEN:
              self.send_response(303); self.send_header('Set-Cookie','sre_agent='+UI_TOKEN+'; Path=/; HttpOnly; Secure; SameSite=Lax'); self.send_header('Location','/'); self.end_headers(); return
            return self.login('Zlý token')
          if not self.authed(): return self.send_json({'error':'unauthorized'},401)
          if self.path=='/api/chat':
            msg=json.loads(raw or '{}').get('message','')[:4000]
            audit('chat '+msg.replace('\n',' ')[:300])
            return self.send_json({'answer':answer_user(msg)})
          if self.path=='/api/feedback':
            try: d=json.loads(raw or '{}')
            except Exception: d={}
            q=str(d.get('question',''))[:2000]; a=str(d.get('answer',''))[:4000]
            useful=bool(d.get('useful')); comment=str(d.get('comment',''))[:500]
            rec={'ts':time.strftime('%FT%T%z'),'question':q,'answer':a,'useful':useful,'comment':comment}
            try:
              os.makedirs('/audit',exist_ok=True)
              open('/audit/feedback.jsonl','a',encoding='utf-8').write(json.dumps(rec,ensure_ascii=False)+'\n')
            except Exception: pass
            if useful and q and a:
              try:
                pid=int(time.time()*1000)%2000000000+1000000
                txt='Q: %s\nA: %s' % (q,a)
                rag_index(pid, txt, {'source':'feedback','kind':'feedback_positive'})
              except Exception: pass
            return self.send_json({'ok':True})
          self.send_error(404)
        except Exception:
          self.send_json({'answer':'ERROR\n'+traceback.format_exc()},500)
    
    import threading
    threading.Thread(target=rag_bootstrap,daemon=True).start()
    threading.Thread(target=rag_refresh_loop,daemon=True).start()
    ThreadingHTTPServer(('0.0.0.0',8080),H).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-sre-agent
spec:
  replicas: 1
  selector:
    matchLabels: { app: ai-sre-agent }
  template:
    metadata:
      labels: { app: ai-sre-agent }
      annotations:
        ai-sre-agent/config-version: "2026-05-06-knowledge-1"
        instrumentation.opentelemetry.io/inject-python: "true"
    spec:
      serviceAccountName: ai-sre-agent
      containers:
        - name: app
          image: python:3.11-slim
          command: ["python", "/app/app.py"]
          env:
            - name: OLLAMA_URL
              value: http://ollama:11434
            - name: MODEL
              value: {{ .Values.model | quote }}
            - name: SRE_AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ai-sre-agent-auth
                  key: token
          ports:
            - containerPort: 8080
          resources:
            requests: { cpu: "200m", memory: "256Mi" }
            limits: { cpu: "1", memory: "1Gi" }
          volumeMounts:
            - name: app
              mountPath: /app
            - name: audit
              mountPath: /audit
            - name: knowledge
              mountPath: /knowledge
              readOnly: true
      volumes:
        - name: app
          configMap:
            name: ai-sre-agent-app
        - name: audit
          persistentVolumeClaim:
            claimName: ai-sre-agent-audit
        - name: knowledge
          configMap:
            name: ai-sre-agent-knowledge
---
apiVersion: v1
kind: Service
metadata:
  name: ai-sre-agent
spec:
  selector: { app: ai-sre-agent }
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ai-sre-agent
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "1800"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "1800"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "1800"
    nginx.ingress.kubernetes.io/proxy-next-upstream: "off"
    nginx.ingress.kubernetes.io/proxy-next-upstream-tries: "0"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [{{ .Values.host | quote }}]
      secretName: ai-sre-agent-tls
  rules:
    - host: {{ .Values.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ai-sre-agent
                port:
                  number: 80
