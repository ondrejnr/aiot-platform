apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-sre-agent-app
  labels: { app: ai-sre-agent }
data:
  app.py: |-
    import os, ssl, json, time, urllib.request, urllib.parse, traceback
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    TOKEN=open('/var/run/secrets/kubernetes.io/serviceaccount/token').read().strip()
    CA='/var/run/secrets/kubernetes.io/serviceaccount/ca.crt'
    K8S='https://kubernetes.default.svc'
    OLLAMA=os.environ.get('OLLAMA_URL','http://ollama:11434')
    MODEL=os.environ.get('MODEL','qwen2.5-coder:14b')
    UI_TOKEN=os.environ.get('SRE_AGENT_TOKEN','')
    AUDIT='/audit/audit.log'
    CTX=ssl.create_default_context(cafile=CA)

    def audit(msg):
      os.makedirs('/audit', exist_ok=True)
      with open(AUDIT,'a',encoding='utf-8') as f:
        f.write(time.strftime('%FT%T%z ') + msg + '\n')

    def esc(s):
      return str(s).replace('&','&amp;').replace('<','&lt;').replace('>','&gt;')

    def k8s(method, path, body=None, ctype='application/json'):
      data=None if body is None else json.dumps(body).encode()
      req=urllib.request.Request(K8S+path, data=data, method=method)
      req.add_header('Authorization','Bearer '+TOKEN)
      req.add_header('Accept','application/json')
      if body is not None:
        req.add_header('Content-Type',ctype)
      with urllib.request.urlopen(req, context=CTX, timeout=25) as r:
        raw=r.read().decode('utf-8','replace')
        return json.loads(raw) if raw else {}

    def ollama(prompt):
      body=json.dumps({'model':MODEL,'prompt':prompt,'stream':False,'options':{'temperature':0.1}}).encode()
      req=urllib.request.Request(OLLAMA+'/api/generate',data=body,headers={'Content-Type':'application/json'})
      with urllib.request.urlopen(req, timeout=600) as r:
        return json.loads(r.read().decode()).get('response','')

    def collect():
      pods=k8s('GET','/api/v1/pods?limit=1000').get('items',[])
      nodes=k8s('GET','/api/v1/nodes').get('items',[])
      apps=k8s('GET','/apis/argoproj.io/v1alpha1/namespaces/argocd/applications').get('items',[])
      bad=[]
      for p in pods:
        phase=p.get('status',{}).get('phase')
        waiting=[]
        for cs in p.get('status',{}).get('containerStatuses',[]) or []:
          st=cs.get('state',{})
          if st.get('waiting'):
            waiting.append(cs.get('name','?')+':'+st['waiting'].get('reason','waiting'))
        if phase not in ('Running','Succeeded') or waiting:
          bad.append({'ns':p['metadata']['namespace'],'pod':p['metadata']['name'],'phase':phase,'node':p.get('spec',{}).get('nodeName',''),'waiting':waiting})
      logs=[]
      for b in bad[:8]:
        try:
          path='/api/v1/namespaces/%s/pods/%s/log?tailLines=80&allContainers=true' % (urllib.parse.quote(b['ns']), urllib.parse.quote(b['pod']))
          req=urllib.request.Request(K8S+path,headers={'Authorization':'Bearer '+TOKEN})
          with urllib.request.urlopen(req, context=CTX, timeout=12) as r:
            txt=r.read().decode('utf-8','replace')[-5000:]
          logs.append('### %s/%s\n%s' % (b['ns'],b['pod'],txt))
        except Exception as e:
          logs.append('### %s/%s\nLOG_ERROR %s' % (b['ns'],b['pod'],e))
      return {
        'nodes':[{'name':n['metadata']['name'],'ready':[c for c in n.get('status',{}).get('conditions',[]) if c.get('type')=='Ready']} for n in nodes],
        'badPods':bad[:30],
        'argocd':[{'name':a['metadata']['name'],'sync':a.get('status',{}).get('sync',{}).get('status'),'health':a.get('status',{}).get('health',{}).get('status')} for a in apps],
        'logs':'\n\n'.join(logs)
      }

    def diagnose():
      c=collect()
      prompt='''Si lokalny Kubernetes SRE agent. Postup musi byt: logy -> diagnoza -> plan -> schvalenie -> fix -> overenie. Nic rizikove bez schvalenia. Na zaklade dat napis strucne: 1) co je zle, 2) pravdepodobna pricina, 3) plan opravy, 4) rizika, 5) overenie. Data:\n'''+json.dumps(c,ensure_ascii=False)[:30000]
      try:
        ans=ollama(prompt)
      except Exception as e:
        ans='MODEL_NOT_READY: '+repr(e)+'\n\nZber dat funguje, ale model sa este stahuje alebo startuje.'
      return c, ans

    def delete_events():
      nss=[n['metadata']['name'] for n in k8s('GET','/api/v1/namespaces').get('items',[])]
      cnt=0
      for ns in nss:
        try:
          evs=k8s('GET','/apis/events.k8s.io/v1/namespaces/%s/events' % ns).get('items',[])
          for e in evs:
            k8s('DELETE','/apis/events.k8s.io/v1/namespaces/%s/events/%s' % (ns, urllib.parse.quote(e['metadata']['name'])))
            cnt+=1
        except Exception:
          pass
      audit('approved_fix delete_events count=%s' % cnt)
      return 'Vymazane events: %s' % cnt

    def restart_deploy(ns,name):
      if not ns or not name:
        return 'Chyba: treba namespace aj deployment.'
      body={'spec':{'template':{'metadata':{'annotations':{'ai-sre-agent/restartedAt':time.strftime('%FT%TZ',time.gmtime())}}}}}
      k8s('PATCH','/apis/apps/v1/namespaces/%s/deployments/%s' % (urllib.parse.quote(ns), urllib.parse.quote(name)), body, 'application/merge-patch+json')
      audit('approved_fix restart_deployment %s/%s' % (ns,name))
      return 'Restartovany deployment: %s/%s' % (ns,name)

    def sync_app(name):
      if not name:
        return 'Chyba: treba nazov ArgoCD app.'
      k8s('PATCH','/apis/argoproj.io/v1alpha1/namespaces/argocd/applications/%s' % urllib.parse.quote(name), {'operation':{'sync':{}}}, 'application/merge-patch+json')
      audit('approved_fix argocd_sync %s' % name)
      return 'Spusteny ArgoCD sync: %s' % name

    PAGE='''<!doctype html><html><head><meta charset="utf-8"><title>AI SRE Agent</title><style>body{font-family:system-ui;margin:2rem;max-width:1200px}textarea,input{width:100%;padding:.6rem;margin:.2rem 0}button{padding:.7rem 1rem;margin:.3rem}.warn{background:#fff3cd;padding:1rem;border-radius:8px}pre{background:#111;color:#ddd;padding:1rem;white-space:pre-wrap;border-radius:8px}</style></head><body><h1>AI SRE Agent</h1><div class="warn">Workflow: logy -> diagnoza -> plan -> schvalenie -> fix -> overenie. Rizikove akcie nie su v MVP povolene.</div><form method="post" action="/diagnose"><p><button>Spustit diagnostiku</button></p></form><h2>Schvalene safe fixy</h2><form method="post" action="/fix"><button name="action" value="delete-events">Vymazat Kubernetes events</button></form><form method="post" action="/fix"><input name="ns" placeholder="namespace"><input name="name" placeholder="deployment"><button name="action" value="restart-deploy">Restart deployment</button></form><form method="post" action="/fix"><input name="name" placeholder="argocd app"><button name="action" value="sync-app">ArgoCD sync</button></form>{body}</body></html>'''

    class H(BaseHTTPRequestHandler):
      def authed(self, data=None):
        if not UI_TOKEN:
          return True
        cookie=self.headers.get('Cookie','')
        if ('sre_agent='+UI_TOKEN) in cookie:
          return True
        if data and data.get('token',[''])[0] == UI_TOKEN:
          return True
        qs=urllib.parse.parse_qs(urllib.parse.urlparse(self.path).query)
        return qs.get('token',[''])[0] == UI_TOKEN
      def login(self, msg=''):
        self.html('<h2>Login</h2><p>'+esc(msg)+'</p><form method="post" action="/login"><input name="token" type="password" placeholder="agent token"><button>Login</button></form>')
      def html(self,body=''):
        b=PAGE.replace('{body}', body).encode()
        self.send_response(200)
        self.send_header('Content-Type','text/html; charset=utf-8')
        self.send_header('Content-Length',str(len(b)))
        self.end_headers()
        self.wfile.write(b)
      def do_HEAD(self):
        self.send_response(200)
        self.end_headers()
      def do_GET(self):
        if not self.authed():
          return self.login()
        self.html('<p>Pripravene. Spusti diagnostiku.</p>')
      def do_POST(self):
        try:
          ln=int(self.headers.get('Content-Length','0'))
          data=urllib.parse.parse_qs(self.rfile.read(ln).decode())
          if self.path=='/login':
            if data.get('token',[''])[0] == UI_TOKEN:
              self.send_response(303)
              self.send_header('Set-Cookie','sre_agent='+UI_TOKEN+'; Path=/; HttpOnly; Secure; SameSite=Lax')
              self.send_header('Location','/')
              self.end_headers()
              return
            return self.login('Zly token')
          if not self.authed(data):
            return self.login()
          if self.path=='/diagnose':
            c,a=diagnose()
            audit('diagnose badPods=%s' % len(c.get('badPods',[])))
            self.html('<h2>Diagnoza a plan</h2><pre>'+esc(a)+'</pre><h2>Surove data</h2><pre>'+esc(json.dumps(c,indent=2,ensure_ascii=False))+'</pre>')
          elif self.path=='/fix':
            act=data.get('action',[''])[0]
            if act=='delete-events':
              res=delete_events()
            elif act=='restart-deploy':
              res=restart_deploy(data.get('ns',[''])[0],data.get('name',[''])[0])
            elif act=='sync-app':
              res=sync_app(data.get('name',[''])[0])
            else:
              res='Nepovolena akcia'
            c,_=diagnose()
            self.html('<h2>Fix</h2><pre>'+esc(res)+'</pre><h2>Overenie</h2><pre>'+esc(json.dumps(c,indent=2,ensure_ascii=False))+'</pre>')
          else:
            self.send_error(404)
        except Exception:
          self.html('<h2>Error</h2><pre>'+esc(traceback.format_exc())+'</pre>')
    ThreadingHTTPServer(('0.0.0.0',8080),H).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-sre-agent
spec:
  replicas: 1
  selector:
    matchLabels: { app: ai-sre-agent }
  template:
    metadata:
      labels: { app: ai-sre-agent }
    spec:
      serviceAccountName: ai-sre-agent
      containers:
        - name: app
          image: python:3.11-slim
          command: ["python", "/app/app.py"]
          env:
            - name: OLLAMA_URL
              value: http://ollama:11434
            - name: MODEL
              value: {{ .Values.model | quote }}
            - name: SRE_AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ai-sre-agent-auth
                  key: token
          ports:
            - containerPort: 8080
          resources:
            requests: { cpu: "200m", memory: "256Mi" }
            limits: { cpu: "1", memory: "1Gi" }
          volumeMounts:
            - name: app
              mountPath: /app
            - name: audit
              mountPath: /audit
      volumes:
        - name: app
          configMap:
            name: ai-sre-agent-app
        - name: audit
          persistentVolumeClaim:
            claimName: ai-sre-agent-audit
---
apiVersion: v1
kind: Service
metadata:
  name: ai-sre-agent
spec:
  selector: { app: ai-sre-agent }
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ai-sre-agent
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [{{ .Values.host | quote }}]
      secretName: ai-sre-agent-tls
  rules:
    - host: {{ .Values.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ai-sre-agent
                port:
                  number: 80
