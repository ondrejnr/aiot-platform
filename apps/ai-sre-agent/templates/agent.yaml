apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-sre-agent-app
  labels: { app: ai-sre-agent }
data:
  app.py: |-
    import os, ssl, json, time, urllib.request, urllib.parse, traceback, html
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    TOKEN=open('/var/run/secrets/kubernetes.io/serviceaccount/token').read().strip()
    CA='/var/run/secrets/kubernetes.io/serviceaccount/ca.crt'
    K8S='https://kubernetes.default.svc'
    OLLAMA=os.environ.get('OLLAMA_URL','http://ollama:11434')
    MODEL=os.environ.get('MODEL','qwen2.5-coder:7b')
    UI_TOKEN=os.environ.get('SRE_AGENT_TOKEN','')
    AUDIT='/audit/audit.log'
    PENDING='/audit/pending.json'
    CTX=ssl.create_default_context(cafile=CA)

    def audit(msg):
      os.makedirs('/audit', exist_ok=True)
      with open(AUDIT,'a',encoding='utf-8') as f:
        f.write(time.strftime('%FT%T%z ') + msg + '\n')

    def k8s(method, path, body=None, ctype='application/json', timeout=25):
      data=None if body is None else json.dumps(body).encode()
      req=urllib.request.Request(K8S+path, data=data, method=method)
      req.add_header('Authorization','Bearer '+TOKEN)
      req.add_header('Accept','application/json')
      if body is not None:
        req.add_header('Content-Type',ctype)
      with urllib.request.urlopen(req, context=CTX, timeout=timeout) as r:
        raw=r.read().decode('utf-8','replace')
        return json.loads(raw) if raw else {}

    def ollama(prompt, num_predict=350):
      body=json.dumps({'model':MODEL,'prompt':prompt,'stream':False,'options':{'temperature':0.1,'num_predict':num_predict}}).encode()
      req=urllib.request.Request(OLLAMA+'/api/generate',data=body,headers={'Content-Type':'application/json'})
      with urllib.request.urlopen(req, timeout=900) as r:
        return json.loads(r.read().decode()).get('response','')

    def collect(include_logs=True):
      pods=k8s('GET','/api/v1/pods?limit=1000').get('items',[])
      nodes=k8s('GET','/api/v1/nodes').get('items',[])
      apps=k8s('GET','/apis/argoproj.io/v1alpha1/namespaces/argocd/applications').get('items',[])
      bad=[]
      for p in pods:
        phase=p.get('status',{}).get('phase')
        waiting=[]
        for cs in p.get('status',{}).get('containerStatuses',[]) or []:
          st=cs.get('state',{})
          if st.get('waiting'):
            waiting.append(cs.get('name','?')+':'+st['waiting'].get('reason','waiting'))
        if phase not in ('Running','Succeeded') or waiting:
          bad.append({'ns':p['metadata']['namespace'],'pod':p['metadata']['name'],'phase':phase,'node':p.get('spec',{}).get('nodeName',''),'waiting':waiting})
      logs=[]
      if include_logs:
        for b in bad[:8]:
          try:
            path='/api/v1/namespaces/%s/pods/%s/log?tailLines=80&allContainers=true' % (urllib.parse.quote(b['ns']), urllib.parse.quote(b['pod']))
            req=urllib.request.Request(K8S+path,headers={'Authorization':'Bearer '+TOKEN})
            with urllib.request.urlopen(req, context=CTX, timeout=12) as r:
              txt=r.read().decode('utf-8','replace')[-4500:]
            logs.append('### %s/%s\n%s' % (b['ns'],b['pod'],txt))
          except Exception as e:
            logs.append('### %s/%s\nLOG_ERROR %s' % (b['ns'],b['pod'],e))
      return {
        'nodesReady': sum(1 for n in nodes for c in n.get('status',{}).get('conditions',[]) if c.get('type')=='Ready' and c.get('status')=='True'),
        'nodesTotal': len(nodes),
        'badPods': bad[:30],
        'badPodsCount': len(bad),
        'argocdProblemApps':[{'name':a['metadata']['name'],'sync':a.get('status',{}).get('sync',{}).get('status'),'health':a.get('status',{}).get('health',{}).get('status')} for a in apps if a.get('status',{}).get('sync',{}).get('status')!='Synced' or a.get('status',{}).get('health',{}).get('status') not in ('Healthy',None)],
        'logs':'\n\n'.join(logs)
      }

    def collect_target(target):
      ns = target if target else ''
      out = {'target': target, 'namespace': ns, 'pods': [], 'logs': '', 'ingresses': [], 'services': [], 'argocd': []}
      try:
        pods = k8s('GET','/api/v1/namespaces/%s/pods?limit=200' % urllib.parse.quote(ns)).get('items',[])
        for p in pods:
          waiting=[]
          for cs in p.get('status',{}).get('containerStatuses',[]) or []:
            st=cs.get('state',{})
            if st.get('waiting'):
              waiting.append(cs.get('name','?')+':'+st['waiting'].get('reason','waiting'))
          out['pods'].append({'name':p['metadata']['name'],'phase':p.get('status',{}).get('phase'),'ready':p.get('status',{}).get('containerStatuses',[]),'waiting':waiting})
        logs=[]
        for p in pods[:4]:
          try:
            path='/api/v1/namespaces/%s/pods/%s/log?tailLines=80&allContainers=true' % (urllib.parse.quote(ns), urllib.parse.quote(p['metadata']['name']))
            req=urllib.request.Request(K8S+path,headers={'Authorization':'Bearer '+TOKEN})
            with urllib.request.urlopen(req, context=CTX, timeout=12) as r:
              logs.append('### '+p['metadata']['name']+'\n'+r.read().decode('utf-8','replace')[-3500:])
          except Exception as e:
            logs.append('### '+p['metadata']['name']+'\nLOG_ERROR '+repr(e))
        out['logs']='\n\n'.join(logs)
      except Exception as e:
        out['pods_error']=repr(e)
      try:
        out['ingresses']=k8s('GET','/apis/networking.k8s.io/v1/namespaces/%s/ingresses' % urllib.parse.quote(ns)).get('items',[])
      except Exception as e:
        out['ingress_error']=repr(e)
      try:
        out['services']=k8s('GET','/api/v1/namespaces/%s/services' % urllib.parse.quote(ns)).get('items',[])
      except Exception as e:
        out['services_error']=repr(e)
      try:
        apps=k8s('GET','/apis/argoproj.io/v1alpha1/namespaces/argocd/applications').get('items',[])
        out['argocd']=[{'name':a['metadata']['name'],'sync':a.get('status',{}).get('sync',{}).get('status'),'health':a.get('status',{}).get('health',{}).get('status'),'message':a.get('status',{}).get('conditions',[{}])[0].get('message','') if a.get('status',{}).get('conditions') else ''} for a in apps if target in a['metadata']['name'] or a.get('spec',{}).get('destination',{}).get('namespace')==ns]
      except Exception as e:
        out['argocd_error']=repr(e)
      return out

    def load_pending():
      try:
        return json.load(open(PENDING, encoding='utf-8'))
      except Exception:
        return None

    def save_pending(p):
      os.makedirs('/audit', exist_ok=True)
      with open(PENDING, 'w', encoding='utf-8') as f:
        json.dump(p, f, ensure_ascii=False, indent=2)

    def clear_pending():
      try:
        os.remove(PENDING)
      except Exception:
        pass

    def delete_events():
      nss=[n['metadata']['name'] for n in k8s('GET','/api/v1/namespaces').get('items',[])]
      cnt=0
      for ns in nss:
        try:
          evs=k8s('GET','/apis/events.k8s.io/v1/namespaces/%s/events' % ns).get('items',[])
          for e in evs:
            k8s('DELETE','/apis/events.k8s.io/v1/namespaces/%s/events/%s' % (ns, urllib.parse.quote(e['metadata']['name'])))
            cnt+=1
        except Exception:
          pass
      audit('approved_fix delete_events count=%s' % cnt)
      return 'Vymazané Kubernetes events: %s' % cnt

    def restart_deploy(ns,name):
      body={'spec':{'template':{'metadata':{'annotations':{'ai-sre-agent/restartedAt':time.strftime('%FT%TZ',time.gmtime())}}}}}
      k8s('PATCH','/apis/apps/v1/namespaces/%s/deployments/%s' % (urllib.parse.quote(ns), urllib.parse.quote(name)), body, 'application/merge-patch+json')
      audit('approved_fix restart_deployment %s/%s' % (ns,name))
      return 'Reštartovaný deployment: %s/%s' % (ns,name)

    def sync_app(name):
      k8s('PATCH','/apis/argoproj.io/v1alpha1/namespaces/argocd/applications/%s' % urllib.parse.quote(name), {'operation':{'sync':{}}}, 'application/merge-patch+json')
      audit('approved_fix argocd_sync %s' % name)
      return 'Spustený ArgoCD sync: %s' % name

    def infer_target(msg):
      low=msg.lower()
      mapping={'grafana':'grafana','grafanu':'grafana','grafane':'grafana','prometheus':'monitoring','prometheusu':'monitoring','headlamp':'headlamp','headlampu':'headlamp','argocd':'argocd','argo':'argocd','jenkins':'jenkins','jenkinsu':'jenkins','gitea':'gitea','giteu':'gitea','zabbix':'zabbix','zabbixu':'zabbix','chef':'chef','chefa':'chef'}
      for k,v in mapping.items():
        if k in low:
          return k,v
      return '', ''

    def propose_action(target, ns, data):
      app = data.get('argocd',[{}])[0] if data.get('argocd') else {}
      bad_pods=[p for p in data.get('pods',[]) if p.get('phase') not in ('Running','Succeeded') or p.get('waiting')]
      if app.get('sync') and app.get('sync') != 'Synced':
        return {'kind':'argocd_sync','name':app.get('name')}
      if bad_pods:
        # restart the first deployment-like app by target name; safe but still requires approval
        return {'kind':'restart_deploy','namespace':ns,'name':target}
      return {'kind':'none'}

    def render_plan(target, ns, data, proposed, user_msg):
      prompt=('Si lokálny Kubernetes SRE agent. Používateľ chce opravu služby. Najprv NESMIEŠ nič meniť. '
          'Odpovedz po slovensky v presnom formáte:\n'
          'Diagnóza:\n- ...\n'
          'Návrh:\n- ...\n'
          'Riziko:\n- ...\n'
          'Čakám na schválenie:\n- ak súhlasíš, napíš: schvaľujem\n\n'
          'Buď stručný. Dáta služby a logy:\n'
          + json.dumps(data,ensure_ascii=False)[:12000]
          + '\nNavrhnutá bezpečná akcia po schválení: '
          + json.dumps(proposed,ensure_ascii=False))
      try:
        ans=ollama(prompt, num_predict=320)
      except Exception as e:
        ans='Diagnóza:\n- Model nestihol odpovedať: %r\n- Stav služby som ale načítal.\n\nNávrh:\n- Navrhnutá akcia po schválení: %s\n\nRiziko:\n- Akcia sa vykoná až po tvojom schválení.\n\nČakám na schválenie:\n- Ak súhlasíš, napíš: schvaľujem' % (e, proposed)
      save_pending({'createdAt':time.time(),'userMessage':user_msg,'target':target,'namespace':ns,'action':proposed,'summary':ans})
      return ans

    def execute_pending():
      p=load_pending()
      if not p:
        return 'Nemám čakajúci návrh na vykonanie. Najprv napíš napríklad: oprav grafanu.'
      a=p.get('action',{})
      if a.get('kind')=='argocd_sync':
        res=sync_app(a.get('name',''))
      elif a.get('kind')=='restart_deploy':
        res=restart_deploy(a.get('namespace',''), a.get('name',''))
      elif a.get('kind')=='none':
        res='Nebola navrhnutá žiadna bezpečná automatická zmena. Treba ďalšiu diagnózu alebo manuálny fix.'
      else:
        res='Neznámy typ čakajúcej akcie: '+json.dumps(a,ensure_ascii=False)
      clear_pending()
      c=collect(include_logs=False)
      return res+'\n\nOverenie:\n- nodes: %s/%s ready\n- problem pods: %s\n- ArgoCD problem apps: %s' % (c['nodesReady'],c['nodesTotal'],c['badPodsCount'],len(c['argocdProblemApps']))

    def answer_user(msg):
      low=msg.lower().strip()
      if low in ('schvaľujem','schvalujem','schval aktualny navrh','potvrdzujem','suhlasim','súhlasím'):
        return execute_pending()
      if low in ('zrus','zruš','zamietam','neschvalujem'):
        clear_pending(); return 'Čakajúci návrh je zrušený. Nič som nezmenil.'
      if any(w in low for w in ['oprav','fixni','vyries','vyrieš']):
        target,ns=infer_target(msg)
        if target and ns:
          data=collect_target(ns)
          action=propose_action(target,ns,data)
          return render_plan(target,ns,data,action,msg)
        return 'Rozumiem, ale neviem, ktorú službu mám opraviť. Napíš napríklad: oprav grafanu, oprav headlamp, oprav jenkins.'
      if 'potvrd' in low and 'event' in low:
        res=delete_events(); return res+'\n\nOverenie: spusti otázku "skontroluj stav".'
      if low.startswith('potvrd restart deployment '):
        target=low.replace('potvrd restart deployment ','').strip()
        if '/' not in target: return 'Formát: potvrď restart deployment namespace/name'
        ns,name=target.split('/',1); return restart_deploy(ns,name)
      if low.startswith('potvrd argocd sync '):
        return sync_app(low.replace('potvrd argocd sync ','').strip())
      c=collect(include_logs=True)
      if 'vymaz' in low and 'event' in low:
        return 'Toto je povolený safe-fix, ale vyžaduje potvrdenie. Napíš presne: potvrď vymazať events'
      prompt='''Si lokálny Kubernetes SRE agent v klastri používateľa. Odpovedaj stručne po slovensky. Máš právomoci: čítať pody/logy/eventy/nody/ingressy/ArgoCD, po explicitnom potvrdení vieš vymazať events, reštartovať deployment a spustiť ArgoCD sync. Workflow: logy -> diagnóza -> plán -> schválenie -> fix -> overenie. Nikdy nenavrhuj rizikový fix bez potvrdenia. Otázka používateľa:\n'''+msg+'\n\nAktuálny stav a logy:\n'+json.dumps(c,ensure_ascii=False)[:12000]
      try:
        return ollama(prompt)
      except Exception as e:
        return 'Model ešte nie je pripravený alebo odpoveď trvá príliš dlho: %r\n\nRýchly stav: nodes %s/%s ready, badPods=%s, problemApps=%s' % (e,c['nodesReady'],c['nodesTotal'],c['badPodsCount'],len(c['argocdProblemApps']))

    PAGE='''<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI SRE Agent</title><style>
    :root{color-scheme:dark}body{margin:0;font-family:Inter,Segoe UI,system-ui;background:#0b1020;color:#e7eaf3}.top{height:52px;display:flex;align-items:center;gap:14px;padding:0 18px;background:#121a31;border-bottom:1px solid #26304d;position:sticky;top:0}.dot{width:10px;height:10px;border-radius:50%;background:#22c55e}.brand{font-weight:700}.status{font-size:13px;color:#aab3cf}.wrap{max-width:980px;margin:0 auto;padding:22px}.chat{display:flex;flex-direction:column;gap:14px;min-height:calc(100vh - 190px)}.msg{padding:14px 16px;border-radius:14px;line-height:1.45;white-space:pre-wrap}.user{align-self:flex-end;background:#2563eb;color:white;max-width:78%}.bot{align-self:flex-start;background:#151f38;border:1px solid #2b385c;max-width:86%}.composer{position:sticky;bottom:0;background:linear-gradient(transparent,#0b1020 20%);padding:18px 0}.box{display:flex;gap:10px}.box textarea{flex:1;min-height:54px;max-height:160px;resize:vertical;border-radius:14px;border:1px solid #34415f;background:#11182b;color:#e7eaf3;padding:13px}.box button,.login button{border:0;border-radius:12px;background:#22c55e;color:#07120b;font-weight:700;padding:0 18px}.hint{font-size:12px;color:#8f9ab8;margin-top:8px}.login{max-width:420px;margin:90px auto;background:#151f38;border:1px solid #2b385c;padding:24px;border-radius:18px}.login input{width:100%;box-sizing:border-box;border-radius:12px;border:1px solid #34415f;background:#0b1020;color:#e7eaf3;padding:13px;margin:12px 0}.spinner{color:#aab3cf}
    </style></head><body>{body}</body></html>'''
    APP='''<div class="top"><span class="dot"></span><span class="brand">AI SRE Agent</span><span id="status" class="status">načítavam stav…</span></div><div class="wrap"><div id="chat" class="chat"><div class="msg bot">Som lokálny SRE agent. Napíš problém normálne ako sem. Budem robiť: logy → diagnóza → plán → schválenie → fix → overenie.</div></div><div class="composer"><div class="box"><textarea id="input" placeholder="Napr. Skontroluj prečo Grafana nejde…"></textarea><button onclick="send()">Odoslať</button></div><div class="hint">Safe potvrdenia: „potvrď vymazať events“, „potvrď restart deployment namespace/name“, „potvrď argocd sync app“.</div></div></div><script>
    async function status(){try{let r=await fetch('/api/status');let j=await r.json();document.getElementById('status').textContent=`model ${j.model} · nodes ${j.nodesReady}/${j.nodesTotal} · bad pods ${j.badPodsCount} · Argo problémy ${j.problemApps}`}catch(e){document.getElementById('status').textContent='status nedostupný'}}
    function add(cls,txt){let d=document.createElement('div');d.className='msg '+cls;d.textContent=txt;document.getElementById('chat').appendChild(d);d.scrollIntoView({behavior:'smooth',block:'end'});return d}
    async function send(){let el=document.getElementById('input');let text=el.value.trim();if(!text)return;el.value='';add('user',text);let wait=add('bot spinner','pracujem… na CPU to môže trvať aj niekoľko minút');try{let r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text})});let j=await r.json();wait.className='msg bot';wait.textContent=j.answer||JSON.stringify(j)}catch(e){wait.className='msg bot';wait.textContent='Chyba alebo timeout: '+e}status()}
    document.getElementById('input').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.ctrlKey)send()});status();setInterval(status,30000);
    </script>'''

    class H(BaseHTTPRequestHandler):
      def authed(self, data=None):
        if not UI_TOKEN: return True
        cookie=self.headers.get('Cookie','')
        if ('sre_agent='+UI_TOKEN) in cookie: return True
        if data and data.get('token',[''])[0] == UI_TOKEN: return True
        qs=urllib.parse.parse_qs(urllib.parse.urlparse(self.path).query)
        return qs.get('token',[''])[0] == UI_TOKEN
      def send_html(self,body,code=200):
        b=PAGE.replace('{body}',body).encode()
        self.send_response(code); self.send_header('Content-Type','text/html; charset=utf-8'); self.send_header('Content-Length',str(len(b))); self.end_headers(); self.wfile.write(b)
      def send_json(self,obj,code=200):
        b=json.dumps(obj,ensure_ascii=False).encode()
        self.send_response(code); self.send_header('Content-Type','application/json; charset=utf-8'); self.send_header('Content-Length',str(len(b))); self.end_headers(); self.wfile.write(b)
      def login(self,msg=''):
        self.send_html('<div class="login"><h1>AI SRE Agent</h1><p>'+html.escape(msg or 'Zadaj agent token.')+'</p><form method="post" action="/login"><input name="token" type="password" autofocus placeholder="agent token"><button>Prihlásiť</button></form></div>')
      def do_HEAD(self): self.send_response(200); self.end_headers()
      def do_GET(self):
        if self.path.startswith('/api/status'):
          if not self.authed(): return self.send_json({'error':'unauthorized'},401)
          c=collect(include_logs=False); return self.send_json({'model':MODEL,'nodesReady':c['nodesReady'],'nodesTotal':c['nodesTotal'],'badPodsCount':c['badPodsCount'],'problemApps':len(c['argocdProblemApps'])})
        if not self.authed(): return self.login()
        self.send_html(APP)
      def do_POST(self):
        try:
          ln=int(self.headers.get('Content-Length','0')); raw=self.rfile.read(ln).decode()
          if self.path=='/login':
            data=urllib.parse.parse_qs(raw)
            if data.get('token',[''])[0] == UI_TOKEN:
              self.send_response(303); self.send_header('Set-Cookie','sre_agent='+UI_TOKEN+'; Path=/; HttpOnly; Secure; SameSite=Lax'); self.send_header('Location','/'); self.end_headers(); return
            return self.login('Zlý token')
          if not self.authed(): return self.send_json({'error':'unauthorized'},401)
          if self.path=='/api/chat':
            msg=json.loads(raw or '{}').get('message','')[:4000]
            audit('chat '+msg.replace('\n',' ')[:300])
            return self.send_json({'answer':answer_user(msg)})
          self.send_error(404)
        except Exception:
          self.send_json({'answer':'ERROR\n'+traceback.format_exc()},500)
    ThreadingHTTPServer(('0.0.0.0',8080),H).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-sre-agent
spec:
  replicas: 1
  selector:
    matchLabels: { app: ai-sre-agent }
  template:
    metadata:
      labels: { app: ai-sre-agent }
      annotations:
        ai-sre-agent/config-version: "2026-05-06-agent-approval-2"
    spec:
      serviceAccountName: ai-sre-agent
      containers:
        - name: app
          image: python:3.11-slim
          command: ["python", "/app/app.py"]
          env:
            - name: OLLAMA_URL
              value: http://ollama:11434
            - name: MODEL
              value: {{ .Values.model | quote }}
            - name: SRE_AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ai-sre-agent-auth
                  key: token
          ports:
            - containerPort: 8080
          resources:
            requests: { cpu: "200m", memory: "256Mi" }
            limits: { cpu: "1", memory: "1Gi" }
          volumeMounts:
            - name: app
              mountPath: /app
            - name: audit
              mountPath: /audit
      volumes:
        - name: app
          configMap:
            name: ai-sre-agent-app
        - name: audit
          persistentVolumeClaim:
            claimName: ai-sre-agent-audit
---
apiVersion: v1
kind: Service
metadata:
  name: ai-sre-agent
spec:
  selector: { app: ai-sre-agent }
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ai-sre-agent
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "900"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "900"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "900"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [{{ .Values.host | quote }}]
      secretName: ai-sre-agent-tls
  rules:
    - host: {{ .Values.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ai-sre-agent
                port:
                  number: 80
