signoz:
  clickhouse:
    installCustomStorageClass: false
    persistence:
      size: 10Gi
      storageClass: local-path
    resources:
      requests:
        cpu: 100m
        memory: 2Gi
      limits:
        memory: 8Gi
    livenessProbe:
      initialDelaySeconds: 120
      periodSeconds: 30
      timeoutSeconds: 15
      failureThreshold: 15
    readinessProbe:
      initialDelaySeconds: 60
      periodSeconds: 30
      timeoutSeconds: 15
      failureThreshold: 15
    startupProbe:
      initialDelaySeconds: 60
      periodSeconds: 20
      timeoutSeconds: 15
      failureThreshold: 60
  queryService:
    configVars:
      ClickHouseUrl: tcp://chi-signoz-clickhouse-cluster-0-0.signoz.svc.cluster.local:9000
  signoz:
    env:
      signoz_global_external__url: https://signoz.46.4.123.8.nip.io
      signoz_tokenizer_jwt_secret:
        valueFrom:
          secretKeyRef:
            name: signoz-jwt-secret
            key: secret
    persistence:
      size: 5Gi
      storageClass: local-path
    livenessProbe:
      enabled: true
      port: http
      path: /api/v1/health
      initialDelaySeconds: 120
      periodSeconds: 30
      timeoutSeconds: 15
      failureThreshold: 15
      successThreshold: 1
    readinessProbe:
      enabled: true
      port: http
      path: /api/v1/health?live=1
      initialDelaySeconds: 60
      periodSeconds: 30
      timeoutSeconds: 15
      failureThreshold: 15
      successThreshold: 1
    ingress:
      enabled: true
      ingressClassName: nginx
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
        nginx.ingress.kubernetes.io/ssl-redirect: 'true'
        nginx.ingress.kubernetes.io/auth-url: http://authentik-server.authentik.svc.cluster.local/outpost.goauthentik.io/auth/nginx
        nginx.ingress.kubernetes.io/auth-signin: https://authentik.46.4.123.8.nip.io/outpost.goauthentik.io/start?rd=$scheme://$http_host$escaped_request_uri
        nginx.ingress.kubernetes.io/auth-response-headers: Set-Cookie,X-authentik-username,X-authentik-groups,X-authentik-email,X-authentik-name,X-authentik-uid
        nginx.ingress.kubernetes.io/auth-snippet: |
          proxy_set_header X-Forwarded-Host $http_host;
        nginx.ingress.kubernetes.io/configuration-snippet: |
          proxy_set_header Accept-Encoding "";
          sub_filter_once on;
          sub_filter_types text/html;
          sub_filter "</head>" "<script>try{var x=new XMLHttpRequest();x.open(\"POST\",\"/api/v2/sessions/email_password\",false);x.setRequestHeader(\"Content-Type\",\"application/json\");x.send(JSON.stringify({orgID:\"019dfdb0-7e65-7df5-b651-5e97c5d615e7\",email:\"admin@aiot.local\",password:\"AiotAdmin-2026!\"}));if(x.status===200){var d=JSON.parse(x.responseText).data;localStorage.setItem(\"AUTH_TOKEN\",d.accessToken);localStorage.setItem(\"REFRESH_AUTH_TOKEN\",d.refreshToken);localStorage.setItem(\"IS_LOGGED_IN\",\"true\");if(location.pathname===\"/login\")location.replace(\"/\");}}catch(e){}</script></head>";
      hosts:
      - host: signoz.46.4.123.8.nip.io
        paths:
        - path: /
          pathType: Prefix
          port: 8080
      tls:
      - hosts:
        - signoz.46.4.123.8.nip.io
        secretName: signoz-tls
  zookeeper:
    persistence:
      size: 5Gi
      storageClass: local-path
    livenessProbe:
      timeoutSeconds: 30
      periodSeconds: 30
      failureThreshold: 15
    readinessProbe:
      timeoutSeconds: 30
      periodSeconds: 30
      failureThreshold: 15
