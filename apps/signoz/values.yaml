signoz:
  clickhouse:
    installCustomStorageClass: false
    persistence:
      size: 10Gi
      storageClass: local-path
    resources:
      requests:
        cpu: 100m
        memory: 2Gi
      limits:
        memory: 8Gi
    livenessProbe:
      initialDelaySeconds: 120
      periodSeconds: 30
      timeoutSeconds: 15
      failureThreshold: 15
    readinessProbe:
      initialDelaySeconds: 60
      periodSeconds: 30
      timeoutSeconds: 15
      failureThreshold: 15
    startupProbe:
      initialDelaySeconds: 60
      periodSeconds: 20
      timeoutSeconds: 15
      failureThreshold: 60
  queryService:
    configVars:
      ClickHouseUrl: tcp://chi-signoz-clickhouse-cluster-0-0.signoz.svc.cluster.local:9000
  signoz:
    env:
      signoz_global_external__url: https://signoz.46.4.123.8.nip.io
      signoz_tokenizer_jwt_secret:
        valueFrom:
          secretKeyRef:
            name: signoz-jwt-secret
            key: secret
    persistence:
      size: 5Gi
      storageClass: local-path
    livenessProbe:
      enabled: true
      port: http
      path: /api/v1/health
      initialDelaySeconds: 120
      periodSeconds: 30
      timeoutSeconds: 15
      failureThreshold: 15
      successThreshold: 1
    readinessProbe:
      enabled: true
      port: http
      path: /api/v1/health?live=1
      initialDelaySeconds: 60
      periodSeconds: 30
      timeoutSeconds: 15
      failureThreshold: 15
      successThreshold: 1
    ingress:
      enabled: true
      ingressClassName: nginx
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
        nginx.ingress.kubernetes.io/ssl-redirect: 'true'
      hosts:
      - host: signoz.46.4.123.8.nip.io
        paths:
        - path: /
          pathType: Prefix
          port: 8080
      tls:
      - hosts:
        - signoz.46.4.123.8.nip.io
        secretName: signoz-tls
  zookeeper:
    persistence:
      size: 5Gi
      storageClass: local-path
    livenessProbe:
      timeoutSeconds: 30
      periodSeconds: 30
      failureThreshold: 15
    readinessProbe:
      timeoutSeconds: 30
      periodSeconds: 30
      failureThreshold: 15
