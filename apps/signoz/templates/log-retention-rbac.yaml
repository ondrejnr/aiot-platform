apiVersion: v1
kind: ServiceAccount
metadata:
  name: signoz-log-retention
  namespace: signoz
  labels:
    app.kubernetes.io/name: signoz-log-retention
    app.kubernetes.io/part-of: signoz
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: signoz-log-retention
  namespace: signoz
  labels:
    app.kubernetes.io/name: signoz-log-retention
    app.kubernetes.io/part-of: signoz
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "11"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: signoz-log-retention
  namespace: signoz
  labels:
    app.kubernetes.io/name: signoz-log-retention
    app.kubernetes.io/part-of: signoz
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "12"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: signoz-log-retention
subjects:
  - kind: ServiceAccount
    name: signoz-log-retention
    namespace: signoz
