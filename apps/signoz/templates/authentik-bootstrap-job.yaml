apiVersion: batch/v1
kind: Job
metadata:
  name: signoz-authentik-bootstrap
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: signoz
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "30"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: signoz-authentik-bootstrap
    spec:
      serviceAccountName: signoz-authentik-bootstrap
      restartPolicy: OnFailure
      containers:
      - name: bootstrap
        image: bitnamilegacy/kubectl:1.33.4
        imagePullPolicy: IfNotPresent
        command: ["/bin/sh", "/bootstrap/bootstrap.sh"]
        env:
        - name: OIDC_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: signoz-oidc-client
              key: clientSecret
        volumeMounts:
        - name: script
          mountPath: /bootstrap
      volumes:
      - name: script
        configMap:
          name: signoz-authentik-bootstrap
          defaultMode: 0755
