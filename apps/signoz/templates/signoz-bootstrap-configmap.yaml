apiVersion: v1
kind: ConfigMap
metadata:
  name: signoz-sso-dashboard-bootstrap
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: signoz
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  bootstrap.py: |-
    import json
    import os
    import sys
    import time
    import urllib.error
    import urllib.request

    BASE_URL = os.environ.get("SIGNOZ_BASE_URL", "http://signoz:8080").rstrip("/")
    ADMIN_EMAIL = os.environ["SIGNOZ_ADMIN_EMAIL"]
    ADMIN_PASSWORD = os.environ["SIGNOZ_ADMIN_PASSWORD"]
    ORG_ID = os.environ["SIGNOZ_ORG_ID"]
    CLIENT_SECRET = os.environ["OIDC_CLIENT_SECRET"]
    DASHBOARD_PATH = "/bootstrap/dashboard/aiot-everything.json"

    DOMAIN_NAME = "46.4.123.8.nip.io"
    ISSUER = "https://authentik.46.4.123.8.nip.io/application/o/signoz/"

    def request(method, path, body=None, token=None, retries=1):
        data = None if body is None else json.dumps(body).encode()
        headers = {"content-type": "application/json"}
        if token:
            headers["authorization"] = f"Bearer {token}"
        req = urllib.request.Request(BASE_URL + path, data=data, headers=headers, method=method)
        last = None
        for attempt in range(retries):
            try:
                with urllib.request.urlopen(req, timeout=30) as resp:
                    raw = resp.read().decode()
                    return json.loads(raw) if raw else {}
            except urllib.error.HTTPError as exc:
                last = exc
                raw = exc.read().decode(errors="replace")
                if attempt + 1 >= retries:
                    raise RuntimeError(f"{method} {path} failed: HTTP {exc.code}: {raw}") from exc
            except Exception as exc:
                last = exc
                if attempt + 1 >= retries:
                    raise
            time.sleep(5)
        raise last

    def login():
        payload = {"email": ADMIN_EMAIL, "password": ADMIN_PASSWORD, "orgId": ORG_ID}
        data = request("POST", "/api/v2/sessions/email_password", payload, retries=12)
        token = data.get("data", {}).get("accessToken")
        if not token:
            raise RuntimeError(f"SigNoz login did not return accessToken: {data}")
        return token

    def ensure_auth_domain(token):
        config = {
            "ssoEnabled": True,
            "ssoType": "oidc",
            "oidcConfig": {
                "issuer": ISSUER,
                "issuerAlias": "",
                "clientId": "signoz",
                "clientSecret": CLIENT_SECRET,
                "getUserInfo": True,
                "insecureSkipEmailVerified": True,
                "claimMapping": {
                    "email": "email",
                    "name": "name",
                    "groups": "groups",
                    "role": "role",
                },
            },
            "roleMapping": {
                "defaultRole": "VIEWER",
                "groupMappings": {"authentik Admins": "ADMIN"},
                "useRoleAttribute": False,
            },
        }
        payload = {"name": DOMAIN_NAME, "config": config}
        domains = request("GET", "/api/v1/domains", token=token).get("data") or []
        existing = next((d for d in domains if d.get("name") == DOMAIN_NAME), None)
        if existing:
            request("PUT", f"/api/v1/domains/{existing['id']}", payload, token=token)
            print(f"updated auth domain {DOMAIN_NAME}: {existing['id']}")
            return existing["id"]
        created = request("POST", "/api/v1/domains", payload, token=token)
        domain_id = created.get("data", {}).get("id")
        print(f"created auth domain {DOMAIN_NAME}: {domain_id}")
        return domain_id

    def ensure_dashboard(token):
        dashboard = json.load(open(DASHBOARD_PATH, encoding="utf-8"))
        dashboard["title"] = "AIOT — Everything"
        dashboard.setdefault("variables", {})
        dashboards = request("GET", "/api/v1/dashboards", token=token).get("data") or []
        existing = next((d for d in dashboards if (d.get("data") or {}).get("title") == dashboard["title"]), None)
        if existing:
            request("PUT", f"/api/v1/dashboards/{existing['id']}", dashboard, token=token)
            print(f"updated dashboard {dashboard['title']}: {existing['id']}")
            return existing["id"]
        created = request("POST", "/api/v1/dashboards", {**dashboard, "uploadedGrafana": False}, token=token)
        dashboard_id = created.get("data", {}).get("id")
        print(f"created dashboard {dashboard['title']}: {dashboard_id}")
        return dashboard_id

    def main():
        token = login()
        domain_id = ensure_auth_domain(token)
        dashboard_id = ensure_dashboard(token)
        print(json.dumps({"domainId": domain_id, "dashboardId": dashboard_id}))

    if __name__ == "__main__":
        main()
