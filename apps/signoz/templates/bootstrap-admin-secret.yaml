{{- $existing := lookup "v1" "Secret" .Release.Namespace "signoz-bootstrap-admin" -}}
apiVersion: v1
kind: Secret
metadata:
  name: signoz-bootstrap-admin
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: signoz
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
data:
  email: {{- if and $existing (index $existing.data "email") }} {{ index $existing.data "email" }}{{- else }} {{ "admin@aiot.local" | b64enc }}{{- end }}
  password: {{- if and $existing (index $existing.data "password") }} {{ index $existing.data "password" }}{{- else }} {{ "AiotAdmin-2026!" | b64enc }}{{- end }}
  orgId: {{- if and $existing (index $existing.data "orgId") }} {{ index $existing.data "orgId" }}{{- else }} {{ "019dfdb0-7e65-7df5-b651-5e97c5d615e7" | b64enc }}{{- end }}
