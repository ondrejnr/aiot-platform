apiVersion: v1
kind: ServiceAccount
metadata:
  name: zabbix-authentik-saml-bootstrap
  namespace: zabbix
  labels:
    app.kubernetes.io/name: zabbix
    app.kubernetes.io/component: authentik-saml-bootstrap
    app.kubernetes.io/part-of: zabbix
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: zabbix-authentik-saml-bootstrap-exec
  namespace: authentik
  labels:
    app.kubernetes.io/name: zabbix
    app.kubernetes.io/component: authentik-saml-bootstrap
    app.kubernetes.io/part-of: zabbix
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/exec"]
    verbs: ["get", "list", "create"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: zabbix-authentik-saml-bootstrap-exec
  namespace: authentik
  labels:
    app.kubernetes.io/name: zabbix
    app.kubernetes.io/component: authentik-saml-bootstrap
    app.kubernetes.io/part-of: zabbix
subjects:
  - kind: ServiceAccount
    name: zabbix-authentik-saml-bootstrap
    namespace: zabbix
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: zabbix-authentik-saml-bootstrap-exec
