apiVersion: v1
kind: ConfigMap
metadata:
  name: zabbix-dashboard-bootstrap
  namespace: zabbix
  labels:
    app.kubernetes.io/name: zabbix
    app.kubernetes.io/component: dashboard-bootstrap
    app.kubernetes.io/part-of: zabbix
data:
  zabbix-dashboard-bootstrap.py: |
    import json
    import urllib.request
    
    ZABBIX_API = "http://zabbix-zabbix-web.zabbix.svc.cluster.local/api_jsonrpc.php"
    ADMIN_USER = "Admin"
    ADMIN_PASSWORD = "zabbix"
    NODES = [
        ("k3d-aiot-hetzner-server-0", "Node k3d-aiot-hetzner-server-0", "172.18.0.2"),
        ("k3d-aiot-hetzner-agent-0", "Node k3d-aiot-hetzner-agent-0", "172.18.0.4"),
        ("k3d-aiot-hetzner-agent-1", "Node k3d-aiot-hetzner-agent-1", "172.18.0.6"),
        ("k3d-aiot-hetzner-agent-2", "Node k3d-aiot-hetzner-agent-2", "172.18.0.3"),
        ("k3d-aiot-hetzner-agent-3", "Node k3d-aiot-hetzner-agent-3", "172.18.0.5"),
    ]
    
    def api(method, params=None, token=None):
        payload = {"jsonrpc": "2.0", "method": method, "params": params or {}, "id": 1}
        if token:
            payload["auth"] = token
        req = urllib.request.Request(
            ZABBIX_API,
            data=json.dumps(payload).encode(),
            headers={"Content-Type": "application/json-rpc"},
        )
        data = json.loads(urllib.request.urlopen(req, timeout=30).read())
        if "error" in data:
            raise RuntimeError(f"{method}: {data[ error]}")
        return data.get("result")
    
    def first(method, params, token, what):
        result = api(method, params, token)
        if not result:
            raise RuntimeError(f"Missing {what}")
        return result[0]
    
    def field(ftype, name, value):
        return {"type": str(ftype), "name": name, "value": str(value)}
    
    def itemid(token, hostid, names):
        if isinstance(names, str):
            names = [names]
        for name in names:
            result = api("item.get", {"hostids": hostid, "filter": {"name": [name]}, "output": ["itemid", "name"]}, token)
            if result:
                return result[0]["itemid"]
        return None
    
    def configure_hosts(token):
        linux_group = first("hostgroup.get", {"filter": {"name": ["Linux servers"]}, "output": ["groupid", "name"]}, token, "Linux servers group")
        linux_prom = first("template.get", {"filter": {"host": ["Linux by Prom"]}, "output": ["templateid", "host", "name"]}, token, "Linux by Prom template")
        hostids = []
        for host, name, ip in NODES:
            macros = [
                {"macro": "{$NODE_EXPORTER_HOST}", "value": ip},
                {"macro": "{$VFS.DEV.READ.AWAIT.WARN}", "value": "500"},
                {"macro": "{$VFS.DEV.WRITE.AWAIT.WARN}", "value": "500"},
                {"macro": "{$LOAD_AVG_PER_CPU.MAX.WARN}", "value": "5"},
            ]
            interface = {"type": 1, "main": 1, "useip": 1, "ip": ip, "dns": "", "port": "10050"}
            existing = api("host.get", {"filter": {"host": [host]}, "output": ["hostid"]}, token)
            params = {"name": name, "status": 0, "groups": [{"groupid": linux_group["groupid"]}], "templates": [{"templateid": linux_prom["templateid"]}], "interfaces": [interface], "macros": macros}
            if existing:
                hostid = existing[0]["hostid"]
                params["hostid"] = hostid
                api("host.update", params, token)
            else:
                params["host"] = host
                hostid = api("host.create", params, token)["hostids"][0]
            hostids.append(hostid)
        return hostids
    
    def graph(token, name, x, y, hostids, item_names, reference):
        colors = ["FF465C", "B0AF07", "0EC9AC", "524BBC", "ED1248", "D1C337", "00BFFF", "4CAF50"]
        itemids = [itemid(token, hostid, item_names) for hostid in hostids]
        itemids = [iid for iid in itemids if iid]
        if not itemids:
            return None
        fields = [field(0, "ds.0.dataset_type", 0)]
        for index, iid in enumerate(itemids):
            fields.extend([field(4, f"ds.0.itemids.{index}", iid), field(1, f"ds.0.color.{index}", colors[index % len(colors)])])
        fields.extend([
            field(0, "ds.0.transparency", 5), field(0, "ds.0.fill", 3), field(0, "ds.0.width", 1),
            field(1, "ds.0.aggregate_interval", "1m"), field(0, "ds.0.approximation", 2),
            field(0, "legend", 1), field(0, "legend_columns", 3), field(0, "legend_lines", 3), field(1, "reference", reference),
        ])
        return {"type": "svggraph", "name": name, "x": str(x), "y": str(y), "width": "24", "height": "5", "view_mode": "0", "fields": fields}
    
    def top_hosts(name, x, width, hostids, metric, reference):
        fields = [field(3, f"hostids.{index}", hostid) for index, hostid in enumerate(hostids)]
        columns = [
            ("Host name", "System name", 2, 0, 2, ""), ("Utilization", metric, 1, 3, 2, "4CAF50"),
            ("1m avg", "Load average (1m avg)", 1, 1, 2, ""), ("5m avg", "Load average (5m avg)", 1, 1, 2, ""),
            ("15m avg", "Load average (15m avg)", 1, 1, 2, ""), ("Processes", "Number of processes", 1, 1, 0, ""),
        ]
        for index, (column_name, item_name, data, display, decimals, color) in enumerate(columns):
            fields.extend([field(1, f"columns.{index}.name", column_name), field(0, f"columns.{index}.data", data), field(1, f"columns.{index}.item", item_name), field(0, f"columns.{index}.aggregate_function", 0), field(0, f"columns.{index}.decimal_places", decimals), field(1, f"columns.{index}.base_color", color)])
            if index > 0:
                fields.extend([field(0, f"columns.{index}.display", display), field(0, f"columns.{index}.history", 1)])
            if index == 1:
                fields.extend([field(1, "columns.1.min", 0), field(1, "columns.1.max", 100), field(1, "columnsthresholds.1.color.0", "FFFF00"), field(1, "columnsthresholds.1.threshold.0", 50), field(1, "columnsthresholds.1.color.1", "FF8000"), field(1, "columnsthresholds.1.threshold.1", 80), field(1, "columnsthresholds.1.color.2", "FF4000"), field(1, "columnsthresholds.1.threshold.2", 90)])
        fields.extend([field(0, "column", 1), field(1, "reference", reference)])
        return {"type": "tophosts", "name": name, "x": str(x), "y": "0", "width": str(width), "height": "4", "view_mode": "0", "fields": fields}
    
    def configure_dashboard(token, node_hostids):
        zabbix_hostid = first("host.get", {"filter": {"host": ["Zabbix server"]}, "output": ["hostid"]}, token, "Zabbix server host")["hostid"]
        hostids = [zabbix_hostid] + node_hostids
        processed = itemid(token, zabbix_hostid, "Number of processed values per second")
        widgets = [
            top_hosts("Top hosts by CPU utilization", 0, 26, hostids, "CPU utilization", "CPU01"),
            top_hosts("Top hosts by memory utilization", 27, 28, hostids, "Memory utilization", "MEM01"),
            {"type": "item", "name": "Performance", "x": "55", "y": "0", "width": "1", "height": "2", "view_mode": "1", "fields": [field(4, "itemid.0", processed), field(0, "show.0", 1), field(0, "show.1", 2), field(0, "show.2", 4), field(1, "description", "{HOST.NAME}\r\nValues per second"), field(0, "units_show", 0), field(0, "units_bold", 0), field(0, "desc_bold", 1)]},
            {"type": "systeminfo", "name": "", "x": "56", "y": "0", "width": "1", "height": "4", "view_mode": "0", "fields": []},
            {"type": "clock", "name": "Local time", "x": "57", "y": "0", "width": "15", "height": "4", "view_mode": "1", "fields": [field(0, "time_bold", 1), field(0, "time_sec", 0), field(0, "clock_type", 1), field(0, "show.0", 2), field(0, "show.1", 3)]},
            {"type": "hostavail", "name": "", "x": "0", "y": "4", "width": "21", "height": "2", "view_mode": "0", "fields": [field(0, "interface_type.0", 1)]},
            {"type": "problemsbysv", "name": "", "x": "21", "y": "4", "width": "30", "height": "2", "view_mode": "0", "fields": [field(0, "show_type", 1), field(1, "reference", "PBSV1")]},
            {"type": "geomap", "name": "", "x": "51", "y": "4", "width": "21", "height": "7", "view_mode": "0", "fields": [field(3, "hostids.0", zabbix_hostid), field(1, "default_view", "48.14816,17.10674,6"), field(1, "reference", "GEO01")]},
            {"type": "problems", "name": "Current problems", "x": "0", "y": "6", "width": "51", "height": "5", "view_mode": "0", "fields": [field(0, "show", 3), field(0, "show_tags", 3), field(1, "reference", "PROB1")]},
            {"type": "svggraph", "name": "", "x": "55", "y": "2", "width": "1", "height": "2", "view_mode": "1", "fields": [field(1, "ds.0.hosts.0", "Zabbix server"), field(1, "ds.0.items.0", "Number of processed values per second"), field(1, "ds.0.color", "90CAF9"), field(0, "lefty", 0), field(0, "righty", 0), field(0, "axisx", 0), field(0, "legend", 0), field(1, "reference", "PERF1"), field(1, "time_period.from", "now-1h"), field(1, "time_period.to", "now")]},
        ]
        for spec in [
            ("Nodes CPU utilization", 0, 11, "CPU utilization", "GCPU1"),
            ("Nodes Memory utilization", 24, 11, "Memory utilization", "GMEM1"),
            ("Nodes Load average (1m)", 48, 11, "Load average (1m avg)", "GLD01"),
            ("Nodes Disk read rate", 0, 16, ["Disk read rate", "sda: Disk read rate", "vda: Disk read rate"], "GDSK1"),
            ("Nodes Network in (eth0)", 24, 16, ["Interface eth0: Bits received"], "GNET1"),
            ("Nodes Network out (eth0)", 48, 16, ["Interface eth0: Bits sent"], "GNET2"),
        ]:
            widget = graph(token, *spec[:3], hostids=hostids, item_names=spec[3], reference=spec[4])
            if widget:
                widgets.append(widget)
        dashboard = first("dashboard.get", {"filter": {"name": ["Global view"]}, "output": ["dashboardid", "name"], "selectPages": ["dashboard_pageid", "name"]}, token, "Global view dashboard")
        page = {"name": "", "widgets": widgets}
        if dashboard.get("pages"):
            page["dashboard_pageid"] = dashboard["pages"][0]["dashboard_pageid"]
        api("dashboard.update", {"dashboardid": dashboard["dashboardid"], "pages": [page]}, token)
        return len(widgets)
    
    token = api("user.login", {"username": ADMIN_USER, "password": ADMIN_PASSWORD})
    node_hostids = configure_hosts(token)
    widget_count = configure_dashboard(token, node_hostids)
    print(f"Zabbix node dashboard bootstrap completed: {len(node_hostids)} node hosts, {widget_count} widgets")
