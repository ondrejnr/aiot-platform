apiVersion: batch/v1
kind: Job
metadata:
  name: zabbix-sso-bootstrap
  namespace: zabbix
  labels:
    app.kubernetes.io/name: zabbix
    app.kubernetes.io/component: sso-bootstrap
    app.kubernetes.io/part-of: zabbix
    argocd.argoproj.io/instance: zabbix
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zabbix
        app.kubernetes.io/component: sso-bootstrap
    spec:
      restartPolicy: OnFailure
      containers:
        - name: bootstrap
          image: python:3.12-alpine
          imagePullPolicy: IfNotPresent
          command: ["python", "/work/zabbix-sso-bootstrap.py"]
          volumeMounts:
            - name: script
              mountPath: /work
      volumes:
        - name: script
          configMap:
            name: zabbix-sso-bootstrap
