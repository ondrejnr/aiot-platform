apiVersion: batch/v1
kind: Job
metadata:
  name: zabbix-sso-bootstrap
  namespace: zabbix
  labels:
    app.kubernetes.io/name: zabbix
    app.kubernetes.io/component: sso-bootstrap
    app.kubernetes.io/part-of: zabbix
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zabbix
        app.kubernetes.io/component: sso-bootstrap
    spec:
      restartPolicy: OnFailure
      containers:
        - name: bootstrap
          image: python:3.12-alpine
          imagePullPolicy: IfNotPresent
          command: ["python", "/work/zabbix-sso-bootstrap.py"]
          volumeMounts:
            - name: script
              mountPath: /work
      volumes:
        - name: script
          configMap:
            name: zabbix-sso-bootstrap
