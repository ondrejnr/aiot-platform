apiVersion: batch/v1
kind: Job
metadata:
  name: zabbix-authentik-saml-bootstrap
  namespace: zabbix
  labels:
    app.kubernetes.io/name: zabbix
    app.kubernetes.io/component: authentik-saml-bootstrap
    app.kubernetes.io/part-of: zabbix
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "25"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zabbix
        app.kubernetes.io/component: authentik-saml-bootstrap
    spec:
      serviceAccountName: zabbix-authentik-saml-bootstrap
      restartPolicy: OnFailure
      containers:
        - name: bootstrap
          image: bitnamilegacy/kubectl:1.33.4
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "/bootstrap/bootstrap.sh"]
          volumeMounts:
            - name: script
              mountPath: /bootstrap
      volumes:
        - name: script
          configMap:
            name: zabbix-authentik-saml-bootstrap
            defaultMode: 0755
