apiVersion: v1
kind: ConfigMap
metadata:
  name: zabbix-authentik-saml-bootstrap
  namespace: zabbix
  labels:
    app.kubernetes.io/name: zabbix
    app.kubernetes.io/component: authentik-saml-bootstrap
    app.kubernetes.io/part-of: zabbix
data:
  bootstrap.sh: |-
    #!/bin/sh
    set -eu

    PY=/tmp/zabbix-authentik-saml-bootstrap.py

    cat > "$PY" <<'PYCODE'
    from authentik.core.models import Application
    from authentik.flows.models import Flow
    from authentik.crypto.models import CertificateKeyPair
    from authentik.providers.saml.models import SAMLProvider, SAMLPropertyMapping

    AUTHENTIK_URL = "https://authentik.46.4.123.8.nip.io"
    ZABBIX_URL = "https://zabbix.46.4.123.8.nip.io"

    APP_SLUG = "zabbix"
    PROVIDER_NAME = "zabbix-saml-provider"

    ACS_URL = f"{ZABBIX_URL}/index_sso.php?acs"
    AUDIENCE = f"{ZABBIX_URL}/zabbix"

    # IdP-initiated SSO launch URL so the Authentik application tile starts the
    # SAML flow instead of hitting Zabbix directly (avoids "SAML request payload is missing").
    LAUNCH_URL = f"{AUTHENTIK_URL}/application/saml/{APP_SLUG}/sso/binding/init/"

    app, _ = Application.objects.get_or_create(
        slug=APP_SLUG,
        defaults={
            "name": "Zabbix",
            "meta_launch_url": LAUNCH_URL,
            "open_in_new_tab": True,
        },
    )
    app.name = "Zabbix"
    app.meta_launch_url = LAUNCH_URL
    app.open_in_new_tab = True

    auth_flow = Flow.objects.get(slug="default-provider-authorization-implicit-consent")

    cert = CertificateKeyPair.objects.filter(name="authentik Self-signed Certificate").first()
    if not cert:
        cert = CertificateKeyPair.objects.filter(certificate_data__isnull=False, key_data__isnull=False).first()
    if not cert:
        raise RuntimeError("No usable CertificateKeyPair found for Zabbix SAML provider")

    mapping_names = [
        "authentik default SAML Mapping: Username",
        "authentik default SAML Mapping: Email",
        "authentik default SAML Mapping: Name",
        "authentik default SAML Mapping: Groups",
    ]
    mappings = list(SAMLPropertyMapping.objects.filter(name__in=mapping_names))
    if not mappings:
        raise RuntimeError("No SAML property mappings found for Zabbix SAML provider")

    field_names = {f.name for f in SAMLProvider._meta.fields}
    defaults = {"name": PROVIDER_NAME}

    def set_if_field(name, value):
        if name in field_names:
            defaults[name] = value

    set_if_field("authorization_flow", auth_flow)
    set_if_field("acs_url", ACS_URL)
    set_if_field("audience", AUDIENCE)
    set_if_field("signing_kp", cert)
    set_if_field("sp_binding", "post")
    set_if_field("slo_binding", "redirect")
    set_if_field("default_relay_state", ZABBIX_URL)
    set_if_field("sign_assertion", True)
    set_if_field("sign_response", False)
    set_if_field("sign_logout_request", False)
    set_if_field("sign_logout_response", False)

    provider, created = SAMLProvider.objects.update_or_create(
        name=PROVIDER_NAME,
        defaults=defaults,
    )
    provider.property_mappings.set(mappings)
    provider.save()

    app.provider = provider
    app.save()

    print({
        "application": app.slug,
        "provider": provider.name,
        "created": created,
        "acs_url": getattr(provider, "acs_url", None),
        "audience": getattr(provider, "audience", None),
        "sp_binding": getattr(provider, "sp_binding", None),
        "signing_kp": str(getattr(provider, "signing_kp", None)),
        "mappings": [m.name for m in provider.property_mappings.all()],
    })
    PYCODE

    kubectl -n authentik exec deploy/authentik-server -- ak shell -c "$(cat "$PY")"
