apiVersion: v1
kind: ServiceAccount
metadata:
  name: zabbix-monitor
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: zabbix-monitor
rules:
- apiGroups: [""]
  resources: ["nodes","nodes/stats","nodes/metrics","nodes/spec","nodes/proxy","namespaces","services","endpoints","pods","componentstatuses"]
  verbs: ["get","list","watch"]
- apiGroups: ["apps"]
  resources: ["deployments","daemonsets","statefulsets","replicasets"]
  verbs: ["get","list","watch"]
- apiGroups: ["batch"]
  resources: ["jobs","cronjobs"]
  verbs: ["get","list","watch"]
- apiGroups: ["metrics.k8s.io"]
  resources: ["nodes","pods"]
  verbs: ["get","list","watch"]
- nonResourceURLs: ["/metrics","/api","/api/*","/apis","/apis/*"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: zabbix-monitor
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: zabbix-monitor
subjects:
- kind: ServiceAccount
  name: zabbix-monitor
  namespace: monitoring
---
apiVersion: v1
kind: Secret
metadata:
  name: zabbix-monitor-token
  namespace: monitoring
  annotations:
    kubernetes.io/service-account.name: zabbix-monitor
type: kubernetes.io/service-account-token
