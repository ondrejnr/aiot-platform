apiVersion: batch/v1
kind: Job
metadata:
  name: zabbix-dashboard-bootstrap
  namespace: zabbix
  labels:
    app.kubernetes.io/name: zabbix
    app.kubernetes.io/component: dashboard-bootstrap
    app.kubernetes.io/part-of: zabbix
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zabbix
        app.kubernetes.io/component: dashboard-bootstrap
    spec:
      restartPolicy: OnFailure
      containers:
        - name: bootstrap
          image: python:3.12-alpine
          imagePullPolicy: IfNotPresent
          command: ["python", "/work/zabbix-dashboard-bootstrap.py"]
          volumeMounts:
            - name: script
              mountPath: /work
      volumes:
        - name: script
          configMap:
            name: zabbix-dashboard-bootstrap
