alertmanager:
  fullnameOverride: am
  replicaCount: 1
  serviceMonitor:
    enabled: true
    additionalLabels:
      release: prometheus
  config:
    route:
      receiver: "null"
      group_by: ["alertname","namespace","severity"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      routes:
        - matchers:
            - severity = "critical"
          receiver: mattermost
          continue: true
    receivers:
      - name: "null"
      - name: mattermost
        webhook_configs:
          - url: "http://placeholder-set-via-secret/hooks/REPLACE_ME"
            send_resolved: true
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 256Mi
  persistence:
    enabled: false
