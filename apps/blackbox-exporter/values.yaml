prometheus-blackbox-exporter:
  serviceMonitor:
    enabled: true
    defaults:
      labels:
        release: prometheus
      interval: 60s
  config:
    modules:
      http_2xx:
        prober: http
        timeout: 10s
        http:
          method: GET
          fail_if_not_ssl: false
          preferred_ip_protocol: ip4
          valid_status_codes: [200, 301, 302, 401, 403]
          tls_config:
            insecure_skip_verify: true
      http_post_2xx:
        prober: http
        http:
          method: POST
          tls_config:
            insecure_skip_verify: true
      tcp_connect:
        prober: tcp
      icmp:
        prober: icmp
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi
