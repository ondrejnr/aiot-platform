
---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: ingress-sre-agent
  namespace: blackbox-exporter
  labels:
    release: prometheus
spec:
  jobName: blackbox-http-sre-agent
  module: http_2xx
  interval: 60s
  scrapeTimeout: 15s
  prober:
    url: blackbox-exporter-prometheus-blackbox-exporter.blackbox-exporter.svc:9115
  targets:
    staticConfig:
      static:
        - https://sre-agent.46.4.123.8.nip.io/
