{{- if .Values.peConsole.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pe-console
  namespace: pe-console
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.peConsole.ingress.clusterIssuer | quote }}
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
    nginx.ingress.kubernetes.io/proxy-ssl-verify: "off"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
{{- if .Values.peConsole.authentik.enabled }}
    nginx.ingress.kubernetes.io/auth-url: "http://{{ .Values.peConsole.authentik.serverService }}/outpost.goauthentik.io/auth/nginx"
    nginx.ingress.kubernetes.io/auth-signin: "https://{{ .Values.peConsole.authentik.host }}/outpost.goauthentik.io/start?rd=$scheme://$http_host$escaped_request_uri"
    nginx.ingress.kubernetes.io/auth-response-headers: "Set-Cookie,X-authentik-username,X-authentik-groups,X-authentik-email,X-authentik-name,X-authentik-uid"
    nginx.ingress.kubernetes.io/auth-snippet: |
      proxy_set_header X-Forwarded-Host $http_host;
{{- end }}
{{- if .Values.peConsole.autoLogin.enabled }}
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header Accept-Encoding "";
      proxy_hide_header Content-Security-Policy;
      proxy_hide_header X-Content-Security-Policy;
      add_header Content-Security-Policy "default-src * 'unsafe-inline' 'unsafe-eval' data: blob:;" always;
      sub_filter_once on;
      sub_filter_types text/html;
      sub_filter '</body>' '<script>window.addEventListener("load",function(){setTimeout(function(){var u=document.getElementById("username");var p=document.getElementById("password");if(!u||!p)return;u.value="{{ .Values.peConsole.autoLogin.username }}";p.value="{{ .Values.peConsole.autoLogin.password }}";if(window.jQuery){jQuery("#loginForm").trigger("submit");}else{document.getElementById("loginForm").submit();}},300);});</script></body>';
{{- end }}
spec:
  ingressClassName: {{ .Values.peConsole.ingress.className }}
  tls:
  - hosts:
    - {{ .Values.peConsole.ingress.host }}
    secretName: pe-console-tls
  rules:
  - host: {{ .Values.peConsole.ingress.host }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: pe-console
            port:
              number: 4443
{{- end }}
