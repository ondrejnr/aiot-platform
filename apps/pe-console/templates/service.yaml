---
apiVersion: v1
kind: Service
metadata:
  name: pe-console
  namespace: pe-console
spec:
  ports:
  - name: https
    port: 4443
    protocol: TCP
    targetPort: {{ .Values.peConsole.externalPort }}
---
apiVersion: v1
kind: Endpoints
metadata:
  name: pe-console
  namespace: pe-console
subsets:
- addresses:
  - ip: {{ .Values.peConsole.externalIP | quote }}
  ports:
  - name: https
    port: {{ .Values.peConsole.externalPort }}
    protocol: TCP
