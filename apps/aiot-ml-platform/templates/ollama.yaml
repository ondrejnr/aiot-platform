apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-models
  namespace: {{ .Values.localAI.namespace }}
  labels:
    {{- include "aiotml.labels" . | nindent 4 }}
    app.kubernetes.io/component: ollama
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: {{ .Values.global.storageClass | quote }}
  resources:
    requests:
      storage: {{ .Values.localAI.pvcSize | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: {{ .Values.localAI.namespace }}
  labels:
    {{- include "aiotml.labels" . | nindent 4 }}
    app.kubernetes.io/component: ollama
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/component: ollama
  template:
    metadata:
      labels:
        app.kubernetes.io/component: ollama
        app.kubernetes.io/part-of: aiot-ml-platform
    spec:
      containers:
        - name: ollama
          image: {{ .Values.localAI.image | quote }}
          imagePullPolicy: IfNotPresent
          env:
            - name: OLLAMA_HOST
              value: 0.0.0.0:11434
            - name: OLLAMA_KEEP_ALIVE
              value: 30m
          ports:
            - name: http
              containerPort: 11434
          resources:
            {{- toYaml .Values.localAI.resources | nindent 12 }}
          volumeMounts:
            - name: models
              mountPath: /root/.ollama
          readinessProbe:
            httpGet:
              path: /api/tags
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /api/tags
              port: http
            initialDelaySeconds: 90
            periodSeconds: 30
            failureThreshold: 5
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: ollama-models
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: {{ .Values.localAI.namespace }}
  labels:
    {{- include "aiotml.labels" . | nindent 4 }}
    app.kubernetes.io/component: ollama
spec:
  selector:
    app.kubernetes.io/component: ollama
  ports:
    - name: http
      port: 11434
      targetPort: http
---
apiVersion: batch/v1
kind: Job
metadata:
  name: ollama-model-pull
  namespace: {{ .Values.localAI.namespace }}
  labels:
    {{- include "aiotml.labels" . | nindent 4 }}
    app.kubernetes.io/component: ollama-model-pull
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/component: ollama-model-pull
    spec:
      restartPolicy: OnFailure
      containers:
        - name: pull
          image: {{ .Values.localAI.image | quote }}
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              ollama serve &
              pid=$!
              i=0
              until ollama list >/dev/null 2>&1; do
                i=$((i + 1))
                if [ "$i" -gt 60 ]; then
                  echo "ollama did not become ready"
                  exit 1
                fi
                sleep 2
              done
              ollama pull {{ .Values.localAI.model | quote }}
              ollama pull {{ .Values.localAI.embeddingModel | quote }}
              kill "$pid" || true
          resources:
            requests:
              cpu: "500m"
              memory: 1Gi
            limits:
              cpu: "4"
              memory: 8Gi
          volumeMounts:
            - name: models
              mountPath: /root/.ollama
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: ollama-models
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ollama
  namespace: {{ .Values.localAI.namespace }}
  labels:
    {{- include "aiotml.labels" . | nindent 4 }}
    app.kubernetes.io/component: ollama
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-body-size: 50m
spec:
  ingressClassName: nginx
  tls:
    - hosts: [{{ .Values.localAI.host | quote }}]
      secretName: ollama-tls
  rules:
    - host: {{ .Values.localAI.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ollama
                port:
                  name: http
