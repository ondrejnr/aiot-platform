apiVersion: v1
kind: ServiceAccount
metadata:
  name: aiot-control-center
  namespace: {{ .Values.controlCenter.namespace }}
  labels:
    {{- include "aiotml.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-center
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: aiot-control-center-readonly
  labels:
    {{- include "aiotml.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-center
rules:
  - apiGroups: [""]
    resources: ["nodes", "namespaces", "pods", "services", "endpoints", "events"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["get", "list"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list"]
  - apiGroups: ["helm.toolkit.fluxcd.io"]
    resources: ["helmreleases"]
    verbs: ["get", "list"]
  - apiGroups: ["kustomize.toolkit.fluxcd.io"]
    resources: ["kustomizations"]
    verbs: ["get", "list"]
  - apiGroups: ["source.toolkit.fluxcd.io"]
    resources: ["gitrepositories", "helmrepositories", "helmcharts"]
    verbs: ["get", "list"]
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters", "backups", "scheduledbackups", "poolers"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: aiot-control-center-readonly
  labels:
    {{- include "aiotml.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-center
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: aiot-control-center-readonly
subjects:
  - kind: ServiceAccount
    name: aiot-control-center
    namespace: {{ .Values.controlCenter.namespace }}
