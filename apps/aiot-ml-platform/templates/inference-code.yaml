apiVersion: v1
kind: ConfigMap
metadata:
  name: aiot-maintenance-api-code
  namespace: {{ .Values.inference.namespace }}
  labels:
    {{- include "aiotml.labels" . | nindent 4 }}
    app.kubernetes.io/component: maintenance-api
data:
  service.py: |
    import math
    import os
    import re
    import threading

    import mlflow
    import numpy as np
    import pandas as pd
    import psycopg
    from fastapi import FastAPI
    from mlflow.tracking import MlflowClient
    from psycopg.rows import dict_row

    app = FastAPI(title="AIOT Maintenance Inference API")
    MODEL_NAME = os.getenv("MODEL_NAME", "aiot-maintenance-predictor")
    MLFLOW_TRACKING_URI = os.getenv("MLFLOW_TRACKING_URI", "http://mlflow.mlflow.svc.cluster.local:5000")
    BASE_FEATURES = ["temperature", "humidity", "pressure", "battery"]
    WINDOWS = {"5m": "5min", "15m": "15min", "60m": "60min"}
    ROLLING_STATS = ["mean", "min", "max", "std"]
    TIME_FEATURES = ["hour_sin", "hour_cos", "dow_sin", "dow_cos"]
    FEATURE_SET_VERSION = "rolling_trend_time_v1"
    TARGET_HORIZON_MINUTES = int(os.getenv("TARGET_HORIZON_MINUTES", "30"))
    MIN_EVENT_DURATION_MINUTES = int(os.getenv("MIN_EVENT_DURATION_MINUTES", "14"))
    TARGET_DEFINITION = f"risk_in_next_{TARGET_HORIZON_MINUTES}m_min_duration_{MIN_EVENT_DURATION_MINUTES}m"
    LEGACY_TARGET_DEFINITION = "next_sample_threshold_state_per_sensor"

    FORECAST_MODEL_NAME = os.getenv("FORECAST_MODEL_NAME", "aiot-sensor-forecast-30m")
    FORECAST_HORIZON_MINUTES = int(os.getenv("FORECAST_HORIZON_MINUTES", "30"))
    FORECAST_RESAMPLE_MINUTES = int(os.getenv("FORECAST_RESAMPLE_MINUTES", "1"))
    FORECAST_MIN_SKILL = float(os.getenv("FORECAST_MIN_SKILL", "0.01"))
    _model = None
    _version = None
    _model_score = None
    _model_feature_set = None
    _model_target_definition = None
    _lock = threading.Lock()


    def feature_columns():
        cols = list(BASE_FEATURES)
        for col in BASE_FEATURES:
            cols.append(f"{col}_delta_1")
        for label in WINDOWS:
            for col in BASE_FEATURES:
                for stat in ROLLING_STATS:
                    cols.append(f"{col}_{label}_{stat}")
                cols.append(f"{col}_{label}_trend")
        cols.extend(TIME_FEATURES)
        return cols


    FEATURES = feature_columns()


    def pg_conn():
        return psycopg.connect(
            host=os.getenv("PGHOST"),
            port=int(os.getenv("PGPORT", "5432")),
            dbname=os.getenv("PGDATABASE"),
            user=os.getenv("PGUSER"),
            password=os.getenv("PGPASSWORD"),
            row_factory=dict_row,
            connect_timeout=5,
        )


    def rule(row):
        temp = float(row.get("temperature") or 0)
        hum = float(row.get("humidity") or 0)
        pressure = float(row.get("pressure") or 0)
        battery = float(row.get("battery") or 0)
        risk = max(0, min(40, (temp - 26) * 8)) + max(0, min(20, (hum - 70) * 4)) + (20 if pressure < 998 or pressure > 1025 else 0) + max(0, min(20, (3.6 - battery) * 60))
        risk = int(max(0, min(100, risk)))
        label = "critical" if risk >= 80 else "warning" if risk >= 50 else "ok"
        return risk, label


    def load_model():
        global _model, _version, _model_score, _model_feature_set, _model_target_definition
        with _lock:
            if _model is not None:
                return _model
            try:
                mlflow.set_tracking_uri(MLFLOW_TRACKING_URI)
                client = MlflowClient()
                versions = [v for v in client.search_model_versions(f"name='{MODEL_NAME}'") if getattr(v, "status", "READY") == "READY"]
                if not versions:
                    return None
                preferred_proba = []
                preferred = []
                legacy = []
                for v in versions:
                    try:
                        run = client.get_run(v.run_id)
                        params = run.data.params
                        metrics = run.data.metrics
                        if params.get("split_strategy") != "chronological_80_20":
                            continue
                        target = params.get("target_definition")
                        score = float(metrics.get("pr_auc", metrics.get("roc_auc", metrics.get("accuracy", 0.0))))
                        item = (score, int(v.version), v, params)
                        if target == TARGET_DEFINITION and params.get("pyfunc_predict_fn") == "predict_proba":
                            preferred_proba.append(item)
                        elif target == TARGET_DEFINITION:
                            preferred.append(item)
                        elif target == LEGACY_TARGET_DEFINITION:
                            legacy.append(item)
                    except Exception:
                        continue
                selected_group = preferred_proba or preferred or legacy
                if selected_group:
                    score, _, selected, params = sorted(selected_group, key=lambda x: (x[0], x[1]), reverse=True)[0]
                    _model_score = score
                    _model_feature_set = params.get("feature_set_version") or "base_features_legacy"
                    _model_target_definition = params.get("target_definition")
                else:
                    selected = sorted(versions, key=lambda v: int(v.version))[-1]
                    _model_score = None
                    _model_feature_set = None
                    _model_target_definition = None
                _version = selected.version
                _model = mlflow.pyfunc.load_model(f"models:/{MODEL_NAME}/{selected.version}")
                return _model
            except Exception:
                return None


    def prepare_base_frame(df):
        df = df.copy()
        df["ts"] = pd.to_datetime(df["ts"], utc=True, errors="coerce")
        for col in BASE_FEATURES:
            df[col] = pd.to_numeric(df[col], errors="coerce")
        df = df.dropna(subset=["ts", "sensor_id"] + BASE_FEATURES)
        return df.sort_values(["sensor_id", "ts"]).reset_index(drop=True)


    def add_time_features(df):
        ts = pd.to_datetime(df["ts"], utc=True)
        seconds = ts.dt.hour * 3600 + ts.dt.minute * 60 + ts.dt.second + ts.dt.microsecond / 1_000_000
        hour_angle = 2 * math.pi * seconds / 86400.0
        dow_angle = 2 * math.pi * ts.dt.dayofweek / 7.0
        df["hour_sin"] = np.sin(hour_angle)
        df["hour_cos"] = np.cos(hour_angle)
        df["dow_sin"] = np.sin(dow_angle)
        df["dow_cos"] = np.cos(dow_angle)
        return df


    def add_engineered_features(df):
        df = prepare_base_frame(df)
        frames = []
        for _, g in df.groupby("sensor_id", sort=False):
            g = g.sort_values("ts").copy()
            indexed = g.set_index("ts")
            for col in BASE_FEATURES:
                g[f"{col}_delta_1"] = g[col].diff().fillna(0.0)
                for label, window in WINDOWS.items():
                    roll = indexed[col].rolling(window, min_periods=1)
                    mean = roll.mean()
                    g[f"{col}_{label}_mean"] = mean.to_numpy()
                    g[f"{col}_{label}_min"] = roll.min().to_numpy()
                    g[f"{col}_{label}_max"] = roll.max().to_numpy()
                    g[f"{col}_{label}_std"] = roll.std().fillna(0.0).to_numpy()
                    g[f"{col}_{label}_trend"] = g[col].to_numpy() - mean.to_numpy()
            frames.append(g)
        out = pd.concat(frames, ignore_index=True) if frames else df.copy()
        out = add_time_features(out)
        out[FEATURES] = out[FEATURES].replace([np.inf, -np.inf], np.nan).fillna(0.0)
        return out.sort_values(["sensor_id", "ts"]).reset_index(drop=True)


    def recent_rows(hours=2):
        with pg_conn() as conn, conn.cursor() as cur:
            cur.execute(
                """
                select ts, sensor_id, location, temperature, humidity, pressure, battery
                from sensor_data
                where ts > now() - (%s::text || ' hours')::interval
                order by sensor_id, ts asc
                """,
                (hours,),
            )
            return [dict(r) for r in cur.fetchall()]


    def latest_feature_rows(limit=50):
        rows = recent_rows(2)
        if not rows:
            return [], pd.DataFrame()
        df = add_engineered_features(pd.DataFrame(rows))
        latest = df.sort_values(["sensor_id", "ts"]).groupby("sensor_id", as_index=False).tail(1)
        latest = latest.sort_values("ts", ascending=False).head(limit).reset_index(drop=True)
        return latest.to_dict("records"), latest


    @app.get("/healthz")
    def healthz():
        return {"ok": True, "model_loaded": _model is not None, "model_version": _version, "model_score": _model_score, "model_feature_set": _model_feature_set, "model_target_definition": _model_target_definition, "preferred_target_definition": TARGET_DEFINITION, "runtime_feature_set_version": FEATURE_SET_VERSION, "runtime_feature_count": len(FEATURES)}


    @app.post("/reload")
    def reload_model():
        global _model, _version, _model_score, _model_feature_set, _model_target_definition
        with _lock:
            _model = None
            _version = None
            _model_score = None
            _model_feature_set = None
            _model_target_definition = None
        return {"loaded": load_model() is not None, "model_version": _version, "model_score": _model_score, "model_feature_set": _model_feature_set, "model_target_definition": _model_target_definition, "preferred_target_definition": TARGET_DEFINITION, "runtime_feature_set_version": FEATURE_SET_VERSION, "runtime_feature_count": len(FEATURES)}


    @app.get("/predict/latest")
    def predict_latest():
        rows, feature_df = latest_feature_rows(50)
        model = load_model()
        items = []
        if model is not None and rows:
            try:
                if _model_feature_set == FEATURE_SET_VERSION:
                    X = feature_df[FEATURES].fillna(0.0)
                    used_feature_set = FEATURE_SET_VERSION
                else:
                    X = feature_df[BASE_FEATURES].fillna(0.0)
                    used_feature_set = _model_feature_set or "base_features_legacy"
                try:
                    preds = model.predict(X)
                except Exception:
                    # Safe fallback if a registry model has missing/incorrect feature metadata.
                    fallback_X = feature_df[BASE_FEATURES].fillna(0.0) if X.shape[1] != len(BASE_FEATURES) else feature_df[FEATURES].fillna(0.0)
                    preds = model.predict(fallback_X)
                    X = fallback_X
                    used_feature_set = "fallback_" + ("base_features" if X.shape[1] == len(BASE_FEATURES) else FEATURE_SET_VERSION)
                for row, pred in zip(rows, preds):
                    fallback, _ = rule(row)
                    arr = np.asarray(pred).reshape(-1)
                    if arr.size >= 2:
                        value = float(arr[1])
                    else:
                        value = float(arr[0])
                    risk = int(value * 100) if value <= 1 else int(value)
                    risk = max(0, min(100, risk if risk != 0 else fallback))
                    label = "critical" if risk >= 80 else "warning" if risk >= 50 else "ok"
                    items.append({"sensor_id": row.get("sensor_id"), "risk": risk, "label": label, "source": "mlflow", "feature_set": used_feature_set})
                return {"status": "ok", "model_version": _version, "model_score": _model_score, "model_feature_set": _model_feature_set, "model_target_definition": _model_target_definition, "preferred_target_definition": TARGET_DEFINITION, "feature_set_version": used_feature_set, "feature_count": int(X.shape[1]), "items": items}
            except Exception as exc:
                return {"status": "degraded", "error": str(exc), "items": []}
        for row in rows:
            risk, label = rule(row)
            items.append({"sensor_id": row.get("sensor_id"), "risk": risk, "label": label, "source": "rules"})
        return {"status": "rules", "model_version": None, "feature_set_version": None, "items": items}
    # --- Sensor value forecasting (+N minutes) ---
    FORECAST_TARGETS = [f"{col}_t_plus_{FORECAST_HORIZON_MINUTES}m" for col in BASE_FEATURES]
    FORECAST_LAGS_MINUTES = [1, 5, 15, 30, 60]
    FORECAST_ROLLING_WINDOWS_MINUTES = [5, 15, 60]
    FORECAST_TIME_FEATURES = ["hour_sin", "hour_cos", "dow_sin", "dow_cos"]
    FORECAST_LOCATION_CODES = {"lab": 0, "warehouse": 1, "office": 2, "outside": 3, "plant": 4}
    FORECAST_FEATURE_SET_VERSION = "sensor_forecast_v1"
    FORECAST_TARGET_DEFINITION = f"sensor_values_plus_{FORECAST_HORIZON_MINUTES}m"
    _forecast_model = None
    _forecast_version = None
    _forecast_score = None
    _forecast_lock = threading.Lock()


    def forecast_feature_columns():
        cols = list(BASE_FEATURES)
        for col in BASE_FEATURES:
            for lag in FORECAST_LAGS_MINUTES:
                cols.append(f"{col}_lag_{lag}m")
                cols.append(f"{col}_delta_{lag}m")
            for window in FORECAST_ROLLING_WINDOWS_MINUTES:
                cols.append(f"{col}_roll_{window}m_mean")
                cols.append(f"{col}_roll_{window}m_std")
                cols.append(f"{col}_roll_{window}m_min")
                cols.append(f"{col}_roll_{window}m_max")
                cols.append(f"{col}_roll_{window}m_trend")
        cols.extend(FORECAST_TIME_FEATURES)
        cols.extend(["sensor_num", "location_code"])
        return cols


    FORECAST_FEATURES = forecast_feature_columns()


    def sensor_number(sensor_id):
        match = re.search(r"(\d+)$", str(sensor_id or ""))
        return int(match.group(1)) if match else 0


    def add_forecast_time_features(frame):
        ts = pd.to_datetime(frame["ts"], utc=True)
        seconds = ts.dt.hour * 3600 + ts.dt.minute * 60 + ts.dt.second
        hour_angle = 2 * math.pi * seconds / 86400.0
        dow_angle = 2 * math.pi * ts.dt.dayofweek / 7.0
        frame["hour_sin"] = np.sin(hour_angle)
        frame["hour_cos"] = np.cos(hour_angle)
        frame["dow_sin"] = np.sin(dow_angle)
        frame["dow_cos"] = np.cos(dow_angle)
        return frame


    def build_forecast_features(raw):
        df = prepare_base_frame(raw)
        freq = f"{FORECAST_RESAMPLE_MINUTES}min"
        df["ts"] = df["ts"].dt.floor(freq)
        aggregations = {col: "mean" for col in BASE_FEATURES}
        aggregations["location"] = "last"
        df = df.groupby(["sensor_id", "ts"], as_index=False).agg(aggregations).sort_values(["sensor_id", "ts"])
        frames = []
        for sensor_id, group in df.groupby("sensor_id", sort=False):
            group = group.sort_values("ts").set_index("ts")
            if len(group) < 8:
                continue
            location = str(group["location"].dropna().iloc[-1]) if group["location"].notna().any() else "unknown"
            idx = pd.date_range(group.index.min().floor(freq), group.index.max().floor(freq), freq=freq)
            g = group[BASE_FEATURES].reindex(idx)
            g[BASE_FEATURES] = g[BASE_FEATURES].interpolate(method="time", limit=3).ffill(limit=3).bfill(limit=1)
            g = g.dropna(subset=BASE_FEATURES)
            if len(g) < 8:
                continue
            g["sensor_id"] = sensor_id
            g["location"] = location
            g["sensor_num"] = sensor_number(sensor_id) / 1000.0
            g["location_code"] = FORECAST_LOCATION_CODES.get(location, -1)
            for col in BASE_FEATURES:
                for lag in FORECAST_LAGS_MINUTES:
                    steps = max(1, int(round(lag / FORECAST_RESAMPLE_MINUTES)))
                    lagged = g[col].shift(steps)
                    g[f"{col}_lag_{lag}m"] = lagged
                    g[f"{col}_delta_{lag}m"] = g[col] - lagged
                for window in FORECAST_ROLLING_WINDOWS_MINUTES:
                    steps = max(2, int(round(window / FORECAST_RESAMPLE_MINUTES)))
                    roll = g[col].rolling(steps, min_periods=max(2, min(steps, 3)))
                    mean = roll.mean()
                    g[f"{col}_roll_{window}m_mean"] = mean
                    g[f"{col}_roll_{window}m_std"] = roll.std().fillna(0.0)
                    g[f"{col}_roll_{window}m_min"] = roll.min()
                    g[f"{col}_roll_{window}m_max"] = roll.max()
                    g[f"{col}_roll_{window}m_trend"] = g[col] - mean
            g = g.reset_index().rename(columns={"index": "ts"})
            frames.append(g)
        if not frames:
            return pd.DataFrame(columns=["ts", "sensor_id", "location"] + FORECAST_FEATURES)
        out = pd.concat(frames, ignore_index=True)
        out = add_forecast_time_features(out)
        out[FORECAST_FEATURES] = out[FORECAST_FEATURES].replace([np.inf, -np.inf], np.nan)
        out = out.dropna(subset=FORECAST_FEATURES).sort_values(["sensor_id", "ts"]).reset_index(drop=True)
        return out


    def load_forecast_model():
        global _forecast_model, _forecast_version, _forecast_score
        with _forecast_lock:
            if _forecast_model is not None:
                return _forecast_model
            try:
                mlflow.set_tracking_uri(MLFLOW_TRACKING_URI)
                client = MlflowClient()
                versions = [v for v in client.search_model_versions(f"name='{FORECAST_MODEL_NAME}'") if getattr(v, "status", "READY") == "READY"]
                candidates = []
                for v in versions:
                    try:
                        run = client.get_run(v.run_id)
                        params = run.data.params
                        metrics = run.data.metrics
                        if params.get("target_definition") != FORECAST_TARGET_DEFINITION:
                            continue
                        if params.get("feature_set_version") != FORECAST_FEATURE_SET_VERSION:
                            continue
                        if params.get("split_strategy") != "chronological_80_20":
                            continue
                        score = float(metrics.get("overall_skill_vs_persistence", 0.0))
                        if score >= FORECAST_MIN_SKILL:
                            candidates.append((score, int(v.version), v))
                    except Exception:
                        continue
                if not candidates:
                    return None
                score, _, selected = sorted(candidates, key=lambda x: (x[0], x[1]), reverse=True)[0]
                _forecast_score = score
                _forecast_version = selected.version
                _forecast_model = mlflow.pyfunc.load_model(f"models:/{FORECAST_MODEL_NAME}/{selected.version}")
                return _forecast_model
            except Exception:
                return None


    def latest_forecast_feature_rows(limit=50):
        rows = recent_rows(3)
        if not rows:
            return [], pd.DataFrame()
        df = build_forecast_features(pd.DataFrame(rows))
        if df.empty:
            return [], df
        latest = df.sort_values(["sensor_id", "ts"]).groupby("sensor_id", as_index=False).tail(1)
        latest = latest.sort_values("ts", ascending=False).head(limit).reset_index(drop=True)
        return latest.to_dict("records"), latest


    def format_forecast_item(row, predicted, source):
        predicted = np.asarray(predicted, dtype=float).reshape(-1)
        if predicted.size < len(BASE_FEATURES):
            predicted = np.array([float(row[col]) for col in BASE_FEATURES], dtype=float)
        future_row = dict(row)
        for i, col in enumerate(BASE_FEATURES):
            future_row[col] = float(predicted[i])
        risk_score, label = rule(future_row)
        return {
            "sensor_id": row.get("sensor_id"),
            "location": row.get("location"),
            "ts": str(row.get("ts")),
            "horizon_minutes": FORECAST_HORIZON_MINUTES,
            "source": source,
            "predicted_risk": risk_score,
            "label": label,
            "temperature_now": round(float(row.get("temperature") or 0), 2),
            "humidity_now": round(float(row.get("humidity") or 0), 2),
            "pressure_now": round(float(row.get("pressure") or 0), 2),
            "battery_now": round(float(row.get("battery") or 0), 3),
            "temperature_forecast": round(float(future_row["temperature"]), 2),
            "humidity_forecast": round(float(future_row["humidity"]), 2),
            "pressure_forecast": round(float(future_row["pressure"]), 2),
            "battery_forecast": round(float(future_row["battery"]), 3),
        }


    @app.post("/forecast/reload")
    def reload_forecast():
        global _forecast_model, _forecast_version, _forecast_score
        with _forecast_lock:
            _forecast_model = None
            _forecast_version = None
            _forecast_score = None
        return {"loaded": load_forecast_model() is not None, "model_name": FORECAST_MODEL_NAME, "model_version": _forecast_version, "model_score": _forecast_score, "target_definition": FORECAST_TARGET_DEFINITION, "feature_set_version": FORECAST_FEATURE_SET_VERSION}


    @app.get("/forecast/latest")
    def forecast_latest(limit: int = 50):
        rows, feature_df = latest_forecast_feature_rows(limit)
        if not rows:
            return {"status": "degraded", "model_name": FORECAST_MODEL_NAME, "model_version": _forecast_version, "items": [], "error": "not enough recent rows for 60m lag features"}
        model = load_forecast_model()
        items = []
        if model is not None:
            try:
                X = feature_df[FORECAST_FEATURES].replace([np.inf, -np.inf], np.nan).fillna(0.0)
                preds = model.predict(X)
                for row, pred in zip(rows, preds):
                    items.append(format_forecast_item(row, pred, "mlflow"))
                items = sorted(items, key=lambda x: x.get("predicted_risk", 0), reverse=True)
                return {"status": "ok", "source": "mlflow", "model_name": FORECAST_MODEL_NAME, "model_version": _forecast_version, "model_score": _forecast_score, "target_definition": FORECAST_TARGET_DEFINITION, "feature_set_version": FORECAST_FEATURE_SET_VERSION, "feature_count": len(FORECAST_FEATURES), "items": items}
            except Exception as exc:
                return {"status": "degraded", "source": "mlflow", "model_name": FORECAST_MODEL_NAME, "model_version": _forecast_version, "error": str(exc), "items": []}
        for row in rows:
            current = [float(row[col]) for col in BASE_FEATURES]
            items.append(format_forecast_item(row, current, "persistence"))
        items = sorted(items, key=lambda x: x.get("predicted_risk", 0), reverse=True)
        return {"status": "fallback", "source": "persistence", "reason": "no MLflow forecast model with positive skill yet", "model_name": FORECAST_MODEL_NAME, "model_version": None, "target_definition": FORECAST_TARGET_DEFINITION, "feature_set_version": FORECAST_FEATURE_SET_VERSION, "feature_count": len(FORECAST_FEATURES), "items": items}
