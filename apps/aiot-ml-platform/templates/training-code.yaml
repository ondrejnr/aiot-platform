apiVersion: v1
kind: ConfigMap
metadata:
  name: aiot-maintenance-trainer-code
  namespace: {{ .Values.training.namespace }}
  labels:
    {{- include "aiotml.labels" . | nindent 4 }}
    app.kubernetes.io/component: trainer
data:
  train.py: |
    import json
    import math
    import os
    import sys
    import tempfile
    from pathlib import Path

    import mlflow
    import mlflow.data
    import mlflow.sklearn
    import numpy as np
    import pandas as pd
    import psycopg2
    import psutil
    from mlflow.models import infer_signature
    from sklearn.ensemble import RandomForestClassifier
    from sklearn.metrics import (
        accuracy_score,
        classification_report,
        confusion_matrix,
        average_precision_score,
        f1_score,
        precision_score,
        recall_score,
        roc_auc_score,
    )

    LOOKBACK_DAYS = int(os.getenv("LOOKBACK_DAYS", "7"))
    MAX_ROWS = int(os.getenv("MAX_ROWS", "200000"))
    TARGET_HORIZON_MINUTES = int(os.getenv("TARGET_HORIZON_MINUTES", "30"))
    MIN_EVENT_DURATION_MINUTES = int(os.getenv("MIN_EVENT_DURATION_MINUTES", "14"))
    TARGET_HORIZON_SECONDS = TARGET_HORIZON_MINUTES * 60
    MIN_EVENT_DURATION_SECONDS = MIN_EVENT_DURATION_MINUTES * 60
    TARGET_DEFINITION = f"risk_in_next_{TARGET_HORIZON_MINUTES}m_min_duration_{MIN_EVENT_DURATION_MINUTES}m"
    MLFLOW_TRACKING_URI = os.getenv("MLFLOW_TRACKING_URI", "http://mlflow.mlflow.svc.cluster.local:5000")
    MODEL_NAME = os.getenv("MODEL_NAME", "aiot-maintenance-predictor")
    EXPERIMENT_NAME = os.getenv("EXPERIMENT_NAME", "aiot-maintenance-proxied")
    BASE_FEATURES = ["temperature", "humidity", "pressure", "battery"]
    WINDOWS = {"5m": "5min", "15m": "15min", "60m": "60min"}
    ROLLING_STATS = ["mean", "min", "max", "std"]
    TIME_FEATURES = ["hour_sin", "hour_cos", "dow_sin", "dow_cos"]
    FEATURE_SET_VERSION = "rolling_trend_time_v1"


    def feature_columns():
        cols = list(BASE_FEATURES)
        for col in BASE_FEATURES:
            cols.append(f"{col}_delta_1")
        for label in WINDOWS:
            for col in BASE_FEATURES:
                for stat in ROLLING_STATS:
                    cols.append(f"{col}_{label}_{stat}")
                cols.append(f"{col}_{label}_trend")
        cols.extend(TIME_FEATURES)
        return cols


    FEATURES = feature_columns()


    def dsn():
        return "host={host} port={port} dbname={db} user={user} password={pwd}".format(
            host=os.getenv("PGHOST"),
            port=os.getenv("PGPORT", "5432"),
            db=os.getenv("PGDATABASE"),
            user=os.getenv("PGUSER"),
            pwd=os.getenv("PGPASSWORD"),
        )


    def load_data():
        sql = f"""
        select ts, sensor_id, location, temperature, humidity, pressure, battery
        from sensor_data
        where ts > now() - interval '{LOOKBACK_DAYS} days'
        order by ts desc
        limit {MAX_ROWS}
        """
        with psycopg2.connect(dsn()) as conn:
            return pd.read_sql(sql, conn)


    def threshold_rule(df):
        return (
            (df["temperature"] > 29.0)
            | (df["humidity"] > 75.0)
            | (df["pressure"] < 998.0)
            | (df["pressure"] > 1025.0)
            | (df["battery"] < 3.50)
        ).astype(int)


    def prepare_base_frame(df):
        df = df.copy()
        df["ts"] = pd.to_datetime(df["ts"], utc=True, errors="coerce")
        for col in BASE_FEATURES:
            df[col] = pd.to_numeric(df[col], errors="coerce")
        df = df.dropna(subset=["ts", "sensor_id"] + BASE_FEATURES)
        return df.sort_values(["sensor_id", "ts"]).reset_index(drop=True)


    def add_time_features(df):
        ts = pd.to_datetime(df["ts"], utc=True)
        seconds = ts.dt.hour * 3600 + ts.dt.minute * 60 + ts.dt.second + ts.dt.microsecond / 1_000_000
        hour_angle = 2 * math.pi * seconds / 86400.0
        dow_angle = 2 * math.pi * ts.dt.dayofweek / 7.0
        df["hour_sin"] = np.sin(hour_angle)
        df["hour_cos"] = np.cos(hour_angle)
        df["dow_sin"] = np.sin(dow_angle)
        df["dow_cos"] = np.cos(dow_angle)
        return df


    def add_engineered_features(df):
        """Add past-only rolling, trend, delta and calendar features.

        All rolling windows are computed per sensor on rows sorted by time, so every feature
        uses only the current and historical samples. No target or future row is used.
        """
        frames = []
        for _, g in df.groupby("sensor_id", sort=False):
            g = g.sort_values("ts").copy()
            indexed = g.set_index("ts")
            for col in BASE_FEATURES:
                g[f"{col}_delta_1"] = g[col].diff().fillna(0.0)
                for label, window in WINDOWS.items():
                    roll = indexed[col].rolling(window, min_periods=1)
                    mean = roll.mean()
                    g[f"{col}_{label}_mean"] = mean.to_numpy()
                    g[f"{col}_{label}_min"] = roll.min().to_numpy()
                    g[f"{col}_{label}_max"] = roll.max().to_numpy()
                    g[f"{col}_{label}_std"] = roll.std().fillna(0.0).to_numpy()
                    g[f"{col}_{label}_trend"] = g[col].to_numpy() - mean.to_numpy()
            frames.append(g)
        out = pd.concat(frames, ignore_index=True) if frames else df.copy()
        out = add_time_features(out)
        out[FEATURES] = out[FEATURES].replace([np.inf, -np.inf], np.nan).fillna(0.0)
        return out.sort_values(["sensor_id", "ts"]).reset_index(drop=True)


    def add_horizon_target(df):
        frames = []
        horizon_ns = int(TARGET_HORIZON_SECONDS * 1_000_000_000)
        for _, g in df.groupby("sensor_id", sort=False):
            g = g.sort_values("ts").copy()
            if len(g) < 2:
                continue
            times = g["ts"].astype("int64").to_numpy()
            current = g["current_rule_target"].astype(int).to_numpy()
            diffs = np.diff(times) / 1_000_000_000.0
            valid_diffs = diffs[(diffs > 0) & (diffs <= 300)]
            median_gap = float(np.median(valid_diffs)) if len(valid_diffs) else 1.0
            end_idx = np.searchsorted(times, times + horizon_ns, side="right")
            start_idx = np.arange(len(g)) + 1
            cumsum = np.concatenate([[0], np.cumsum(current)])
            future_positive_count = cumsum[end_idx] - cumsum[start_idx]
            future_positive_seconds = future_positive_count * median_gap
            horizon_complete = (times[-1] - times) >= horizon_ns
            g["future_positive_seconds"] = future_positive_seconds
            g["target_horizon_complete"] = horizon_complete
            g["target"] = (future_positive_seconds >= MIN_EVENT_DURATION_SECONDS).astype(int)
            frames.append(g)
        if not frames:
            return df.iloc[0:0].copy()
        out = pd.concat(frames, ignore_index=True)
        out = out[out["target_horizon_complete"]].copy()
        out["target"] = out["target"].astype(int)
        return out


    def add_target(df):
        """Build a no-leakage horizon target and stronger feature set.

        Target: whether the same sensor will spend at least MIN_EVENT_DURATION_MINUTES
        in threshold-risk state during the next TARGET_HORIZON_MINUTES.
        Features: current values, deltas, rolling stats/trends over 5/15/60 minutes,
        and calendar cyclic features. All engineered features are past-only.
        """
        df = prepare_base_frame(df)
        df["current_rule_target"] = threshold_rule(df)
        df = add_engineered_features(df)
        df = add_horizon_target(df)
        return df.sort_values("ts").reset_index(drop=True)


    def data_profile(df):
        profile = {
            "rows": int(len(df)),
            "lookback_days": LOOKBACK_DAYS,
            "max_rows": MAX_ROWS,
            "target_definition": TARGET_DEFINITION,
            "target_horizon_minutes": TARGET_HORIZON_MINUTES,
            "min_event_duration_minutes": MIN_EVENT_DURATION_MINUTES,
            "feature_set_version": FEATURE_SET_VERSION,
            "base_features": BASE_FEATURES,
            "feature_count": len(FEATURES),
            "rolling_windows": list(WINDOWS.keys()),
            "positive_rate": float(df["target"].mean()) if len(df) else 0.0,
            "current_rule_positive_rate": float(df["current_rule_target"].mean()) if len(df) else 0.0,
            "target_counts": {str(k): int(v) for k, v in df["target"].value_counts().sort_index().items()},
            "features": FEATURES,
            "feature_summary": {},
        }
        if "ts" in df.columns and len(df):
            profile["time_range"] = {"min_ts": str(df["ts"].min()), "max_ts": str(df["ts"].max())}
        if "future_positive_seconds" in df.columns and len(df):
            fps = pd.to_numeric(df["future_positive_seconds"], errors="coerce")
            profile["future_positive_seconds"] = {"min": float(fps.min()), "mean": float(fps.mean()), "max": float(fps.max())}
        for col in FEATURES:
            s = pd.to_numeric(df[col], errors="coerce")
            profile["feature_summary"][col] = {
                "min": float(s.min()),
                "mean": float(s.mean()),
                "max": float(s.max()),
                "std": float(s.std()) if len(s) > 1 else 0.0,
            }
        return profile


    def log_system_snapshot(step):
        try:
            cpu = psutil.cpu_percent(interval=None)
            mem = psutil.virtual_memory()
            mlflow.log_metric("system/cpu_utilization_percentage", float(cpu), step=step)
            mlflow.log_metric("system/system_memory_usage_megabytes", float((mem.total - mem.available) / 1024 / 1024), step=step)
            mlflow.log_metric("system/system_memory_usage_percentage", float(mem.percent), step=step)
        except Exception as exc:
            print(f"system metrics skipped: {exc}")


    def log_dataset_lineage(df):
        try:
            sample_cols = FEATURES + ["current_rule_target", "target"]
            sample = df[sample_cols].sample(min(len(df), 1000), random_state=42)
            dataset = mlflow.data.from_pandas(sample, source="postgresql://aiot/sensor_data", name="sensor_data_training_sample")
            mlflow.log_input(dataset, context="training")
        except Exception as exc:
            print(f"dataset lineage skipped: {exc}")


    def log_artifacts(df, X_test, y_test, pred, proba, model, metrics, profile, split_idx):
        feature_importance = pd.DataFrame(
            {"feature": FEATURES, "importance": [float(v) for v in model.feature_importances_]}
        ).sort_values("importance", ascending=False)
        pred_sample = df.iloc[split_idx:].copy().head(250)
        pred_sample["prediction"] = list(pred[: len(pred_sample)])
        pred_sample["failure_probability"] = list(proba[: len(pred_sample)])
        cm = confusion_matrix(y_test, pred, labels=[0, 1])
        report_text = classification_report(y_test, pred, labels=[0, 1], zero_division=0)
        model_card = f"""# AIOT maintenance predictor

    ## Purpose
    Predicts the next observed threshold-risk state for each AIOT sensor from current and historical telemetry features.

    ## Training data
    - Source table: `sensor_data`
    - Lookback window: {LOOKBACK_DAYS} days
    - Training rows after cleanup: {len(df)}
    - Target: threshold-risk state within next {TARGET_HORIZON_MINUTES} minutes for at least {MIN_EVENT_DURATION_MINUTES} minutes
    - Positive rate: {profile['positive_rate']:.4f}
    - Current-rule positive rate: {profile['current_rule_positive_rate']:.4f}

    ## Features
    - Feature set: {FEATURE_SET_VERSION}
    - Feature count: {len(FEATURES)}
    - Base features: {', '.join(BASE_FEATURES)}
    - Rolling windows: {', '.join(WINDOWS.keys())}
    - Includes deltas, rolling mean/min/max/std, trend vs rolling mean, hour-of-day and day-of-week cyclic features.

    ## Validation
    - Split strategy: chronological 80/20 split, not random row split
    - Leakage check: current threshold state is not used as a feature; rolling features are past-only.

    ## Metrics
    """
        for key, value in sorted(metrics.items()):
            model_card += f"- {key}: {float(value):.6f}\n"
        model_card += "\n## Artifact inventory\n- `model/`: MLflow sklearn model\n- `reports/metrics.json`: scalar metric snapshot\n- `reports/dataset-summary.json`: training data profile\n- `reports/confusion-matrix.json`: binary confusion matrix\n- `reports/classification-report.txt`: sklearn classification report\n- `reports/feature-importance.json`: feature importance table\n- `reports/prediction-sample.json`: prediction sample table\n"

        mlflow.log_dict(metrics, "reports/metrics.json")
        mlflow.log_dict(profile, "reports/dataset-summary.json")
        mlflow.log_dict({"labels": [0, 1], "matrix": cm.astype(int).tolist()}, "reports/confusion-matrix.json")
        mlflow.log_text(report_text, "reports/classification-report.txt")
        mlflow.log_text(model_card, "reports/model-card.md")
        mlflow.log_table(feature_importance, "reports/feature-importance.json")
        mlflow.log_table(pred_sample, "reports/prediction-sample.json")

        with tempfile.TemporaryDirectory() as tmp:
            tmp_path = Path(tmp)
            feature_importance.to_csv(tmp_path / "feature-importance.csv", index=False)
            pred_sample.to_csv(tmp_path / "prediction-sample.csv", index=False)
            mlflow.log_artifacts(str(tmp_path), artifact_path="exports")


    def main():
        mlflow.set_tracking_uri(MLFLOW_TRACKING_URI)
        mlflow.set_experiment(EXPERIMENT_NAME)
        mlflow.set_system_metrics_sampling_interval(1)
        mlflow.set_system_metrics_samples_before_logging(1)

        with mlflow.start_run(log_system_metrics=True) as run:
            mlflow.set_tags(
                {
                    "aiot.component": "maintenance-trainer",
                    "aiot.model_name": MODEL_NAME,
                    "aiot.experiment": EXPERIMENT_NAME,
                    "aiot.target_definition": TARGET_DEFINITION,
                    "aiot.target_horizon_minutes": str(TARGET_HORIZON_MINUTES),
                    "aiot.min_event_duration_minutes": str(MIN_EVENT_DURATION_MINUTES),
                    "aiot.feature_set_version": FEATURE_SET_VERSION,
                    "aiot.split_strategy": "chronological_80_20",
                }
            )
            log_system_snapshot(0)

            with mlflow.start_span("load-training-data") as span:
                raw_df = load_data()
                df = add_target(raw_df)
                span.set_inputs({"lookback_days": LOOKBACK_DAYS, "max_rows": MAX_ROWS, "target_horizon_minutes": TARGET_HORIZON_MINUTES, "min_event_duration_minutes": MIN_EVENT_DURATION_MINUTES})
                span.set_outputs({"raw_rows": len(raw_df), "training_rows": len(df), "feature_count": len(FEATURES)})

            if len(df) < 100:
                print(f"Not enough rows for training: {len(df)}")
                mlflow.log_metric("rows", len(df))
                return
            if df["target"].nunique() < 2:
                print("Not enough target diversity for training")
                mlflow.log_metric("rows", len(df))
                mlflow.log_metric("positive_rate", float(df["target"].mean()))
                return

            X = df[FEATURES].replace([np.inf, -np.inf], np.nan).fillna(0.0)
            y = df["target"]
            split_idx = max(1, int(len(df) * 0.8))
            split_idx = min(split_idx, len(df) - 1)
            X_train, X_test = X.iloc[:split_idx], X.iloc[split_idx:]
            y_train, y_test = y.iloc[:split_idx], y.iloc[split_idx:]
            model = RandomForestClassifier(
                n_estimators=220,
                max_depth=12,
                min_samples_split=8,
                min_samples_leaf=3,
                class_weight="balanced",
                n_jobs=-1,
                random_state=42,
            )

            with mlflow.start_span("fit-random-forest") as span:
                span.set_inputs({"train_rows": len(X_train), "feature_count": len(FEATURES), "feature_set_version": FEATURE_SET_VERSION})
                model.fit(X_train, y_train)
                span.set_outputs({"n_estimators": model.n_estimators, "classes": [int(c) for c in model.classes_]})

            pred = model.predict(X_test)
            proba = model.predict_proba(X_test)[:, 1] if len(model.classes_) > 1 else pred
            current_rule_baseline = df["current_rule_target"].iloc[split_idx:].astype(int)
            metrics = {
                "accuracy": accuracy_score(y_test, pred),
                "f1": f1_score(y_test, pred, zero_division=0),
                "precision": precision_score(y_test, pred, zero_division=0),
                "recall": recall_score(y_test, pred, zero_division=0),
                "baseline_always_zero_accuracy": float((y_test == 0).mean()),
                "baseline_always_one_accuracy": float((y_test == 1).mean()),
                "baseline_current_rule_accuracy": accuracy_score(y_test, current_rule_baseline),
                "feature_count": float(len(FEATURES)),
            }
            if y_test.nunique() > 1:
                metrics["pr_auc"] = average_precision_score(y_test, proba)
                metrics["roc_auc"] = roc_auc_score(y_test, proba)
            metrics = {k: float(v) for k, v in metrics.items()}
            profile = data_profile(df)

            mlflow.log_params(
                {
                    "rows": len(df),
                    "lookback_days": LOOKBACK_DAYS,
                    "feature_count": len(FEATURES),
                    "feature_set_version": FEATURE_SET_VERSION,
                    "features": ",".join(FEATURES),
                    "model_type": "RandomForestClassifier",
                    "experiment_name": EXPERIMENT_NAME,
                    "target_definition": TARGET_DEFINITION,
                    "target_horizon_minutes": TARGET_HORIZON_MINUTES,
                    "min_event_duration_minutes": MIN_EVENT_DURATION_MINUTES,
                    "split_strategy": "chronological_80_20",
                    "rolling_windows": ",".join(WINDOWS.keys()),
                    "pyfunc_predict_fn": "predict_proba",
                }
            )
            mlflow.log_metrics(metrics)
            log_system_snapshot(1)
            log_dataset_lineage(df)
            log_artifacts(df, X_test, y_test, pred, proba, model, metrics, profile, split_idx)

            signature = infer_signature(X_train.head(20), model.predict_proba(X_train.head(20)))
            mlflow.sklearn.log_model(
                model,
                "model",
                registered_model_name=MODEL_NAME,
                signature=signature,
                input_example=X_train.head(5),
                pyfunc_predict_fn="predict_proba",
            )

            with mlflow.start_span("training-summary") as span:
                span.set_inputs({"run_id": run.info.run_id, "model_name": MODEL_NAME})
                span.set_outputs({"metrics": metrics, "artifact_root": mlflow.get_artifact_uri()})

            log_system_snapshot(2)
            print({"run_id": run.info.run_id, "rows": len(df), "positive_rate": profile["positive_rate"], "feature_count": len(FEATURES), "metrics": metrics})


    if __name__ == "__main__":
        main()
