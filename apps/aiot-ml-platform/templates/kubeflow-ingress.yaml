{{- if .Values.kubeflow.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kubeflow-pipelines
  namespace: kubeflow
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header x-forwarded-prefix /pipeline;
      proxy_set_header kubeflow-userid "user@example.com";
spec:
  ingressClassName: nginx
  tls:
    - hosts: [{{ .Values.kubeflow.ingress.host | quote }}]
      secretName: kubeflow-pipelines-tls
  rules:
    - host: {{ .Values.kubeflow.ingress.host | quote }}
      http:
        paths:
          - path: /pipeline(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: ml-pipeline-ui
                port:
                  number: 80
{{- end }}
