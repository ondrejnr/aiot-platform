{{- if .Values.kubeflow.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kubeflow-pipelines
  namespace: kubeflow
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [{{ .Values.kubeflow.ingress.host | quote }}]
      secretName: kubeflow-pipelines-tls
  rules:
    - host: {{ .Values.kubeflow.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ml-pipeline-ui
                port:
                  number: 80
{{- end }}
