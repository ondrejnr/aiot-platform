apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiot-control-center
  namespace: {{ .Values.controlCenter.namespace }}
  labels:
    {{- include "aiotml.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-center
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: control-center
  template:
    metadata:
      annotations:
        checksum/control-center-code: {{ .Files.Get "files/control-center/app.py" | sha256sum }}
      labels:
        app.kubernetes.io/component: control-center
        app.kubernetes.io/part-of: aiot-ml-platform
    spec:
      serviceAccountName: aiot-control-center
      automountServiceAccountToken: true
      containers:
        - name: app
          image: {{ .Values.controlCenter.image | quote }}
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              python -m pip install --no-cache-dir fastapi "uvicorn[standard]" requests "psycopg[binary]==3.2.*" >/tmp/control-pip.log 2>&1
              exec uvicorn app:app --host 0.0.0.0 --port 8080 --app-dir /app
          envFrom:
            - secretRef:
                name: aiot-pg-credentials
          env:
            - name: OLLAMA_URL
              value: http://ollama.local-ai.svc.cluster.local:11434
            - name: OLLAMA_MODEL
              value: {{ .Values.localAI.model | quote }}
            - name: OLLAMA_NUM_THREAD
              value: {{ .Values.localAI.numThread | quote }}
            - name: INFERENCE_URL
              value: http://aiot-maintenance-api.aiot.svc.cluster.local:8080
            - name: INFERENCE_MODEL_NAME
              value: {{ .Values.inference.modelName | quote }}
            - name: FORECAST_MODEL_NAME
              value: {{ .Values.forecast.modelName | quote }}
          ports:
            - name: http
              containerPort: 8080
          resources:
            {{- toYaml .Values.controlCenter.resources | nindent 12 }}
          volumeMounts:
            - name: code
              mountPath: /app
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 120
            periodSeconds: 30
            failureThreshold: 5
      volumes:
        - name: code
          configMap:
            name: aiot-control-center-code
---
apiVersion: v1
kind: Service
metadata:
  name: aiot-control-center
  namespace: {{ .Values.controlCenter.namespace }}
  labels:
    {{- include "aiotml.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-center
spec:
  selector:
    app.kubernetes.io/component: control-center
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aiot-control-center
  namespace: {{ .Values.controlCenter.namespace }}
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "180"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "180"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [{{ .Values.controlCenter.host | quote }}]
      secretName: aiot-control-center-tls
  rules:
    - host: {{ .Values.controlCenter.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aiot-control-center
                port:
                  number: 8080
