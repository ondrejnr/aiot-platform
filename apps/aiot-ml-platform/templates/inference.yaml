apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiot-maintenance-api
  namespace: {{ .Values.inference.namespace }}
  labels:
    {{- include "aiotml.labels" . | nindent 4 }}
    app.kubernetes.io/component: maintenance-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: maintenance-api
  template:
    metadata:
      annotations:
        checksum/inference-code: {{ include (print $.Template.BasePath "/inference-code.yaml") . | sha256sum }}
      labels:
        app.kubernetes.io/component: maintenance-api
        app.kubernetes.io/part-of: aiot-ml-platform
    spec:
      containers:
        - name: app
          image: {{ .Values.inference.image | quote }}
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              python -m pip install --no-cache-dir fastapi "uvicorn[standard]" pandas scikit-learn "mlflow=={{ .Values.mlflow.version }}" "psycopg[binary]==3.2.*" >/tmp/inference-pip.log 2>&1
              exec uvicorn service:app --host 0.0.0.0 --port 8080 --app-dir /app
          envFrom:
            - secretRef:
                name: aiot-pg-credentials
          env:
            - name: MLFLOW_TRACKING_URI
              value: http://mlflow.mlflow.svc.cluster.local:5000
            - name: MODEL_NAME
              value: {{ .Values.inference.modelName | quote }}
          ports:
            - name: http
              containerPort: 8080
          resources:
            {{- toYaml .Values.inference.resources | nindent 12 }}
          volumeMounts:
            - name: code
              mountPath: /app
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 120
            periodSeconds: 15
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 180
            periodSeconds: 30
            failureThreshold: 5
      volumes:
        - name: code
          configMap:
            name: aiot-maintenance-api-code
---
apiVersion: v1
kind: Service
metadata:
  name: aiot-maintenance-api
  namespace: {{ .Values.inference.namespace }}
  labels:
    {{- include "aiotml.labels" . | nindent 4 }}
    app.kubernetes.io/component: maintenance-api
spec:
  selector:
    app.kubernetes.io/component: maintenance-api
  ports:
    - name: http
      port: 8080
      targetPort: http
