global:
  domain: 46.4.123.8.nip.io
  storageClass: nfs

localAI:
  namespace: local-ai
  image: ollama/ollama:0.6.8
  model: qwen2.5-coder:1.5b
  embeddingModel: nomic-embed-text
  host: ollama.46.4.123.8.nip.io
  numThread: 8
  timeoutSeconds: 600
  numPredict: 96
  numCtx: 2048
  temperature: "0"
  keepAlive: 30m
  factsTimeoutSeconds: 15
  pvcSize: 20Gi
  resources:
    requests:
      cpu: "500m"
      memory: 2Gi
    limits:
      cpu: "8"
      memory: 12Gi

mlflow:
  namespace: mlflow
  image: python:3.11-slim
  version: "2.21.3"
  pvcSize: 20Gi
  host: mlflow.46.4.123.8.nip.io
  resources:
    requests:
      cpu: "200m"
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi

controlCenter:
  namespace: aiot
  host: aiot-control.46.4.123.8.nip.io
  image: python:3.11-slim
  resources:
    requests:
      cpu: "100m"
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

inference:
  namespace: aiot
  image: python:3.11-slim
  modelName: aiot-maintenance-predictor
  resources:
    requests:
      cpu: "100m"
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

forecast:
  modelName: aiot-sensor-forecast-30m
  experimentName: aiot-sensor-forecasting
  schedule: "35 */6 * * *"
  suspend: false
  lookbackDays: 30
  maxRows: "2500000"
  horizonMinutes: 30
  resampleMinutes: 1
  minSkill: 0.01
  resources:
    requests:
      cpu: "750m"
      memory: 1Gi
    limits:
      cpu: "3"
      memory: 4Gi

training:
  namespace: aiot
  image: python:3.11-slim
  schedule: "5 2 * * *"
  suspend: false
  lookbackDays: 7
  maxRows: 200000
  targetHorizonMinutes: 30
  minEventDurationMinutes: 14
  resources:
    requests:
      cpu: "500m"
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi

kubeflow:
  ingress:
    enabled: true
    host: kubeflow.46.4.123.8.nip.io
