gitea:
  persistence:
    size: 20Gi
  postgresql-ha:
    enabled: false
  redis-cluster:
    enabled: false
    image:
      registry: docker.io
      repository: bitnamilegacy/redis-cluster
  redis:
    enabled: true
    architecture: standalone
    image:
      registry: docker.io
      repository: bitnamilegacy/redis
    auth:
      enabled: true
      password: changeme
    commonConfiguration: 'appendonly no

      save ""'
    master:
      persistence:
        enabled: false
      livenessProbe:
        enabled: true
        initialDelaySeconds: 30
        periodSeconds: 30
        timeoutSeconds: 30
        failureThreshold: 15
        successThreshold: 1
      readinessProbe:
        enabled: true
        initialDelaySeconds: 30
        periodSeconds: 30
        timeoutSeconds: 30
        failureThreshold: 15
        successThreshold: 1
      nodeSelector:
        role: apps
  gitea:
    config:
      server:
        DOMAIN: gitea.46.4.123.8.nip.io
        SSH_DOMAIN: gitea.46.4.123.8.nip.io
        ROOT_URL: https://gitea.46.4.123.8.nip.io/
        PROTOCOL: http
      database:
        DB_TYPE: postgres
        HOST: pg-cluster-rw.databases.svc.cluster.local:5432
        NAME: gitea
        USER: gitea
        PASSWD: gitea
        SSL_MODE: disable
      service:
        ALLOW_ONLY_EXTERNAL_REGISTRATION: true
        SHOW_REGISTRATION_BUTTON: false
        DISABLE_REGISTRATION: false
      oauth2_client:
        ENABLE_AUTO_REGISTRATION: true
        ACCOUNT_LINKING: auto
        USERNAME: preferred_username
        UPDATE_AVATAR: true
  ingress:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    hosts:
    - host: gitea.46.4.123.8.nip.io
      paths:
      - path: /
        pathType: Prefix
    tls:
    - hosts:
      - gitea.46.4.123.8.nip.io
      secretName: gitea-tls
