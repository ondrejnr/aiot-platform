# aiot-platform overlay for gitea
# Probe relax 2026-05-04: bitnami exec probes timeout on IO-busy host
gitea:
  persistence:
    size: 20Gi
  postgresql-ha:
    pgpool:
      image:
        registry: docker.io
        repository: bitnamilegacy/pgpool
      livenessProbe:
        enabled: true
        initialDelaySeconds: 60
        periodSeconds: 60
        timeoutSeconds: 30
        failureThreshold: 30
        successThreshold: 1
      readinessProbe:
        enabled: true
        initialDelaySeconds: 30
        periodSeconds: 30
        timeoutSeconds: 30
        failureThreshold: 30
        successThreshold: 1
    postgresql:
      image:
        registry: docker.io
        repository: bitnamilegacy/postgresql-repmgr
      extraEnvVars:
      - name: POSTGRESQL_INIT_MAX_TIMEOUT
        value: "600"
      repmgrConnectTimeout: 120
      repmgrReconnectAttempts: 5
      startupProbe:
        enabled: true
        initialDelaySeconds: 60
        periodSeconds: 20
        timeoutSeconds: 30
        failureThreshold: 60
        successThreshold: 1
      livenessProbe:
        enabled: true
        initialDelaySeconds: 60
        periodSeconds: 60
        timeoutSeconds: 30
        failureThreshold: 30
        successThreshold: 1
      readinessProbe:
        enabled: true
        initialDelaySeconds: 30
        periodSeconds: 30
        timeoutSeconds: 30
        failureThreshold: 30
        successThreshold: 1
  redis-cluster:
    enabled: false
    image:
      registry: docker.io
      repository: bitnamilegacy/redis-cluster
  redis:
    # IO storm mitigation: cache only, no persistence (sessions can be re-created)
    commonConfiguration: |-
      appendonly no
      save ""
    master:
      persistence:
        enabled: false
      livenessProbe:
        enabled: true
        initialDelaySeconds: 30
        periodSeconds: 30
        timeoutSeconds: 30
        failureThreshold: 15
        successThreshold: 1
      readinessProbe:
        enabled: true
        initialDelaySeconds: 30
        periodSeconds: 30
        timeoutSeconds: 30
        failureThreshold: 15
        successThreshold: 1
  config:
    server:
      DOMAIN: gitea.142.132.207.168.nip.io
      SSH_DOMAIN: gitea.142.132.207.168.nip.io
      ROOT_URL: https://gitea.142.132.207.168.nip.io/
      PROTOCOL: http
    service:
      ALLOW_ONLY_EXTERNAL_REGISTRATION: true
      SHOW_REGISTRATION_BUTTON: false
      DISABLE_REGISTRATION: false
    oauth2_client:
      ENABLE_AUTO_REGISTRATION: true
      ACCOUNT_LINKING: auto
      USERNAME: nickname
      UPDATE_AVATAR: true
