# aiot-platform overlay for gitea
# Bitnami removed legacy debian-12 image tags from docker.io/bitnami in Aug 2025
# - repoint sub-charts to docker.io/bitnamilegacy/*.
gitea:
  persistence:
    size: 20Gi
  postgresql-ha:
    pgpool:
      image:
        registry: docker.io
        repository: bitnamilegacy/pgpool
    postgresql:
      image:
        registry: docker.io
        repository: bitnamilegacy/postgresql-repmgr
  redis-cluster:
    image:
      registry: docker.io
      repository: bitnamilegacy/redis-cluster
