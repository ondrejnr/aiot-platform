# aiot-platform overlay for gitea
# Probe relax 2026-05-04: bitnami exec probes timeout on IO-busy host
gitea:
  persistence:
    size: 20Gi
  # Migrated 2026-05-04 to centralized CNPG (pg-cluster-rw.databases) for IO consolidation
  postgresql-ha:
    enabled: false
  redis-cluster:
    enabled: false
    image:
      registry: docker.io
      repository: bitnamilegacy/redis-cluster
  redis:
    # IO storm mitigation: cache only, no persistence (sessions can be re-created)
    commonConfiguration: |-
      appendonly no
      save ""
    master:
      persistence:
        enabled: false
      livenessProbe:
        enabled: true
        initialDelaySeconds: 30
        periodSeconds: 30
        timeoutSeconds: 30
        failureThreshold: 15
        successThreshold: 1
      readinessProbe:
        enabled: true
        initialDelaySeconds: 30
        periodSeconds: 30
        timeoutSeconds: 30
        failureThreshold: 15
        successThreshold: 1
  config:
    server:
      DOMAIN: gitea.142.132.207.168.nip.io
      SSH_DOMAIN: gitea.142.132.207.168.nip.io
      ROOT_URL: https://gitea.142.132.207.168.nip.io/
      PROTOCOL: http
    database:
      DB_TYPE: postgres
      HOST: pg-cluster-rw.databases.svc.cluster.local:5432
      NAME: gitea
      USER: gitea
      PASSWD: gitea
      SSL_MODE: disable
    service:
      ALLOW_ONLY_EXTERNAL_REGISTRATION: true
      SHOW_REGISTRATION_BUTTON: false
      DISABLE_REGISTRATION: false
    oauth2_client:
      ENABLE_AUTO_REGISTRATION: true
      ACCOUNT_LINKING: auto
      USERNAME: nickname
      UPDATE_AVATAR: true
