# Helm values for kube-prometheus-stack chart
# Hardened 2026-04-27: resource limits + nodeSelector to workers only

alertmanager:
  alertmanagerSpec:
    nodeSelector:
      node-role.kubernetes.io/worker: ""
    priorityClassName: system-cluster-critical
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        memory: 256Mi
    topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: alertmanager

grafana:
  enabled: false

prometheus:
  prometheusSpec:
    nodeSelector:
      node-role.kubernetes.io/worker: ""
    priorityClassName: system-cluster-critical
    # Hard memory cap prevents runaway scrape buffers from killing the node
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 2Gi
    scrapeInterval: 60s
    evaluationInterval: 60s
    retention: 3d
    retentionSize: 2GB
    topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: prometheus

prometheusOperator:
  nodeSelector:
    node-role.kubernetes.io/worker: ""
  priorityClassName: system-cluster-critical
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 256Mi

kube-state-metrics:
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      memory: 256Mi
  livenessProbe:
    failureThreshold: 10
    timeoutSeconds: 15
    periodSeconds: 20
  readinessProbe:
    failureThreshold: 10
    timeoutSeconds: 15
    periodSeconds: 20

prometheus-node-exporter:
  resources:
    requests:
      cpu: 20m
      memory: 24Mi
    limits:
      memory: 128Mi

# kube-proxy is enabled (Flannel CNI); standard ServiceMonitor applies
kubeProxy:
  enabled: false
