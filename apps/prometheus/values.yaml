kube-prometheus-stack:
  defaultRules:
    rules:
      alertmanager: false
      kubeControllerManager: false
      kubeProxy: false
      kubeSchedulerAlerting: false
      kubeSchedulerRecording: false
    disabled:
      Watchdog: true
      InfoInhibitor: true
      PrometheusNotConnectedToAlertmanagers: true
      KubeControllerManagerDown: true
      KubeProxyDown: true
      KubeSchedulerDown: true
  alertmanager:
    enabled: false
  grafana:
    enabled: false
  prometheus:
    prometheusSpec:
      replicas: 0
      nodeSelector:
        node-role.kubernetes.io/worker: ''
      priorityClassName: system-cluster-critical
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          memory: 2Gi
      scrapeInterval: 60s
      evaluationInterval: 60s
      retention: 3d
      retentionSize: 2GB
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: prometheus
  prometheusOperator:
    nodeSelector:
      node-role.kubernetes.io/worker: ''
    priorityClassName: system-cluster-critical
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        memory: 256Mi
  kubeStateMetrics:
    enabled: false
  kube-state-metrics:
    resources:
      requests:
        cpu: 20m
        memory: 32Mi
      limits:
        memory: 256Mi
    livenessProbe:
      failureThreshold: 10
      timeoutSeconds: 15
      periodSeconds: 20
    readinessProbe:
      failureThreshold: 10
      timeoutSeconds: 15
      periodSeconds: 20
  kubeProxy:
    enabled: false
  kubeControllerManager:
    enabled: false
  kubeScheduler:
    enabled: false
  kubeEtcd:
    enabled: false
  coreDns:
    enabled: true
  kubeDns:
    enabled: false
  kubeApiServer:
    enabled: true
  nodeExporter:
    enabled: false
