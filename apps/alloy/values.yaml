alloy:
  alloy:
    enableReporting: false
    extraEnv:
      - name: K8S_NODE_NAME
        valueFrom:
          fieldRef:
            fieldPath: spec.nodeName
    mounts:
      varlog: true
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
    configMap:
      content: |-
        logging {
          level  = "info"
          format = "logfmt"
        }

        loki.write "loki" {
          endpoint {
            url = "http://loki-gateway.observability-logs.svc.cluster.local/loki/api/v1/push"
          }
        }

        discovery.kubernetes "pods" {
          role = "pod"

          selectors {
            role  = "pod"
            field = "spec.nodeName=" + sys.env("K8S_NODE_NAME")
          }
        }

        discovery.relabel "pod_logs" {
          targets = discovery.kubernetes.pods.targets

          rule {
            source_labels = ["__meta_kubernetes_namespace"]
            action        = "replace"
            target_label  = "namespace"
          }

          rule {
            source_labels = ["__meta_kubernetes_pod_name"]
            action        = "replace"
            target_label  = "pod"
          }

          rule {
            source_labels = ["__meta_kubernetes_pod_container_name"]
            action        = "replace"
            target_label  = "container"
          }

          rule {
            source_labels = ["__meta_kubernetes_pod_node_name"]
            action        = "replace"
            target_label  = "node"
          }

          rule {
            source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
            action        = "replace"
            target_label  = "app"
          }

          rule {
            source_labels = ["__meta_kubernetes_pod_label_app"]
            action        = "replace"
            target_label  = "app_legacy"
          }

          rule {
            source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_container_name"]
            action        = "replace"
            target_label  = "job"
            separator     = "/"
            replacement   = "$1"
          }

          rule {
            source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
            action        = "replace"
            target_label  = "__path__"
            separator     = "/"
            replacement   = "/var/log/pods/*$1/*.log"
          }

          rule {
            source_labels = ["__meta_kubernetes_pod_container_id"]
            action        = "replace"
            target_label  = "container_runtime"
            regex         = `^(\\S+):\\/\\/.+$`
            replacement   = "$1"
          }
        }

        loki.source.kubernetes "pod_logs" {
          targets    = discovery.relabel.pod_logs.output
          forward_to = [loki.process.pod_logs.receiver]
        }

        loki.process "pod_logs" {
          stage.cri {}

          stage.static_labels {
            values = {
              cluster = "hetzner-new",
              source  = "alloy",
            }
          }

          forward_to = [loki.write.loki.receiver]
        }

        loki.source.file "node_logs" {
          targets = [
            {
              __path__ = "/var/log/k3d-entrypoints_*.log",
            },
          ]
          forward_to = [loki.process.node_logs.receiver]
          file_match {
            enabled     = true
            sync_period = "10s"
          }
        }

        loki.process "node_logs" {
          stage.regex {
            expression = "^\\[(?P<time>[^\\]]+)\\]\\s+(?P<content>.*)$"
          }

          stage.static_labels {
            values = {
              cluster   = "hetzner-new",
              source    = "alloy",
              log_type  = "node",
              job       = "node/system",
              component = "k3d-entrypoint",
            }
          }

          stage.output {
            source = "content"
          }

          forward_to = [loki.write.loki.receiver]
        }

  controller:
    type: daemonset
    tolerations:
      - operator: Exists
  serviceMonitor:
    enabled: false
