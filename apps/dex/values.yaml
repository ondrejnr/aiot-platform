dex:
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
    hosts:
      - host: dex.46.4.123.8.nip.io
        paths: [{ path: /, pathType: Prefix }]
    tls:
      - hosts: [dex.46.4.123.8.nip.io]
        secretName: dex-tls
  config:
    issuer: https://dex.46.4.123.8.nip.io
    storage:
      type: kubernetes
      config: { inCluster: true }
    enablePasswordDB: true
    staticPasswords: []
