    name: argo-workflows-controller
    namespace: flux-system
    resourceVersion: "2097618"
    uid: aace31a4-aa77-44a6-a46a-bf7f32337ff6
  spec:
    force: false
    interval: 30m
    patches:
    - patch: |
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: workflow-controller
        spec:
          template:
            spec:
              securityContext:
                seccompProfile:
                  type: RuntimeDefault
              containers:
                - name: workflow-controller
                  image: quay.io/argoproj/workflow-controller:v3.7.3
                  args:
                    - --configmap
                    - workflow-controller-configmap
                    - --executor-image
                    - quay.io/argoproj/argoexec:v3.7.3
                    - --namespaced
                  securityContext:
                    readOnlyRootFilesystem: true
                    runAsNonRoot: true
                    allowPrivilegeEscalation: false
                    capabilities:
                      drop:
                        - ALL
                  resources:
                    requests:
                      cpu: 100m
                      memory: 500Mi
      target:
        kind: Deployment
        name: workflow-controller
    - patch: |
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: workflow-controller-configmap
        data:
          artifactRepository: |
            archiveLogs: true
            s3:
              endpoint: "minio-service.kubeflow:9000"
              bucket: "mlpipeline"
              keyFormat: "private-artifacts/{{workflow.namespace}}/{{workflow.name}}/{{workflow.creationTimestamp.Y}}/{{workflow.creationTimestamp.m}}/{{workflow.creationTimestamp.d}}/{{pod.name}}"
              insecure: true
              accessKeySecret:
                name: mlpipeline-minio-artifact
                key: accesskey
              secretKeySecret:
                name: mlpipeline-minio-artifact
                key: secretkey
          executor: "imagePullPolicy: IfNotPresent\n"
      target:
        kind: ConfigMap
        name: workflow-controller-configmap
    path: ./manifests/base/workflow-controller
    prune: true
    sourceRef:
      kind: GitRepository
      name: argo-workflows
    targetNamespace: kubeflow
    wait: true
  status:
