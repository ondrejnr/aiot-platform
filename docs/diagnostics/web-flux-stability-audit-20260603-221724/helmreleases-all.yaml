            name: terrakube-dex
        - patch: |
            apiVersion: apps/v1
            kind: Deployment
            metadata:
              name: terrakube-api
              namespace: terrakube
            spec:
              template:
                spec:
                  containers:
                    - name: terrakube-api
                      resources:
                        requests:
                          cpu: 100m
                        limits:
                          cpu: 500m
