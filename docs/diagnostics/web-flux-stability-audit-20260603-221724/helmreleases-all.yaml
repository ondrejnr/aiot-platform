    labels:
      kustomize.toolkit.fluxcd.io/name: flux-system
      kustomize.toolkit.fluxcd.io/namespace: flux-system
    name: jenkins
    namespace: jenkins
    resourceVersion: "2099391"
    uid: e70b2d37-e8f7-41aa-95e1-fb75204beefc
  spec:
    chart:
      spec:
        chart: ./apps/jenkins
        reconcileStrategy: Revision
        sourceRef:
          kind: GitRepository
          name: flux-system
          namespace: flux-system
        version: '*'
    install:
      createNamespace: true
    interval: 30m
    postRenderers:
    - kustomize:
        patches:
        - patch: |-
            - op: replace
              path: /data/apply_config.sh
              value: |
                set -e
                echo "disable Setup Wizard"
                # Prevent Setup Wizard when JCasC is enabled
                echo $JENKINS_VERSION > /var/jenkins_home/jenkins.install.UpgradeWizard.state
                echo $JENKINS_VERSION > /var/jenkins_home/jenkins.install.InstallUtil.lastExecVersion
                echo "remove all plugins from shared volume"
                # remove all plugins from shared volume
                rm -rf /var/jenkins_home/plugins/*
                echo "download plugins"
                # Install missing plugins
                cp /var/jenkins_config/plugins.txt /var/jenkins_home;
                rm -rf /usr/share/jenkins/ref/plugins/*.lock
                version () { echo "$@" | awk -F. '{ printf("%d%03d%03d%03d\n", $1,$2,$3,$4); }'; }
                if [ -f "/usr/share/jenkins/jenkins.war" ] && [ -n "$(command -v jenkins-plugin-cli)" 2>/dev/null ] && [ $(version $(jenkins-plugin-cli --version)) -ge $(version "2.1.1") ]; then
                  jenkins-plugin-cli --verbose --war "/usr/share/jenkins/jenkins.war" --plugin-file "/var/jenkins_home/plugins.txt" --latest true;
                else
                  /usr/local/bin/install-plugins.sh `echo $(cat /var/jenkins_home/plugins.txt)`;
                fi
                echo "copy plugins to shared volume"
                # Copy plugins to shared volume
                rm -rf /var/jenkins_plugins/*
                cp -f /usr/share/jenkins/ref/plugins/* /var/jenkins_plugins/;
                echo "finished initialization"
          target:
            kind: ConfigMap
            name: jenkins
        - patch: |
            apiVersion: apps/v1
            kind: StatefulSet
            metadata:
              name: jenkins
              namespace: jenkins
            spec:
              template:
                spec:
                  containers:
                    - name: jenkins
                      resources:
                        requests:
                          cpu: 100m
                        limits:
                          cpu: 500m
          target:
            kind: StatefulSet
            name: jenkins
            namespace: jenkins
            version: v1
    releaseName: jenkins
    suspend: false
    upgrade:
      cleanupOnFail: true
  status:
    conditions:
    - lastTransitionTime: "2026-06-03T20:06:39Z"
