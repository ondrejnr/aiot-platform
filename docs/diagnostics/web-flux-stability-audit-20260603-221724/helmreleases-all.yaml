    namespace: flux-ui
    resourceVersion: "2098634"
    uid: 983740a6-557a-422d-9d1b-7983f2fe548e
  spec:
    chart:
      spec:
        chart: weave-gitops
        reconcileStrategy: ChartVersion
        sourceRef:
          kind: HelmRepository
          name: weave-gitops
          namespace: flux-system
        version: 4.0.36
    install:
      createNamespace: true
    interval: 30m
    postRenderers:
    - kustomize:
        patches:
        - patch: |
            - op: add
              path: /spec/template/spec/initContainers
              value:
                - name: wait-authentik
                  image: curlimages/curl:8.5.0
                  command:
                    - sh
                    - -c
                    - |
                      until curl -sk -f -o /dev/null http://authentik-server.authentik.svc.cluster.local/-/health/ready/; do
                        echo "[init] waiting for authentik..."; sleep 5;
                      done
                      until curl -sk -f -o /dev/null https://authentik.46.4.123.8.nip.io/application/o/weave-gitops/.well-known/openid-configuration; do
                        echo "[init] waiting for authentik OIDC provider..."; sleep 5;
                      done
          target:
            kind: Deployment
            name: weave-gitops
    releaseName: weave-gitops
    values:
      additionalArgs:
      - --auth-methods=oidc
      adminUser:
        create: false
      ingress:
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt-prod
          nginx.ingress.kubernetes.io/ssl-redirect: "true"
        className: nginx
        enabled: true
        hosts:
        - host: flux.46.4.123.8.nip.io
          paths:
          - path: /
            pathType: Prefix
        tls:
        - hosts:
          - flux.46.4.123.8.nip.io
          secretName: weave-gitops-tls
  status:
    conditions:
    - lastTransitionTime: "2026-06-03T13:31:32Z"
