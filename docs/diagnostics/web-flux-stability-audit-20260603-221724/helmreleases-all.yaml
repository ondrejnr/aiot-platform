  kind: HelmRelease
  metadata:
    annotations:
      reconcile.fluxcd.io/requestedAt: "2026-05-29T19:21:32.027643503+02:00"
      reconcile.fluxcd.io/resetAt: "2026-05-29T19:21:32.027643503+02:00"
