eriod = \"10s\"\n  }\n}\n\nloki.process \"node_logs\" {\n  stage.regex {\n    expression = \"^\\\\[(?P\u003ctime\u003e[^\\\\]]+)\\\\]\\\\s+(?P\u003ccontent\u003e.*)$\"\n  }\n\n  stage.static_labels {\n    values = {\n      cluster   = \"hetzner-new\",\n      source    = \"alloy\",\n      log_type  = \"node\",\n      job       = \"node/system\",\n      component = \"k3d-entrypoint\",\n    }\n  }\n\n  stage.output {\n    source = \"content\"\n  }\n\n  forward_to = [loki.write.loki.receiver]\n}"},"kind":"ConfigMap","metadata":{"annotations":{"meta.helm.sh/release-name":"alloy","meta.helm.sh/release-namespace":"observability-logs"},"creationTimestamp":"2026-05-29T17:21:43Z","labels":{"app.kubernetes.io/component":"config","app.kubernetes.io/instance":"alloy","app.kubernetes.io/managed-by":"Helm","app.kubernetes.io/name":"alloy","app.kubernetes.io/part-of":"alloy","app.kubernetes.io/version":"v1.16.1","helm.sh/chart":"alloy-1.8.1","helm.toolkit.fluxcd.io/name":"alloy","helm.toolkit.fluxcd.io/namespace":"observability-logs"},"name":"alloy","namespace":"observability-logs","resourceVersion":"2045321","uid":"dd738354-3567-4acd-88cb-09d2820987a9"}}
