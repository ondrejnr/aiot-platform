apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: awx-authentik-sso
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 3m
  prune: false
  wait: true
  sourceRef:
    kind: GitRepository
    name: argo-workflows
  path: ./clusters/main/awx-authentik-sso
