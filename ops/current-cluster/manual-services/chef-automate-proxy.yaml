# chef-automate Kubernetes proxy
# Snapshot generated from the live hetzner-new cluster. Do not apply blindly; secrets are intentionally omitted.
---
apiVersion: v1
kind: Namespace
metadata:
  labels:
    kubernetes.io/metadata.name: chef
  name: chef
spec:
  finalizers:
  - kubernetes

---
apiVersion: v1
kind: Service
metadata:
  name: chef-automate
  namespace: chef
spec:
  ports:
  - name: https
    port: 443
    protocol: TCP
    targetPort: 443
  sessionAffinity: None
  type: ClusterIP

---
apiVersion: v1
kind: Endpoints
metadata:
  name: chef-automate
  namespace: chef
subsets:
- addresses:
  - ip: 172.18.0.9
  ports:
  - name: https
    port: 443
    protocol: TCP

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/backend-protocol: HTTPS
    nginx.ingress.kubernetes.io/proxy-body-size: '0'
    nginx.ingress.kubernetes.io/proxy-read-timeout: '600'
    nginx.ingress.kubernetes.io/proxy-send-timeout: '600'
    nginx.ingress.kubernetes.io/proxy-ssl-verify: 'off'
  name: chef-automate
  namespace: chef
spec:
  ingressClassName: nginx
  rules:
  - host: chef.46.4.123.8.nip.io
    http:
      paths:
      - backend:
          service:
            name: chef-automate
            port:
              number: 443
        path: /
        pathType: Prefix
  tls:
  - hosts:
    - chef.46.4.123.8.nip.io
    secretName: chef-tls
