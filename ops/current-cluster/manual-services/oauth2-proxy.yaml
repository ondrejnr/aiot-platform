# oauth2-proxy (manual service)
#
# Snapshot generated from the live hetzner-new cluster. NOT applied by Flux.
# Secrets are intentionally omitted/masked. Do not apply blindly.
#
# Purpose: forward-auth gateway used by nginx-ingress `auth-url`/`auth-signin`
# annotations to put Authentik SSO in front of apps that have no native OIDC
# (currently: chef-automate, cloudbeaver, aiot-chaos-theater).
#
# Login flow:
#   app.46.4.123.8.nip.io
#     -> nginx ingress (auth-url -> oauth2-proxy /oauth2/auth)
#     -> 401 -> auth-signin -> oauth2-proxy /oauth2/start
#     -> Authentik (OIDC authorization_code)
#     -> oauth2-proxy /oauth2/callback (sets _AUTH cookie)
#     -> back to the app
#
# Two pitfalls that broke this (see TROUBLESHOOTING at the bottom):
#   1. oauth2-proxy `provider` was unset -> it defaults to "google", so it
#      redirected to accounts.google.com with client_id=oauth2-proxy and Google
#      returned "401 invalid_client / The OAuth client was not found".
#      Fix: set `provider = "oidc"` in the config.
#   2. The Authentik OAuth2 provider "oauth2-proxy" had an EMPTY grant_types
#      list, so Authentik rejected the authorization_code flow with
#      "invalid_request / The request is otherwise malformed"
#      (log: "Invalid grant_type for provider"). Authentik added a configurable
#      grant_types field (goauthentik/authentik#20363); providers created before
#      that can end up with [].  Fix: include "authorization_code".
---
apiVersion: v1
kind: Namespace
metadata:
  name: oauth2-proxy
---
# ConfigMap data key: oauth2-proxy.cfg
# Secrets (cookie_secret, client_secret) are masked here on purpose.
apiVersion: v1
kind: ConfigMap
metadata:
  name: oauth2-proxy-config
  namespace: oauth2-proxy
data:
  oauth2-proxy.cfg: |
    http_address = "0.0.0.0:4180"
    reverse_proxy = true
    cookie_secure = false
    cookie_name = "_AUTH"
    cookie_secret = "***MASKED***"
    cookie_expire = "168h"
    oidc_issuer_url = "https://authentik.46.4.123.8.nip.io/application/o/oauth2-proxy/"
    provider = "oidc"          # REQUIRED: without this oauth2-proxy defaults to Google
    client_id = "oauth2-proxy"
    client_secret = "***MASKED***"
    redirect_url = "https://oauth2-proxy.46.4.123.8.nip.io/oauth2/callback"
    insecure_oidc_allow_unverified_email = true   # Authentik users (e.g. admin@localhost) have email_verified=false
    cookie_domains = [".46.4.123.8.nip.io"]       # REQUIRED: share the _AUTH cookie across all *.nip.io apps
    email_domains = ["*"]
    whitelist_domains = [".46.4.123.8.nip.io"]
    set_xauthrequest = true
    pass_user_headers = true
    pass_access_token = true
    pass_authorization_header = true
---
apiVersion: v1
kind: Secret
metadata:
  name: oauth2-proxy
  namespace: oauth2-proxy
type: Opaque
# data omitted on purpose (cookie secret / client secret live only in-cluster)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy
  namespace: oauth2-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oauth2-proxy
  template:
    metadata:
      labels:
        app: oauth2-proxy
    spec:
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.7.0
          args:
            # NOTE: live deployment runs with explicit CLI flags (not the configmap
            # below). Keep this list in sync with the running pod.
            - "--http-address=0.0.0.0:4180"
            - "--provider=oidc"
            - "--oidc-issuer-url=https://authentik.46.4.123.8.nip.io/application/o/oauth2-proxy/"
            - "--client-id=oauth2-proxy"
            - "--client-secret=***MASKED***"
            - "--redirect-url=https://oauth2-proxy.46.4.123.8.nip.io/oauth2/callback"
            - "--email-domain=*"
            - "--cookie-secret=***MASKED***"
            - "--cookie-name=_AUTH"
            - "--cookie-domain=.46.4.123.8.nip.io"
            - "--cookie-secure=false"   # REQUIRED: ingress-nginx terminates TLS, oauth2-proxy sees HTTP -> without this the _AUTH cookie is set Secure and the browser drops it on the HTTPS app -> redirect loop
            - "--whitelist-domain=.46.4.123.8.nip.io"
            - "--set-xauthrequest=true"
            - "--pass-user-headers=true"
            - "--pass-access-token=true"
            - "--insecure-oidc-allow-unverified-email=true"
            - "--insecure-oidc-skip-issuer-verification=true"
            - "--reverse-proxy=true"
            - "--upstream=file:///dev/null"
            - "--scope=openid profile email groups"
          ports:
            - containerPort: 4180
          volumeMounts:
            - name: config
              mountPath: /etc/oauth2-proxy
      volumes:
        - name: config
          configMap:
            name: oauth2-proxy-config
---
apiVersion: v1
kind: Service
metadata:
  name: oauth2-proxy
  namespace: oauth2-proxy
spec:
  selector:
    app: oauth2-proxy
  ports:
    - port: 4180
      targetPort: 4180
---
# oauth2-proxy's own ingress (the auth endpoint the other ingresses point to)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: oauth2-proxy
  namespace: oauth2-proxy
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  rules:
    - host: oauth2-proxy.46.4.123.8.nip.io
      http:
        paths:
          - path: /oauth2
            pathType: Prefix
            backend:
              service:
                name: oauth2-proxy
                port:
                  number: 4180
---
# How a PROTECTED app opts in (example: chef-automate). Add these annotations to
# the protected app's own Ingress:
#
#   nginx.ingress.kubernetes.io/auth-url: https://oauth2-proxy.46.4.123.8.nip.io/oauth2/auth
#   nginx.ingress.kubernetes.io/auth-signin: https://oauth2-proxy.46.4.123.8.nip.io/oauth2/start?rd=$scheme://$host$request_uri
#
# Apps currently protected by oauth2-proxy:
#   - chef/chef-automate            (chef.46.4.123.8.nip.io)
#   - aiot/cloudbeaver              (cloudbeaver.46.4.123.8.nip.io)
#   - chaos-theater/aiot-chaos-theater (chaos-theater.46.4.123.8.nip.io)
#
# ---------------------------------------------------------------------------
# TROUBLESHOOTING
# ---------------------------------------------------------------------------
# Symptom: clicking a protected app shows Google "Access blocked: Authorization
#   Error / The OAuth client was not found / Error 401: invalid_client" with
#   client_id=oauth2-proxy on accounts.google.com.
#   Cause: `provider` not set in oauth2-proxy.cfg -> defaults to "google".
#   Verify: `kubectl logs deploy/oauth2-proxy -n oauth2-proxy | grep configured`
#     bad : "OAuthProxy configured for Google Client ID: oauth2-proxy"
#     good: "OAuthProxy configured for OpenID Connect Client ID: oauth2-proxy"
#   Fix : add `provider = "oidc"`, recreate the configmap, restart the deploy.
#
# Symptom: after fixing provider, Authentik bounces back to /oauth2/callback
#   with error=invalid_request&error_description=The%20request%20is%20otherwise
#   %20malformed. Authentik log: "Invalid grant_type for provider".
#   Cause: the Authentik OAuth2 provider has grant_types = [].
#   Fix (Authentik shell):
#     kubectl exec -n authentik deploy/authentik-worker -- ak shell -c "
#     from authentik.providers.oauth2.models import OAuth2Provider
#     p = OAuth2Provider.objects.get(client_id='oauth2-proxy')
#     p.grant_types = ['authorization_code', 'refresh_token']; p.save()"
#   Or in the UI: Providers -> oauth2-proxy -> Advanced protocol settings ->
#   Allowed grant types -> enable Authorization Code (+ Refresh Token).
#
# Symptom: token exchange succeeds but the callback returns HTTP 500 and the
#   oauth2-proxy log says: "email in id_token (admin@localhost) isn't verified".
#   Cause: oauth2-proxy rejects id_tokens whose email_verified claim is not true;
#   Authentik's built-in admin (admin@localhost) is not email-verified.
#   Fix : add `insecure_oidc_allow_unverified_email = true` to oauth2-proxy.cfg
#   (or mark the user's email as verified in Authentik).
#
# Symptom: login succeeds (log shows [AuthSuccess] Authenticated via OAuth2)
#   but the browser bounces in a redirect loop: /oauth2/callback -> app ->
#   /oauth2/auth 401 -> /oauth2/start -> login -> repeat, and the app never
#   loads.
#   Cause: the _AUTH cookie is scoped to oauth2-proxy.46.4.123.8.nip.io only, so
#   the browser never sends it to chef.46.4.123.8.nip.io. The startup log shows
#   "Cookie settings: ... domains:" with an EMPTY domains field.
#   Fix : set `cookie_domains = [".46.4.123.8.nip.io"]` so the cookie is shared
#   across every *.46.4.123.8.nip.io app behind this proxy. The log should then
#   show "domains:.46.4.123.8.nip.io".
#
# Symptom: same redirect loop as above (login succeeds, app never loads, browser
#   cycles /oauth2/callback -> app -> /oauth2/auth 401 -> /oauth2/start), BUT the
#   startup log shows "domains:.46.4.123.8.nip.io" correctly. The cookie is set
#   but the browser still never sends it back.
#   Cause: oauth2-proxy sets the _AUTH cookie with the `Secure` flag (default when
#   it thinks the request is HTTPS). ingress-nginx terminates TLS and forwards
#   plain HTTP to oauth2-proxy, so the Set-Cookie arrives over HTTP. A Secure
#   cookie delivered over HTTP is dropped by the browser, so on the next request
#   to the HTTPS app the cookie is absent -> /oauth2/auth returns 401 -> loop.
#   Verify: `kubectl logs deploy/oauth2-proxy | grep "Cookie settings"` ->
#     bad : "secure(https):true"
#     good: "secure(https):false"
#   Fix : add `--cookie-secure=false` (or `cookie_secure = false` in the cfg).
#
# Symptom: callback fails with "invalid_client / Client authentication failed".
#   Cause: the client_secret in oauth2-proxy.cfg does not match the Authentik
#   provider's client_secret.
#   Fix : sync them (Authentik shell):
#     kubectl exec -n authentik deploy/authentik-worker -- ak shell -c "
#     from authentik.providers.oauth2.models import OAuth2Provider
#     print(OAuth2Provider.objects.get(client_id='oauth2-proxy').client_secret)"
#   then make oauth2-proxy.cfg client_secret match (or update Authentik to match).
