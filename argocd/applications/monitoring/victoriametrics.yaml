apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: victoriametrics
  namespace: argocd
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: monitoring
  source:
    repoURL: https://github.com/ondrejnr/aiot-platform.git
    targetRevision: main
    path: apps/victoriametrics
    helm:
      valueFiles: [values.yaml]
  destination:
    server: https://kubernetes.default.svc
    namespace: victoriametrics
  ignoreDifferences:
    - kind: Secret
      namespace: victoriametrics
      name: victoriametrics-grafana
      jsonPointers:
        - /data
    - kind: Secret
      namespace: victoriametrics
      name: victoriametrics-victoria-metrics-operator-validation
      jsonPointers:
        - /data
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      name: victoriametrics-victoria-metrics-operator-admission
      jqPathExpressions:
        - .webhooks[].clientConfig.caBundle
    - group: apps
      kind: Deployment
      namespace: victoriametrics
      name: victoriametrics-grafana
      jsonPointers:
        - /spec/template/metadata/annotations
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff: { duration: 30s, factor: 2, maxDuration: 5m }
