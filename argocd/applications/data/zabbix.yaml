apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zabbix
  namespace: argocd
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: data
  source:
    repoURL: https://github.com/ondrejnr/aiot-platform.git
    targetRevision: main
    path: apps/zabbix
    helm:
      valueFiles: [values.yaml]
      values: |
        zabbix:
          zabbixImageTag: alpine-7.0-latest
          postgresAccess:
            host: pg-cluster-rw.databases.svc.cluster.local
            port: "5432"
            user: zabbix
            password: "e982317cfac9d8d8208183a8fd037e56"
            database: zabbix
            schema: public
          postgresql:
            enabled: false
          zabbixServer:
            extraEnv:
              - name: ZBX_VALUECACHESIZE
                value: "256M"
              - name: ZBX_HISTORYCACHESIZE
                value: "64M"
              - name: ZBX_TRENDCACHESIZE
                value: "32M"
              - name: ZBX_HISTORYINDEXCACHESIZE
                value: "32M"
          zabbixWeb:
            samlCertsSecretName: zabbix-saml-certs
            extraEnv:
              - name: ZBX_SSO_SETTINGS
                value: >-
                  {"strict": false, "baseurl": "https://zabbix.46.4.123.8.nip.io/", "use_proxy_headers": true}
            ingress:
              enabled: true
              ingressClassName: nginx
              annotations:
                cert-manager.io/cluster-issuer: letsencrypt-prod
                nginx.ingress.kubernetes.io/ssl-redirect: "true"
              hosts:
                - host: zabbix.46.4.123.8.nip.io
                  paths:
                    - path: /
                      pathType: Prefix
              tls:
                - hosts: [zabbix.46.4.123.8.nip.io]
                  secretName: zabbix-tls
  destination:
    server: https://kubernetes.default.svc
    namespace: zabbix
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff: { duration: 30s, factor: 2, maxDuration: 5m }
