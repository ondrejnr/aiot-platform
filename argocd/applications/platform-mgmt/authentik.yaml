apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: authentik
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    namespace: authentik
    server: https://kubernetes.default.svc
  source:
    chart: authentik
    repoURL: https://charts.goauthentik.io
    targetRevision: 2025.10.0
    helm:
      releaseName: authentik
      values: |
        global:
          envFrom:
          - secretRef:
              name: authentik-bootstrap
        server:
          ingress:
            enabled: true
            ingressClassName: nginx
            annotations:
              cert-manager.io/cluster-issuer: letsencrypt-prod
              nginx.ingress.kubernetes.io/ssl-redirect: "true"
            annotations:
              cert-manager.io/cluster-issuer: letsencrypt-prod
              nginx.ingress.kubernetes.io/ssl-redirect: "true"
            annotations:
              cert-manager.io/cluster-issuer: letsencrypt-prod
              nginx.ingress.kubernetes.io/ssl-redirect: "true"
            hosts:
            - authentik.46.4.123.8.nip.io
            paths:
            - "/"
            pathType: Prefix
            tls:
            - hosts:
              - authentik.46.4.123.8.nip.io
              secretName: authentik-tls
        worker:
          replicas: 1
        authentik:
          error_reporting:
            enabled: false
          postgresql:
            host: pg-cluster-rw.databases.svc.cluster.local
            port: 5432
            name: authentik
            user: authentik
            password: "2378c95ddc619e94ff89082a7df31a94"
        postgresql:
          enabled: false
        redis:
          enabled: true
          architecture: standalone
          auth:
            enabled: false
          # IO storm mitigation: cache only, no persistence
          commonConfiguration: |-
            appendonly no
            save ""
          master:
            persistence:
              enabled: false
            # IO storm tolerance: cluster runs on IO-saturated host
            livenessProbe:
              timeoutSeconds: 30
              periodSeconds: 30
              failureThreshold: 15
              initialDelaySeconds: 30
            readinessProbe:
              timeoutSeconds: 30
              periodSeconds: 30
              failureThreshold: 15
              initialDelaySeconds: 30
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
