apiVersion: apps/v1
kind: Deployment
metadata:
  name: qdrant-indexer
  namespace: aiot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qdrant-indexer
  template:
    metadata:
      labels:
        app: qdrant-indexer
      annotations:
        instrumentation.opentelemetry.io/inject-python: "true"
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - aiot-worker-02
      nodeSelector:
        node-role.kubernetes.io/worker: ""
      initContainers:
        - name: wait-qdrant
          image: busybox:1.36
          command:
            - sh
            - -c
            - >-
              until wget -q -O- http://qdrant.qdrant.svc.cluster.local:6333/readyz 2>/dev/null | grep -qi ready;
              do echo waiting for qdrant; sleep 3; done; echo qdrant ready
      containers:
        - name: qdrant-indexer
          image: python:3.11-slim
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - pip install --no-cache-dir --quiet paho-mqtt qdrant-client && python /code/indexer.py
          env:
            - name: MQTT_HOST
              value: aiot-emqx
            - name: MQTT_PORT
              value: "1883"
            - name: MQTT_TOPIC
              value: aiot/sensors/#
            - name: QDRANT_HOST
              value: qdrant.qdrant.svc.cluster.local
            - name: QDRANT_PORT
              value: "6333"
            - name: QDRANT_COLLECTION
              value: sensor_history
          ports:
            - containerPort: 8000
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
          volumeMounts:
            - name: code
              mountPath: /code
      volumes:
        - name: code
          configMap:
            name: qdrant-indexer-code
