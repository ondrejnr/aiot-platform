apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoriametrics
  namespace: victoriametrics
spec:
  suspend: false
  interval: 30m
  releaseName: victoriametrics
  chart:
    spec:
      chart: ./apps/victoriametrics
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  install:
    createNamespace: true
  upgrade:
    cleanupOnFail: true
  # Inline values take precedence and are always re-applied on reconcile,
  # avoiding the cached-chart issue with reconcileStrategy: Revision.
  values:
    victoria-metrics-k8s-stack:
      vmsingle:
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 800m
            memory: 1500Mi
