apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoriametrics
  namespace: victoriametrics
spec:
  suspend: false
  interval: 30m
  releaseName: victoriametrics
  chart:
    spec:
      chart: ./apps/victoriametrics
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  install:
    createNamespace: true
  upgrade:
    cleanupOnFail: true
  postRenderers:
  - kustomize:
      patches:
      - target:
          group: apps
          version: v1
          kind: Deployment
          name: vmsingle-victoriametrics-victoria-metrics-k8s-stack
          namespace: victoriametrics
        patch: "apiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: vmsingle-victoriametrics-victoria-metrics-k8s-stack\n  namespace: victoriametrics\nspec:\n  template:\n    spec:\n      containers:\n        - name: vmsingle\n          resources:\n            requests:\n              cpu: 500m\n            limits:\n              cpu: 800m\n"
