apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoriametrics
  namespace: victoriametrics
spec:
  suspend: false
  interval: 30m
  releaseName: victoriametrics
  chart:
    spec:
      chart: ./apps/victoriametrics
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  install:
    createNamespace: true
  upgrade:
    cleanupOnFail: true
  postRenderers:
  - kustomize:
      patches:
      - target:
          group: operator.victoriametrics.com
          version: v1beta1
          kind: VMSingle
          name: victoriametrics-victoria-metrics-k8s-stack
          namespace: victoriametrics
        patch: "apiVersion: operator.victoriametrics.com/v1beta1\nkind: VMSingle\nmetadata:\n  name: victoriametrics-victoria-metrics-k8s-stack\n  namespace: victoriametrics\nspec:\n  resources:\n    requests:\n      cpu: 500m\n      memory: 1Gi\n    limits:\n      cpu: 800m\n      memory: 1500Mi\n"
