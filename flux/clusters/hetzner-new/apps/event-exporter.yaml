---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: event-exporter
  namespace: event-exporter
spec:
  suspend: true
  interval: 30m
  releaseName: event-exporter
  chart:
    spec:
      chart: ./apps/event-exporter
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  install:
    createNamespace: true
  upgrade:
    cleanupOnFail: true
