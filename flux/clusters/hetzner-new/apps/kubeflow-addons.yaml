---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: kubeflow-manifests
  namespace: flux-system
spec:
  interval: 30m
  url: https://github.com/kubeflow/manifests.git
  ref:
    tag: v1.11.0
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: kubeflow-katib
  namespace: flux-system
spec:
  interval: 30m
  url: https://github.com/kubeflow/katib.git
  ref:
    tag: v0.17.0
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kubeflow-roles
  namespace: flux-system
spec:
  interval: 30m
  timeout: 10m
  path: ./common/kubeflow-roles/base
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: kubeflow-manifests
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kubeflow-profiles
  namespace: flux-system
spec:
  interval: 30m
  timeout: 10m
  path: ./flux/clusters/hetzner-new/kubeflow-profiles
  prune: true
  wait: true
  dependsOn:
    - name: kubeflow-authz-crd
    - name: kubeflow-roles
  sourceRef:
    kind: GitRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kubeflow-authz-crd
  namespace: flux-system
spec:
  interval: 30m
  timeout: 10m
  path: ./flux/clusters/hetzner-new/kubeflow-authz-crd
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kubeflow-admission-webhook
  namespace: flux-system
spec:
  interval: 30m
  timeout: 10m
  path: ./applications/admission-webhook/upstream/overlays/cert-manager
  prune: true
  wait: true
  dependsOn:
    - name: kubeflow-roles
  sourceRef:
    kind: GitRepository
    name: kubeflow-manifests
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kubeflow-notebook-controller
  namespace: flux-system
spec:
  interval: 30m
  timeout: 10m
  path: ./applications/jupyter/notebook-controller/upstream/overlays/standalone
  prune: true
  wait: true
  dependsOn:
    - name: kubeflow-roles
  sourceRef:
    kind: GitRepository
    name: kubeflow-manifests
