---
apiVersion: v1
kind: Namespace
metadata:
  name: blackbox-exporter
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: blackbox-exporter
  namespace: blackbox-exporter
spec:
  suspend: false
  interval: 30m
  releaseName: blackbox-exporter
  chart:
    spec:
      chart: ./apps/blackbox-exporter
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  install:
    createNamespace: true
  upgrade:
    cleanupOnFail: true
