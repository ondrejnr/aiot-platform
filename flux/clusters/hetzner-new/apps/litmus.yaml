---
apiVersion: v1
kind: Namespace
metadata:
  name: litmus
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: litmuschaos
  namespace: flux-system
spec:
  interval: 12h
  url: https://litmuschaos.github.io/litmus-helm/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: chaos
  namespace: litmus
spec:
  interval: 30m
  releaseName: chaos
  timeout: 20m
  chart:
    spec:
      chart: litmus
      version: "3.28.0"
      sourceRef:
        kind: HelmRepository
        name: litmuschaos
        namespace: flux-system
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    existingSecret: litmus-admin-auth
    ingress:
      enabled: true
      name: litmus-ingress
      ingressClassName: nginx
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
        nginx.ingress.kubernetes.io/ssl-redirect: "true"
        nginx.ingress.kubernetes.io/proxy-body-size: "0"
      host:
        name: litmus.46.4.123.8.nip.io
        frontend:
          path: /
          pathType: Prefix
      tls:
        - secretName: litmus-tls
          hosts:
            - litmus.46.4.123.8.nip.io
    portal:
      server:
        graphqlServer:
          genericEnv:
            CHAOS_CENTER_UI_ENDPOINT: https://litmus.46.4.123.8.nip.io
    mongodb:
      enabled: true
      auth:
        existingSecret: litmus-mongodb-auth
      architecture: replicaset
      replicaCount: 3
      persistence:
        enabled: true
        storageClass: local-path
        size: 20Gi
      volumePermissions:
        enabled: true
