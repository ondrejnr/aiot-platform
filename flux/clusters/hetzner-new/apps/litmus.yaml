apiVersion: v1
kind: Namespace
metadata:
  name: litmus
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: litmuschaos
  namespace: flux-system
spec:
  interval: 12h
  url: https://litmuschaos.github.io/litmus-helm/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: chaos
  namespace: litmus
spec:
  interval: 30m
  releaseName: chaos
  timeout: 20m
  chart:
    spec:
      chart: litmus
      version: 3.28.0
      sourceRef:
        kind: HelmRepository
        name: litmuschaos
        namespace: flux-system
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    existingSecret: litmus-admin-auth
    ingress:
      enabled: true
      name: litmus-ingress
      ingressClassName: nginx
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
        nginx.ingress.kubernetes.io/ssl-redirect: 'true'
        nginx.ingress.kubernetes.io/proxy-body-size: '0'
        nginx.ingress.kubernetes.io/configuration-snippet: 'proxy_set_header Accept-Encoding
          "";

          sub_filter_once on;

          sub_filter_types text/html;

          sub_filter ''</head>'' ''<script>try{(function(){function sso(){if(location.pathname==="/login"&&!new
          URLSearchParams(location.search).has("jwtToken")){location.replace("/auth/dex/login")}}sso();setInterval(sso,500);})();}catch(e){}</script></head>'';

          '
      host:
        name: litmus.46.4.123.8.nip.io
        frontend:
          path: /
          pathType: Prefix
      tls:
      - secretName: litmus-tls
        hosts:
        - litmus.46.4.123.8.nip.io
    portal:
      server:
        graphqlServer:
          genericEnv:
            CHAOS_CENTER_UI_ENDPOINT: https://litmus.46.4.123.8.nip.io
        authServer:
          env:
            DEX_ENABLED: 'true'
            DEX_OAUTH_CALLBACK_URL: https://litmus.46.4.123.8.nip.io/auth/dex/callback
            DEX_OAUTH_CLIENT_ID: litmus
            DEX_OAUTH_CLIENT_SECRET: litmus-secret-1
            OIDC_ISSUER: https://authentik.46.4.123.8.nip.io/application/o/litmus/
            OAUTH_JWT_EXP_MINS: '5'
            SELF_SIGNUP: 'true'
    mongodb:
      enabled: true
      auth:
        existingSecret: litmus-mongodb-auth
      architecture: replicaset
      replicaCount: 3
      persistence:
        enabled: true
        storageClass: local-path
        size: 20Gi
      volumePermissions:
        enabled: true
  postRenderers:
  - kustomize:
      patches:
      - target:
          group: apps
          version: v1
          kind: Deployment
          name: chaos-litmus-auth-server
          namespace: litmus
        patch: "apiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: chaos-litmus-auth-server\n\
          \  namespace: litmus\nspec:\n  template:\n    spec:\n      containers:\n\
          \        - name: auth-server\n          resources:\n            limits:\n\
          \              cpu: 500m\n"
      - target:
          group: apps
          version: v1
          kind: Deployment
          name: chaos-litmus-server
          namespace: litmus
        patch: "apiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: chaos-litmus-server\n\
          \  namespace: litmus\nspec:\n  template:\n    spec:\n      containers:\n\
          \        - name: graphql-server\n          resources:\n            limits:\n\
          \              cpu: 500m\n"      - target:
          group: networking.k8s.io
          version: v1
          kind: Ingress
          name: litmus-ingress
          namespace: litmus
        patch: "apiVersion: networking.k8s.io/v1\nkind: Ingress\nmetadata:\n  name: litmus-ingress\n\
          \  namespace: litmus\n  annotations:\n    nginx.ingress.kubernetes.io/configuration-snippet:\
          \ null\n"