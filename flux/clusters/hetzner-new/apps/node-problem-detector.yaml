---
apiVersion: v1
kind: Namespace
metadata:
  name: node-problem-detector
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: node-problem-detector
  namespace: node-problem-detector
spec:
  suspend: false
  interval: 30m
  releaseName: node-problem-detector
  chart:
    spec:
      chart: ./apps/node-problem-detector
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  install:
    createNamespace: true
  upgrade:
    cleanupOnFail: true
