---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: cert-manager-controller
  namespace: flux-system
spec:
  image: quay.io/jetstack/cert-manager-controller
  interval: 5m0s
  exclusionList:
    - '.*-rc.*$'
    - '.*-beta.*$'
    - '.*-alpha.*$'
    - '^latest$'
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: cert-manager-controller-stable
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: cert-manager-controller
  policy:
    semver:
      range: '>=1.16.0-0 <2.0.0-0'
  filterTags:
    pattern: '^v1\.\d+\.\d+$'
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageUpdateAutomation
metadata:
  name: cert-manager-controller-auto-update
  namespace: flux-system
spec:
  interval: 10m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  git:
    checkout:
      ref:
        branch: main
    commit:
      author:
        email: flux-bot@local.domain
        name: flux-bot
      messageTemplate: 'chore(cert-manager): update controller image'
    push:
      branch: main
  update:
    path: ./apps/cert-manager/values.yaml
    strategy: Setters