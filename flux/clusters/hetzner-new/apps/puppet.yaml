---
apiVersion: v1
kind: Namespace
metadata:
  name: puppet
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: puppet
  namespace: puppet
spec:
  suspend: false
  interval: 30m
  releaseName: puppet
  chart:
    spec:
      chart: ./apps/puppet
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  install:
    createNamespace: true
    crds: CreateReplace
  upgrade:
    cleanupOnFail: true
    crds: CreateReplace
