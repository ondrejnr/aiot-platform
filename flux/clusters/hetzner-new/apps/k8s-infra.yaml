---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: k8s-infra
  namespace: signoz
spec:
  suspend: true
  interval: 30m
  releaseName: k8s-infra
  chart:
    spec:
      chart: ./apps/k8s-infra
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  install:
    createNamespace: true
  upgrade:
    cleanupOnFail: true
