---
# OIDC admin pristup pre prihlasenych cez authentik (Weave UI -> cluster resources)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: weave-oidc-admins
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: authentik Admins
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: admin@example.com
---
# Read pristup pre weave-gitops service account na Flux CR (Applications/Sources)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: weave-gitops-flux-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: weave-gitops
    namespace: flux-ui
