---
apiVersion: v1
kind: Namespace
metadata:
  name: flux-ui
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: weave-gitops
  namespace: flux-system
spec:
  type: oci
  interval: 12h
  url: oci://ghcr.io/weaveworks/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: weave-gitops
  namespace: flux-ui
spec:
  interval: 30m
  releaseName: weave-gitops
  chart:
    spec:
      chart: weave-gitops
      version: "4.0.36"
      sourceRef:
        kind: HelmRepository
        name: weave-gitops
        namespace: flux-system
  install:
    createNamespace: true
  values:
    adminUser:
      create: false
    additionalArgs:
      - --auth-methods=oidc
      - --insecure
    ingress:
      enabled: true
      className: nginx
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
        nginx.ingress.kubernetes.io/ssl-redirect: "true"
      hosts:
        - host: flux.46.4.123.8.nip.io
          paths:
            - path: /
              pathType: Prefix
      tls:
        - hosts: [flux.46.4.123.8.nip.io]
          secretName: weave-gitops-tls
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: weave-gitops
            patch: |
              - op: add
                path: /spec/template/spec/initContainers
                value:
                  - name: wait-authentik
                    image: curlimages/curl:8.5.0
                    command:
                      - sh
                      - -c
                      - |
                        until curl -sk -f -o /dev/null http://authentik-server.authentik.svc.cluster.local/-/health/ready/; do
                          echo "[init] waiting for authentik..."; sleep 5;
                        done
                        until curl -sk -f -o /dev/null https://authentik.46.4.123.8.nip.io/application/o/weave-gitops/.well-known/openid-configuration; do
                          echo "[init] waiting for authentik OIDC provider..."; sleep 5;
                        done
---
# OIDC konfiguracia (chart default secret name = oidc-auth). Plaintext: interny nip.io homelab.
apiVersion: v1
kind: Secret
metadata:
  name: oidc-auth
  namespace: flux-ui
type: Opaque
stringData:
  issuerURL: https://authentik.46.4.123.8.nip.io/application/o/weave-gitops/
  clientID: weave-gitops
  clientSecret: wsec
  redirectURL: https://flux.46.4.123.8.nip.io/oauth2/callback
