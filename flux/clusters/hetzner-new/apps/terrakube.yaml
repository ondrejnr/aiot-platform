---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: terrakube
  namespace: terrakube
spec:
  suspend: false
  interval: 30m
  releaseName: terrakube
  chart:
    spec:
      chart: ./apps/terrakube
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  install:
    createNamespace: true
    timeout: 5m
    disableWait: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    timeout: 5m
    disableWait: true
    remediation:
      retries: 3
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: terrakube-dex
            patch: |
              - op: add
                path: /spec/template/spec/initContainers
                value:
                  - name: wait-authentik
                    image: curlimages/curl:8.5.0
                    command:
                      - sh
                      - -c
                      - |
                        until curl -sk -f -o /dev/null http://authentik-server.authentik.svc.cluster.local/-/health/ready/; do
                          echo "[init] waiting for authentik..."; sleep 5;
                        done
                        until curl -sk -f -o /dev/null https://authentik.46.4.123.8.nip.io/application/o/terrakube/.well-known/openid-configuration; do
                          echo "[init] waiting for authentik OIDC provider..."; sleep 5;
                        done
