apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: terrakube
  namespace: terrakube
spec:
  suspend: false
  interval: 30m
  releaseName: terrakube
  chart:
    spec:
      chart: ./apps/terrakube
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  install:
    createNamespace: true
    timeout: 5m
    disableWait: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    timeout: 5m
    disableWait: true
    remediation:
      retries: 3
  postRenderers:
  - kustomize:
      patches:
      - target:
          kind: Deployment
          name: terrakube-dex
        patch: "- op: add\n  path: /spec/template/spec/initContainers\n  value:\n\
          \    - name: wait-authentik\n      image: curlimages/curl:8.5.0\n      command:\n\
          \        - sh\n        - -c\n        - |\n          until curl -sk -f -o\
          \ /dev/null http://authentik-server.authentik.svc.cluster.local/-/health/ready/;\
          \ do\n            echo \"[init] waiting for authentik...\"; sleep 5;\n \
          \         done\n          until curl -sk -f -o /dev/null https://authentik.46.4.123.8.nip.io/application/o/terrakube/.well-known/openid-configuration;\
          \ do\n            echo \"[init] waiting for authentik OIDC provider...\"\
          ; sleep 5;\n          done\n"
      - target:
          version: v1
          kind: Deployment
          name: terrakube-api
          namespace: terrakube
        patch: "apiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: terrakube-api\n\
          \  namespace: terrakube\nspec:\n  template:\n    spec:\n      containers:\n\
          \        - name: terrakube-api\n          resources:\n            requests:\n\
          \              cpu: 100m\n            limits:\n              cpu: 500m\n"
      - target:
          version: v1
          kind: Deployment
          name: terrakube-executor
          namespace: terrakube
        patch: "apiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: terrakube-executor\n\
          \  namespace: terrakube\nspec:\n  template:\n    spec:\n      containers:\n\
          \        - name: terrakube-executor\n          resources:\n            requests:\n\
          \              cpu: 100m\n            limits:\n              cpu: 500m\n"
      - target:
          version: v1
          kind: Deployment
          name: terrakube-minio
          namespace: terrakube
        patch: "apiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: terrakube-minio\n\
          \  namespace: terrakube\nspec:\n  template:\n    spec:\n      containers:\n\
          \        - name: minio\n          resources:\n            requests:\n  \
          \            cpu: 50m\n            limits:\n              cpu: 200m\n"
      - target:
          version: v1
          kind: Deployment
          name: terrakube-registry
          namespace: terrakube
        patch: "apiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: terrakube-registry\n\
          \  namespace: terrakube\nspec:\n  template:\n    spec:\n      containers:\n\
          \        - name: terrakube-registry\n          resources:\n            requests:\n\
          \              cpu: 50m\n            limits:\n              cpu: 200m\n"
  # Explicitné hodnoty – zaisťujú, že UI secret (terrakube-ui-secrets) vždy
  # vygeneruje REACT_APP_TERRAKUBE_API_URL s príponou /api/v1/.
  # Bez nej UI volá relatívne cesty (organization/...) priamo na koreň API hostu
  # (https://terrakube-api.../organization/...), čo API neobsluhuje (Elide je pod
  # /api/v1) → 404 "The requested resource could not be found." na Settings → General.
  # Upstream chart (terrakube 4.6.3) túto príponu pridáva automaticky cez
  # ingress.api.domain, tu ju len explicitne zrkadlíme, aby drift nevratil chybu.
  values:
    ingress:
      api:
        path: /
        pathType: Prefix
      ui:
        path: /
        pathType: Prefix
      registry:
        path: /
        pathType: Prefix
      dex:
        path: /dex
        pathType: Prefix
