---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: jenkins
  namespace: flux-system
spec:
  image: jenkins/jenkins
  interval: 5m0s
  exclusionList:
    - '.*-rc.*$'
    - '.*-beta.*$'
    - '.*-alpha.*$'
    - '^latest$'
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: jenkins-lts
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: jenkins
  policy:
    semver:
      range: 2.555.x
  filterTags:
    pattern: '^2\.555\.[0-9]+-jdk21$'
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageUpdateAutomation
metadata:
  name: jenkins-auto-update
  namespace: flux-system
spec:
  interval: 10m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  git:
    checkout:
      ref:
        branch: main
    commit:
      author:
        email: flux-bot@local.domain
        name: flux-bot
      messageTemplate: 'chore(jenkins): update image'
    push:
      branch: main
  update:
    path: ./apps/jenkins/values.yaml
    strategy: Setters
