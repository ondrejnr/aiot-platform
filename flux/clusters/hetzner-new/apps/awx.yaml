---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: awx
  namespace: awx
spec:
  suspend: true
  interval: 30m
  releaseName: awx
  chart:
    spec:
      chart: ./apps/awx
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  install:
    createNamespace: true
  upgrade:
    cleanupOnFail: true
