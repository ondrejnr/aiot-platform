---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: cloudbeaver
  namespace: flux-system
spec:
  image: dbeaver/cloudbeaver
  interval: 5m0s
  exclusionList:
    - '.*-rc.*$'
    - '.*-beta.*$'
    - '.*-alpha.*$'
    - '^latest$'
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: cloudbeaver-stable
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: cloudbeaver
  policy:
    semver:
      range: 24.3.x
  filterTags:
    pattern: '^24\.3\.[0-9]+$'
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageUpdateAutomation
metadata:
  name: cloudbeaver-auto-update
  namespace: flux-system
spec:
  interval: 10m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  git:
    checkout:
      ref:
        branch: main
    commit:
      author:
        email: flux-bot@local.domain
        name: flux-bot
      messageTemplate: 'chore(cloudbeaver): update image'
    push:
      branch: main
  update:
    path: ./apps/cloudbeaver/values.yaml
    strategy: Setters
