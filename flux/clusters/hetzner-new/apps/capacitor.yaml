---
apiVersion: v1
kind: Namespace
metadata:
  name: flux-ui
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: capacitor
  namespace: flux-system
spec:
  type: oci
  interval: 12h
  url: oci://ghcr.io/gimlet-io/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: capacitor
  namespace: flux-ui
spec:
  interval: 30m
  releaseName: capacitor
  chart:
    spec:
      chart: capacitor-next
      version: "0.14.0"
      sourceRef:
        kind: HelmRepository
        name: capacitor
        namespace: flux-system
  install:
    createNamespace: true
  values:
    existingSecret:
      name: capacitor
    env:
      AUTH: noauth
      IMPERSONATE_SA_RULES: "noauth=flux-ui:capacitor-clusteradmin"
    ingress:
      enabled: true
      className: nginx
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
        nginx.ingress.kubernetes.io/ssl-redirect: "true"
      hosts:
        - host: capacitor.46.4.123.8.nip.io
          paths:
            - path: /
              pathType: Prefix
      tls:
        - hosts: [capacitor.46.4.123.8.nip.io]
          secretName: capacitor-tls
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: capacitor-clusteradmin
  namespace: flux-ui
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: capacitor-clusteradmin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: capacitor-clusteradmin
    namespace: flux-ui
