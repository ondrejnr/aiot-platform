apiVersion: v1
kind: Namespace
metadata:
  name: observability-logs
  labels:
    app.kubernetes.io/part-of: observability
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: observability-logs
spec:
  suspend: false
  interval: 30m
  releaseName: loki
  chart:
    spec:
      chart: ./apps/loki
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  install:
    createNamespace: true
  upgrade:
    cleanupOnFail: true
  postRenderers:
  - kustomize:
      patches:
      - target:
          version: v1
          kind: StatefulSet
          name: loki
          namespace: observability-logs
        patch: "apiVersion: apps/v1\nkind: StatefulSet\nmetadata:\n  name: loki\n\
          \  namespace: observability-logs\nspec:\n  template:\n    spec:\n      containers:\n\
          \        - name: loki\n          resources:\n            requests:\n   \
          \           cpu: 100m\n            limits:\n              cpu: 500m\n"
