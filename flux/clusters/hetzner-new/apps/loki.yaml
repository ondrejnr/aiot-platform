---
apiVersion: v1
kind: Namespace
metadata:
  name: observability-logs
  labels:
    app.kubernetes.io/part-of: observability
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: observability-logs
spec:
  suspend: false
  interval: 30m
  releaseName: loki
  chart:
    spec:
      chart: ./apps/loki
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  install:
    createNamespace: true
  upgrade:
    cleanupOnFail: true
