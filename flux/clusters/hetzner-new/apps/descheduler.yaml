---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: descheduler
  namespace: flux-system
spec:
  interval: 1h
  url: https://kubernetes-sigs.github.io/descheduler
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: descheduler
  namespace: descheduler
spec:
  suspend: true
  interval: 30m
  releaseName: descheduler
  chart:
    spec:
      chart: descheduler
      version: "0.31.0"
      sourceRef:
        kind: HelmRepository
        name: descheduler
        namespace: flux-system
      interval: 1h
  install:
    createNamespace: false
  values:
    kind: CronJob
    cronJobApiVersion: "batch/v1"
    schedule: "*/2 * * * *"
    suspend: true
