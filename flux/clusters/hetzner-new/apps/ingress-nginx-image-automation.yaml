---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: ingress-nginx-controller
  namespace: flux-system
spec:
  image: registry.k8s.io/ingress-nginx/controller
  interval: 5m0s
  exclusionList:
    - '.*-rc.*$'
    - '.*-beta.*$'
    - '.*-alpha.*$'
    - '^latest$'
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: ingress-nginx-controller-stable
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: ingress-nginx-controller
  policy:
    semver:
      range: '>=1.11.0-0 <2.0.0-0'
  filterTags:
    pattern: '^v1\.\d+\.\d+$'
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageUpdateAutomation
metadata:
  name: ingress-nginx-controller-auto-update
  namespace: flux-system
spec:
  interval: 10m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  git:
    checkout:
      ref:
        branch: main
    commit:
      author:
        email: flux-bot@local.domain
        name: flux-bot
      messageTemplate: 'chore(ingress-nginx): update controller image'
    push:
      branch: main
  update:
    path: ./apps/ingress-nginx/values.yaml
    strategy: Setters