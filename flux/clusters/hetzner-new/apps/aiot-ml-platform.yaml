apiVersion: v1
kind: Namespace
metadata:
  name: aiot-ml
  labels:
    app.kubernetes.io/part-of: aiot-ml-platform
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: aiot-ml-platform
  namespace: aiot-ml
spec:
  suspend: false
  interval: 30m
  releaseName: aiot-ml-platform
  chart:
    spec:
      chart: ./apps/aiot-ml-platform
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  install:
    createNamespace: true
  upgrade:
    cleanupOnFail: true
  postRenderers:
  - kustomize:
      patches:
      - target:
          version: v1
          kind: Deployment
          name: aiot-control-center
          namespace: aiot
        patch: "apiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: aiot-control-center\n\
          \  namespace: aiot\nspec:\n  template:\n    spec:\n      containers:\n \
          \       - name: app\n          resources:\n            requests:\n     \
          \         cpu: 50m\n            limits:\n              cpu: 300m\n"
      - target:
          version: v1
          kind: Deployment
          name: aiot-maintenance-api
          namespace: aiot
        patch: "apiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: aiot-maintenance-api\n\
          \  namespace: aiot\nspec:\n  template:\n    spec:\n      containers:\n \
          \       - name: app\n          resources:\n            requests:\n     \
          \         cpu: 50m\n            limits:\n              cpu: 300m\n"
      - target:
          version: v1
          kind: Deployment
          name: ollama
          namespace: local-ai
          resources:
            limits:
              cpu: 500m
        patch: "apiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: ollama\n\
          \  namespace: local-ai\nspec:\n  template:\n    spec:\n      containers:\n\
          \      - name: ollama\n        resources:\n          requests:\n       \
          \     cpu: 250m\n          limits:\n            cpu: 1000m\n"
      - target:
          version: v1
          kind: Deployment
          name: mlflow
          namespace: mlflow
        patch: "apiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: mlflow\n\
          \  namespace: mlflow\nspec:\n  template:\n    spec:\n      containers:\n\
          \        - name: mlflow\n          resources:\n            requests:\n \
          \             cpu: 100m\n            limits:\n              cpu: 500m\n"
