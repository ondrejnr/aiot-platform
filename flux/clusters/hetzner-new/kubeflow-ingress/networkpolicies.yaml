# Allow ingress-nginx to access kubeflow web apps
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-nginx-to-centraldashboard
  namespace: kubeflow
spec:
  podSelector:
    matchLabels:
      app: centraldashboard
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx
    ports:
    - port: 8082
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-nginx-to-jupyter-web-app
  namespace: kubeflow
spec:
  podSelector:
    matchLabels:
      app: jupyter-web-app
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx
    ports:
    - port: 5000
      protocol: TCP
