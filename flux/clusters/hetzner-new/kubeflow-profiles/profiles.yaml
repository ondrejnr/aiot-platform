---
apiVersion: v1
kind: Namespace
metadata:
  name: profiles-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    kustomize.component: profiles
  name: profiles-controller-service-account
  namespace: kubeflow
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    kustomize.component: profiles
  name: profiles-cluster-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: profiles-controller-service-account
    namespace: kubeflow
---
apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    kustomize.component: profiles
  name: profiles-config
  namespace: kubeflow
data:
  ADMIN: ""
  ISTIO_INGRESS_GATEWAY_PRINCIPAL: cluster.local/ns/istio-system/sa/istio-ingressgateway-service-account
  KFP_UI_PRINCIPAL: cluster.local/ns/kubeflow/sa/ml-pipeline-ui
  NOTEBOOK_CONTROLLER_PRINCIPAL: cluster.local/ns/kubeflow/sa/notebook-controller-service-account
  USERID_HEADER: kubeflow-userid
  USERID_PREFIX: ""
  WORKLOAD_IDENTITY: ""
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: namespace-labels-data
  namespace: kubeflow
data:
  namespace-labels.yaml: |
    pipelines.kubeflow.org/enabled: "true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    kustomize.component: profiles
  name: profiles-deployment
  namespace: kubeflow
spec:
  replicas: 1
  selector:
    matchLabels:
      kustomize.component: profiles
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        kustomize.component: profiles
        sidecar.istio.io/inject: "false"
    spec:
      serviceAccountName: profiles-controller-service-account
      containers:
        - name: manager
          image: ghcr.io/kubeflow/kubeflow/profile-controller:latest
          imagePullPolicy: IfNotPresent
          command:
            - /manager
            - -userid-header
            - $(USERID_HEADER)
            - -userid-prefix
            - $(USERID_PREFIX)
            - -workload-identity
            - $(WORKLOAD_IDENTITY)
          envFrom:
            - configMapRef:
                name: profiles-config
          ports:
            - containerPort: 9876
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9876
              scheme: HTTP
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 1
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 9876
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 3
          volumeMounts:
            - name: namespace-labels
              mountPath: /etc/profile-controller/namespace-labels.yaml
              subPath: namespace-labels.yaml
        - name: kfam
          image: ghcr.io/kubeflow/kubeflow/kfam:latest
          imagePullPolicy: IfNotPresent
          command:
            - /access-management
            - -cluster-admin
            - $(ADMIN)
            - -userid-header
            - $(USERID_HEADER)
            - -userid-prefix
            - $(USERID_PREFIX)
          envFrom:
            - configMapRef:
                name: profiles-config
          ports:
            - containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /metrics
              port: 8081
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 1
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /metrics
              port: 8081
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 3
      volumes:
        - name: namespace-labels
          configMap:
            name: namespace-labels-data
---
apiVersion: v1
kind: Service
metadata:
  labels:
    kustomize.component: profiles
  name: profiles-kfam
  namespace: kubeflow
spec:
  ports:
    - port: 8081
      protocol: TCP
      targetPort: 8081
  selector:
    kustomize.component: profiles
